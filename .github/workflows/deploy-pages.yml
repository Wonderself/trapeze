name: Verify and deploy Trapeze

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.0
          cache: npm
          cache-dependency-path: |
            game3d/package-lock.json
            tools/package-lock.json
      - name: Install dependencies
        run: |
          npm ci --prefix game3d
          npm ci --prefix tools
          npx --prefix tools playwright-core install --with-deps chromium
      - name: Build deployable site
        run: npm run build:artifact
      - name: Check Canvas games
        run: |
          for file in trapeze-stars-v1.html trapeze-stars-v2.html trapeze-city-v3.html 2d/index.html; do
            node tools/check.js "$file"
          done
          node tools/play_v3.js 6
          node tools/play_v2.js
          node tools/monkey_v1.js
          node tools/monkey_v1.js 2d/index.html
          node tools/monkey_v2.js
          node tools/monkey_v3.js
          node tools/reach_v3.js
      - name: Check pages, responsive layout and service-worker upgrades
        run: |
          npm run test:site
          npm run test:sw
      - name: Check full Three.js game flow
        run: node game3d/test/smoke3d.mjs
      - name: Configure GitHub Pages
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
