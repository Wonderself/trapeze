  const rsz=32*u;
  CX.lineJoin='round';
  CX.lineWidth=rsz*0.16;CX.strokeStyle='rgba(255,46,136,0.45)';
  tracked(t('results'),HW,SH*0.19,rsz,rsz*0.28,function(ch,x,y){CX.strokeText(ch,x,y);});
  CX.fillStyle='#FFFFFF';
  tracked(t('results'),HW,SH*0.19,rsz,rsz*0.28,function(ch,x,y){CX.fillText(ch,x,y);});
  const y0=SH*0.32, dy=Math.min(30*u,SH*0.075);
  const vals=[timeStr(runTime()),
    bestChain+' '+t('tricks'),
    maxStars+' / 5',
    String(falls),
    '$'+totalBank,
    '$'+score];
  for(let i=0;i<RES_K.length;i++){
    const y=y0+i*dy;
    outlineText(t(RES_K[i]),HW-14*u,y,14,'rgba(255,255,255,0.58)',700,'right');
    outlineText(vals[i],HW+14*u,y,16,'#FFFFFF',900,'left');
  }
  // Note sur trois, en étoiles.
  const g=gradeOf(), sr=13*u;
  const gy2=y0+RES_K.length*dy+22*u;
  outlineText(t('rGrade'),HW,gy2-20*u,12,'rgba(255,255,255,0.5)',800);
  for(let i=0;i<3;i++){
    const cx=HW+(i-1)*(sr*2.4);
    starPath(cx,gy2+6*u,sr);
    CX.fillStyle=i<g?'#FFD98A':'rgba(255,255,255,0.10)';CX.fill();
    CX.lineWidth=Math.max(1,1.5*u);
    CX.strokeStyle=i<g?'rgba(255,217,138,0.9)':'rgba(255,255,255,0.25)';CX.stroke();
  }
  const pulse=0.6+0.4*Math.sin(frame*0.09);
  CX.globalAlpha=pulse;
  outlineText(t('rAgain'),HW,SH-bh*0.5,14,'#25E5FF',800);
  CX.globalAlpha=1;
  zone(0,0,SW,SH,function(){startGame();});
  // Un lien discret vers le menu, POSÉ AU-DESSUS de la zone plein écran
  // ci-dessus : le registre garde le dernier inscrit, donc celui-ci gagne
  // sur le rectangle qui le précède.
  const mw=120*u,mh=32*u,mx=14*u,my=SH-bh*0.5;
  outlineText('← '+t('quit'),mx,my,12,'rgba(255,255,255,0.5)',700,'left');
  zone(mx-6*u,my-mh*0.5,mw,mh,function(e){toMenu();});
}

/* ─────────────────────────────────────────────────────────────
   18. LA MACHINE À ÉTATS DE LA TRAVERSÉE

   Trois actes, et une règle : les transitions sont MONOTONES et ne
   dépendent que de l'état courant. Une chute pendant un carton, un
   lâcher à l'instant d'une prise, un retour au menu en plein vol — rien
   de tout cela ne peut coincer la machine, parce qu'aucune transition
   n'attend qu'une autre soit finie.

   Noms conservés (startGame, togglePause, toMenu, loseLife, startFinale)
   pour que tools/check.js traverse les trois jeux avec le même pont.
   ───────────────────────────────────────────────────────────── */
function setAct(n){
  if(n<=act)return;      // monotone : un acte ne se rejoue jamais
  act=n;actT=ACT_CARD;
}
function startGame(){
  // La cinématique d'ouverture n'est pas un écran de chargement : c'est le
  // plan qui pose la ville, la hauteur et le premier rig. Elle se saute
  // d'une touche, et le mouvement réduit la supprime.
  gs=reducedMotion?'playing':'intro';
  introT=0;slowT=0;paused=false;
  lives=5;score=0;level=1;displayScore=0;
  hype=0;starsNow=0;gateOpen=0;act=1;actT=ACT_CARD;
  bankVal=0;bankN=0;
  runSteps=0;penalty=0;falls=0;totalBank=0;maxStars=0;bestChain=0;finT=0;
  for(let n=0;n<RIGS.length;n++){RIGS[n].giants=0;RIGS[n].giantOn=0;RIGS[n].ang=0;RIGS[n].angV=0;}
  for(let i=0;i<PORTS.length;i++){const c=PORTS[i];c.used=0;c.announced=0;c.phase=0;c.ready=false;}
  DRONE.live=0;DRONE.fade=0;
  partReset();ftReset();
  P.rig=0;P.dst=1;P.best=0;P.amp=0;
  respawn();
  CAMS.ready=false;
  toastT=0;
  musicPlay();
}
// La réception qui boucle le numéro : un temps de salut, puis le bilan.
function startFinale(){
  if(gs==='levelcomplete'||gs==='finale')return;
  gs='finale';finT=0;
  say(t('arrived'),'#25E5FF');
  ftext(P.x,P.y+3.0,P.z,t('bow'),'#FFD98A',26);
  burst(P.x,P.y+1.0,P.z,34,5.4,1,90,0.16);
  shake(9);
}
function endIntro(){if(gs==='intro'){gs='playing';introT=INTRO_LEN;}}
function toMenu(){gs='menu';paused=false;introT=0;slowT=0;musicStop();}
function togglePause(){if(gs==='playing')paused=!paused;}

/* ─────────────────────────────────────────────────────────────
   19. ENTRÉES
   Le pad tactile complet est le lot de la session 4. Ici, deux boutons et
   le glissement de caméra : de quoi ne pas être mort au doigt.
   ───────────────────────────────────────────────────────────── */
function action(){
  audioResume();
  if(gs==='menu'){startGame();return;}
  if(gs==='intro'){endIntro();return;}
  if(gs==='gameover'||gs==='levelcomplete'){startGame();return;}
  if(gs==='finale'){gs='levelcomplete';return;}   // passer le salut
  if(paused)return;
  if(P.state==='hang')pump();
  else P.grabBuf=CFG.GRAB_BUF;
}
function doRelease(){
  audioResume();
  if(gs==='intro'){endIntro();return;}
  if(gs!=='playing'||paused)return;
  release();
}
// Figure. Maintenue, elle accélère la rotation ; une simple pression
// suffit à en lancer une, pour que le jeu reste jouable sans keyup.
function figure(){
  audioResume();
  if(gs!=='playing'||paused)return;
  P.trickHeld=1;P.trickBuf=CFG.GRAB_BUF;
}
function figureEnd(){P.trickHeld=0;}
/* Navigation clavier des menus : haut/bas déplace la sélection, entrée
   ou espace l'active — avec un état visible, jamais un choix à l'aveugle. */
function menuNav(dir){
  if(gs==='menu')menuSel=(menuSel+dir+2)%2;
  else if(gs==='settings')settingsSel=(settingsSel+dir+settingsRowsV3().length)%settingsRowsV3().length;
  else if(paused)pauseSel=(pauseSel+dir+3)%3;
  sfx('ui');
}
function menuActivate(){
  if(gs==='menu'){if(menuSel===0)startGame();else openSettings();}
  else if(gs==='settings'){settingsRowsV3()[settingsSel].right();}
  else if(paused){[togglePause,openSettings,toMenu][pauseSel]();}
  else if(gs==='gameover'||gs==='levelcomplete'){startGame();}
}
window.addEventListener('keydown',function(e){
  const k=e.key;
  const menuLike=gs==='menu'||gs==='settings'||paused;
  if(menuLike){
    if(k==='ArrowUp'||k==='w'){e.preventDefault();menuNav(-1);return;}
    if(k==='ArrowDown'||k==='s'){e.preventDefault();menuNav(1);return;}
    if(k==='ArrowLeft'&&gs==='settings'){e.preventDefault();settingsRowsV3()[settingsSel].left();return;}
    if(k==='ArrowRight'&&gs==='settings'){e.preventDefault();settingsRowsV3()[settingsSel].right();return;}
    if(k==='Enter'){e.preventDefault();menuActivate();return;}
    if(k==='Escape'){e.preventDefault();
      if(gs==='settings')closeSettings();else if(paused)togglePause();else toMenu();
      return;}
  }
  if(k===' '||k==='Spacebar'||k==='z'||(k==='ArrowUp'&&!menuLike)){e.preventDefault();action();return;}
  if((k==='s'&&!menuLike)||k==='ArrowDown'||k==='Shift'){e.preventDefault();doRelease();return;}
  if(k==='f'||k==='F'||k==='x'||(!menuLike&&(k==='ArrowLeft'||k==='ArrowRight'))){e.preventDefault();figure();return;}
  if(k==='p'||k==='P'){togglePause();return;}
  if(k==='r'||k==='R'){startGame();return;}
  if(k==='Escape'){toMenu();return;}
  if(k==='F3'){e.preventDefault();debugOn=!debugOn;return;}
  if(k==='1'){setQuality('low');return;}
  if(k==='2'){setQuality('med');return;}
  if(k==='3'){setQuality('high');return;}
});
window.addEventListener('keyup',function(e){
  const k=e.key;
  if(k==='f'||k==='F'||k==='x'||k==='ArrowLeft'||k==='ArrowRight')figureEnd();
});
// Regard libre. Il revient de lui-même : on ne laisse jamais le joueur
// coincé face à un mur. La sensibilité et l'inversion d'axe sont des
// réglages, pas des constantes : ils passent par SV à chaque appel.
let dragId=-1, dragX=0, dragY=0;
function look(dx,dy){
  const s=SV.camSens, inv=SV.invertY?-1:1;
  CAMS.yawOff=clamp(CAMS.yawOff-dx*0.0032*s,-1.1,1.1);
  CAMS.pitchOff=clamp(CAMS.pitchOff+dy*0.0026*s*inv,-0.5,0.5);
}
// Convertit un point client en coordonnées de rendu (SW × SH) : le canevas
// est affiché à la taille CSS de l'écran mais dessine dans une résolution
// physique différente — confondre les deux fait manquer toutes les zones.
function toCanvasXY(clientX,clientY){
  const r=CV.getBoundingClientRect();
  const rw=r.width||1, rh=r.height||1;
  return{x:(clientX-r.left)*(SW/rw),y:(clientY-r.top)*(SH/rh)};
}
// Un menu est actif : le pointeur clique, il ne fait pas glisser la caméra.
function menuScreenActive(){return gs==='menu'||gs==='settings'||paused||gs==='gameover'||gs==='levelcomplete';}
function screenClick(px,py){
  audioResume();
  const fn=hitTest(px,py);
  if(fn){fn();return;}
  if(gs==='menu'||gs==='intro'||gs==='gameover'||gs==='levelcomplete'||gs==='finale')action();
}
CV.addEventListener('pointerdown',function(e){
  if(menuScreenActive()){
    const p2=toCanvasXY(e.clientX,e.clientY);
    screenClick(p2.x,p2.y);
    return;
  }
  if(gs==='intro'){endIntro();return;}
  if(gs==='finale'){audioResume();action();return;}   // tap-anywhere : passer le salut
  if(dragId<0){dragId=e.pointerId;dragX=e.clientX;dragY=e.clientY;}
});
CV.addEventListener('pointermove',function(e){
  if(e.pointerId!==dragId)return;
  look(e.clientX-dragX,e.clientY-dragY);
  dragX=e.clientX;dragY=e.clientY;
});
function endDrag(e){if(e.pointerId===dragId)dragId=-1;}
CV.addEventListener('pointerup',endDrag);
CV.addEventListener('pointercancel',endDrag);

(function bindTouch(){
  const a=document.getElementById('tAct'), r=document.getElementById('tRel');
  const f=document.getElementById('tFig');
  const pad=document.getElementById('pad');
  if(pad&&pad.classList&&isTouch)pad.classList.add('on');
  if(a)a.addEventListener('pointerdown',function(e){e.preventDefault();audioResume();action();});
  if(r)r.addEventListener('pointerdown',function(e){e.preventDefault();audioResume();doRelease();});
  if(f){
    f.addEventListener('pointerdown',function(e){e.preventDefault();audioResume();figure();});
    f.addEventListener('pointerup',function(e){e.preventDefault();figureEnd();});
    f.addEventListener('pointercancel',figureEnd);
    f.addEventListener('pointerleave',figureEnd);
  }
})();
/* Manche virtuel de regard. Il porte SON PROPRE pointerId, capturé sur son
   propre élément DOM : c'est ce qui garantit le multitouch réel — un doigt
   dessus et un doigt sur POMPER sont deux pointeurs indépendants, routés
   chacun vers son élément par le navigateur, sans code de coordination à
   écrire. Le stick ne fait QUE piloter le regard libre (CAMS.yawOff /
   pitchOff), exactement comme le glissement sur le reste de l'écran : le
   corps de l'acrobate suit la physique du trapèze, il n'a rien à orienter. */
(function bindStick(){
  const base=document.getElementById('stick'), knob=document.getElementById('stickKnob');
  if(!base||!knob)return;
  let sid=-1, cx=0, cy=0, R=52;
  function setKnob(dx,dy){knob.style.transform='translate('+dx+'px,'+dy+'px)';}
  base.addEventListener('pointerdown',function(e){
    if(sid>=0)return;
    e.preventDefault();
    sid=e.pointerId;
    try{base.setPointerCapture(sid);}catch(err){}
    const r=base.getBoundingClientRect();
    cx=r.left+r.width*0.5;cy=r.top+r.height*0.5;R=r.width*0.40;
    base.classList.add('active');
  });
  base.addEventListener('pointermove',function(e){
    if(e.pointerId!==sid)return;
    let dx=e.clientX-cx, dy=e.clientY-cy;
    const d=Math.hypot(dx,dy);
    if(d>R){dx=dx/d*R;dy=dy/d*R;}
    setKnob(dx,dy);
    // Le stick pilote le regard EN CONTINU, proportionnellement à son
    // écart au centre — contrairement au glissement, qui pilote une
    // vitesse par différence de position d'une image à l'autre.
    look(dx*0.16,dy*0.16);
  });
  function releaseStick(e){
    if(e.pointerId!==sid)return;
    sid=-1;setKnob(0,0);base.classList.remove('active');
  }
  base.addEventListener('pointerup',releaseStick);
  base.addEventListener('pointercancel',releaseStick);
})();
(function bindPause(){
  const b=document.getElementById('btnPause');
  if(!b)return;
  b.addEventListener('click',function(){
    audioResume();
    if(gs==='playing')togglePause();
    else if(paused)togglePause();
  });
})();
(function bindFull(){
  const b=document.getElementById('btnFull');
  if(!b)return;
  b.addEventListener('click',function(){
    const el=document.documentElement;
    try{
      if(document.fullscreenElement||document.webkitFullscreenElement){
        if(document.exitFullscreen)document.exitFullscreen();
        else if(document.webkitExitFullscreen)document.webkitExitFullscreen();
      }else if(el.requestFullscreen)el.requestFullscreen();
      else if(el.webkitRequestFullscreen)el.webkitRequestFullscreen();
    }catch(err){}
  });
})();

/* ─────────────────────────────────────────────────────────────
   20. BOUCLE PRINCIPALE
   Pas de temps fixe à 1/120 s. La physique du pendule devient instable en
   dessous, et le jeu doit être identique en 60 Hz et en 120 Hz.
   ───────────────────────────────────────────────────────────── */
const STEP=1000/120;
let acc=0, lastT=0, fpsAcc=0, fpsN=0;
function step(){
  frame++;
  if(toastT>0)toastT--;
  if(actT>0)actT--;
  for(let i=0;i<5;i++)if(starPopT[i]>0)starPopT[i]--;
  updateAmbience();
  musicWatchStars();
  duckMusic(paused||gs==='menu'||gs==='settings');
  if(gs==='intro'){
    introT++;
    stepPorteurs();
    if(introT>=INTRO_LEN)gs='playing';
  }else if(gs==='playing'&&!paused){
    runSteps++;
    stepPorteurs();
    stepPlayer();
    // La porte de l'acte 1 : deux étoiles de hype ouvrent la traversée.
    // Elle est testée ICI et pas dans addHype, pour qu'elle ne dépende
    // d'aucun chemin d'événement particulier — c'est ce qui la rend
    // insensible à l'ordre des choses.
    if(!gateOpen&&hypeStars()>=CFG.GATE_STARS){
      gateOpen=1;setAct(2);
      say(t('gateOpen'),'#25E5FF');
      burst(P.x,P.y+1.2,P.z,20,4.4,1,64,0.14);
    }
  }else if(gs==='finale'&&!paused){
    finT++;
    stepPorteurs();
    stepPlayer();               // le salut : l'acrobate continue de balancer
    if(finT>240)gs='levelcomplete';
  }
  stepParticles();
  stepTexts();
  stepDrone();
  stepCamera();
}
function frameLoop(now){
  requestAnimationFrame(frameLoop);
  if(!lastT)lastT=now;
  let dt=now-lastT;lastT=now;
  if(dt>250)dt=STEP;                 // onglet réveillé : on ne rattrape pas
  watchPerf(dt);
  // Le ralenti étire le TEMPS DE JEU sans toucher au pas de simulation :
  // on nourrit simplement l'accumulateur moins vite. La physique reste
  // identique, elle avance seulement plus lentement dans le temps réel.
  let dtGame=dt;
  if(slowT>0){slowT-=dt;dtGame=dt*0.34;}
  fpsAcc+=dt;fpsN++;
  if(fpsAcc>500){fps=1000/(fpsAcc/fpsN);fpsAcc=0;fpsN=0;}
  acc+=dtGame;
  let n=0;
  while(acc>=STEP&&n<10){acc-=STEP;n++;step();}
  // Le temps d'image affiché par le navigateur est plafonné par la
  // synchronisation verticale : il ne dit rien du coût réel. On mesure donc
  // le temps passé dans render(), qui est la vraie marge disponible.
  const t0=performance.now();
  render();
  const t1=performance.now();
  rtSamples[rtN++%rtSamples.length]=t1-t0;
  if(rtN>rtSamples.length)rtFull=true;
}
const rtSamples=new Float64Array(120);let rtN=0,rtFull=false;
function renderMs(){
  const n=rtFull?rtSamples.length:rtN;
  if(!n)return{p50:0,p95:0};
  const a=Array.prototype.slice.call(rtSamples,0,n).sort(function(x,y){return x-y;});
  return{p50:a[(n*0.5)|0],p95:a[Math.min(n-1,(n*0.95)|0)]};
}

/* ─────────────────────────────────────────────────────────────
   21. DÉMARRAGE ET PONT DE DÉBOGAGE
   ───────────────────────────────────────────────────────────── */
function init(){
  buildMaterials();
  buildWindowColours();
  buildCity();
  buildRoute();
  respawn();
  resize();
  requestAnimationFrame(frameLoop);
}
// Pont exposé pour les outils : shot_v3.js et le pilote automatique de la
// session 2 en dépendent, et il évite de deviner l'état depuis l'extérieur.
window.__v3={
  CFG:CFG,P:P,CAM:CAM,RIGS:RIGS,PORTS:PORTS,
  get state(){return{gs:gs,paused:paused,score:score,lives:lives,
    rig:P.rig,dst:P.dst,pstate:P.state,amp:P.amp,ang:P.ang,angV:P.angV,
    x:P.x,y:P.y,z:P.z,
    // Session 2 : tout ce dont le pilote automatique et les captures
    // ont besoin, pour qu'aucun outil n'ait à deviner un état interne.
    hype:hype,stars:hypeStars(),mult:hypeMult(),bank:bankVal,bankN:bankN,
    act:act,gate:gateOpen,falls:falls,time:runTime(),penalty:penalty,
    totalBank:totalBank,bestChain:bestChain,maxStars:maxStars,grade:gradeOf(),
    wind:P.windA,windNow:windNow(RIGS[P.rig]),
    port:(function(){const c=portOf(P.rig);return c?{ready:!!c.ready,used:!!c.used,ang:c.ang}:null;})(),
    drone:DRONE.fade,parts:pLive,partsMax:pLiveMax,partsCap:PCAP,
    faces:drawnFaces,dropped:fnDropped,winFaces:winFaces,winDrawn:winDrawn,fps:fps,
    qual:QUAL.name,sw:SW,sh:SH,render:renderMs()};},
  action:action,release:doRelease,figure:figure,figureEnd:figureEnd,
  start:startGame,menu:toMenu,finale:startFinale,
  pause:togglePause,quality:setQuality,
  debug:function(v){debugOn=!!v;},
  look:look,
  // Session 4 : menus, réglages, accessibilité — exposés pour
  // monkey_v3.js et les captures, sur le même principe que le reste du
  // pont : rien que l'outil n'ait à deviner depuis l'extérieur.
  hitZones:hitZones,hitTest:hitTest,
  openSettings:openSettings,closeSettings:closeSettings,
  menuNav:menuNav,menuActivate:menuActivate,
  get menuSel(){return menuSel;},set menuSel(v){menuSel=v;},
  get settingsSel(){return settingsSel;},set settingsSel(v){settingsSel=v;},
  get pauseSel(){return pauseSel;},set pauseSel(v){pauseSel=v;},
  settingsRows:settingsRowsV3,
  SV:SV,setVol:setVol,setLang:setLang,
  screenClick:screenClick,
  audioReady:function(){return AU.ready;},
  // Utilisé par les tests : place le joueur sur un rig donné, au repos.
  // Ouvre aussi la porte de l'acte 1, sinon toute capture à partir du rig 2
  // partirait d'un état que le jeu n'autorise pas encore.
  goRig:function(n){
    endIntro();
    P.rig=clamp(n|0,0,RIGS.length-1);
    if(P.rig>0){gateOpen=1;if(act<2)act=2;}
    if(P.rig>=RIGS.length-2&&act<3)act=3;
    respawn();CAMS.ready=false;
  },
  // Bascule les effets de post-traitement un par un. Sert à mesurer ce que
  // chacun coûte vraiment : sans ça, on optimise au jugé.
  postFlags:function(o){for(const k in o)QUAL[k]=o[k];},
  // Force la hype, pour cadrer le drone ou franchir la porte en test.
  setHype:function(v){hype=clamp(v,0,CFG.HYPE_MAX);refreshStars();},
  setAmp:function(a){const r=RIGS[P.rig];P.ang=0;P.angV=0.0001;setAmp(r,a);},
  // Avance la simulation d'un nombre exact de pas : les captures de test
  // sont ainsi reproductibles, au lieu de dépendre du temps réel écoulé.
  sim:function(n){for(let i=0;i<(n|0);i++)step();},
  // Fige la caméra à un endroit choisi. Sert notamment à la coller contre
  // un mur pour vérifier le découpage au plan proche.
  freeze:function(x,y,z,yaw,pitch){
    camFrozen=true;CAM.x=x;CAM.y=y;CAM.z=z;
    CAM.yaw=yaw;CAM.pitch=pitch||0;CAM.shakeX=0;CAM.shakeY=0;skyDirty=true;
  },
  unfreeze:function(){camFrozen=false;CAMS.ready=false;},
  // Renvoie la tour occupée la plus proche d'un point : de quoi viser un
  // mur sans le coder en dur.
  nearestTower:function(x,z){
    let best=null,bd=1e9;
    for(let j=0;j<G;j++)for(let i=0;i<G;i++){
      const k=j*G+i;if(!tOcc[k])continue;
      const d=Math.hypot(tX[k]-x,tZ[k]-z);
      if(d<bd){bd=d;best={x:tX[k],z:tZ[k],w:tW[k],d:tD[k],h:tH[k]};}
    }
    return best;
  },
};
init();
</script>
