  CX.beginPath();CX.moveTo(cx1,cy1);CX.lineTo(ax1,ay1);
  CX.moveTo(cx2,cy2);CX.lineTo(ax2,ay2);CX.stroke();
  CX.strokeStyle='#D8C28A';
  CX.lineWidth=Math.max(1.2,0.11*k);
  CX.lineCap='round';
  CX.beginPath();CX.moveTo(ax1,ay1);CX.lineTo(ax2,ay2);CX.stroke();
}

/* ─────────────────────────────────────────────────────────────
   15 bis. LE FILET, LE PORTEUR, LE DRONE, LES PARTICULES

   Tout ce qui s'ajoute au décor de la session 1. Le filet et le porteur
   sont tracés en segments projetés, comme l'acrobate : ils sont trop fins
   pour mériter des faces, et leur épaisseur suit l'échelle de projection.
   Le drone, lui, est un volume : il passe par le tampon de faces et se
   trie donc correctement avec la ville.
   ───────────────────────────────────────────────────────────── */

/* Le filet du numéro, tendu sous le vol en cours. Il n'est pas dessiné
   sur toute la traversée : seulement sous le segment courant, là où il
   sert. Une grille de mailles projetées, deux passes de lignes. */
function drawNet(){
  const a=RIGS[P.rig], b=RIGS[P.dst]||a;
  const ny=netYNow();
  const dx=b.x-a.x, dz=b.z-a.z;
  const L=Math.hypot(dx,dz)||1;
  const ux=dx/L, uz=dz/L, px=uz, pz=-ux;
  // Le panneau couvre le segment ET l'acrobate. Un lâcher parti vers
  // l'arrière l'emmène derrière son propre rig : le filet le rattrapait
  // bien, mais il n'était dessiné nulle part sous lui. On étend donc la
  // nappe jusqu'à lui au lieu de la laisser accrochée au segment.
  const tP=(P.x-a.x)*ux+(P.z-a.z)*uz;
  const wP=(P.x-a.x)*px+(P.z-a.z)*pz;
  const t0=Math.min(-7,tP-10), t1=Math.max(L+7,tP+10);
  const HALF=Math.max(11,Math.abs(wP)+8);
  const near=(P.state==='net')?1:0;
  CX.strokeStyle=near?'rgba(240,236,220,0.55)':'rgba(226,214,196,0.28)';
  CX.lineWidth=Math.max(0.6,1.1*DPR);
  CX.beginPath();
  const N=7, M=5;
  for(let i=0;i<=N;i++){
    const tt=t0+(t1-t0)*(i/N);
    let started=false;
    for(let j=0;j<=M;j++){
      const w=-HALF+2*HALF*(j/M);
      if(!project(a.x+ux*tt+px*w,ny,a.z+uz*tt+pz*w)){started=false;continue;}
      if(!started){CX.moveTo(_px,_py);started=true;}else CX.lineTo(_px,_py);
    }
  }
  for(let j=0;j<=M;j++){
    const w=-HALF+2*HALF*(j/M);
    let started=false;
    for(let i=0;i<=N;i++){
      const tt=t0+(t1-t0)*(i/N);
      if(!project(a.x+ux*tt+px*w,ny,a.z+uz*tt+pz*w)){started=false;continue;}
      if(!started){CX.moveTo(_px,_py);started=true;}else CX.lineTo(_px,_py);
    }
  }
  CX.stroke();
}

/* Le porteur. Pendu par les jarrets à son propre trapèze, dans le plan du
   vol. Ses bras sont TENDUS pendant la fenêtre et RENTRÉS en dehors :
   l'annonce est dans la pose, pas seulement dans un texte. */
const _PJX=new Float64Array(8), _PJY=new Float64Array(8), _PJK=new Float64Array(8);
function pjoint(i,x,y,z){
  if(!project(x,y,z)){_PJK[i]=0;return false;}
  _PJX[i]=_px;_PJY[i]=_py;_PJK[i]=_pk;return true;
}
function pseg(i,j,rad,col){
  const k=(_PJK[i]+_PJK[j])*0.5;
  if(k<=0)return;
  CX.strokeStyle=col;CX.lineWidth=Math.max(1,rad*2*k);
  CX.beginPath();CX.moveTo(_PJX[i],_PJY[i]);CX.lineTo(_PJX[j],_PJY[j]);CX.stroke();
}
function drawPorteur(c){
  const s=Math.sin(c.ang), co=Math.cos(c.ang);
  const ux=c.dx*s, uy=-co, uz=c.dz*s;          // direction ancrage → mains
  const hang=c.rope-1.9;                        // la barre, puis le corps
  const bx=c.ax+ux*hang, by=c.ay+uy*hang, bz=c.az+uz*hang;
  const nx=c.dz*0.62, nz=-c.dx*0.62;
  // Câbles vers les deux tours : c'est ce qui explique qu'il tient en l'air.
  const A=RIGS[c.from], B=RIGS[c.from+1];
  CX.strokeStyle='rgba(226,214,196,0.24)';
  CX.lineWidth=Math.max(0.6,1.0*DPR);
  CX.beginPath();
  if(project(c.ax,c.ay,c.az)){
    const gx=_px, gy=_py;
    if(project(A.ax,A.ay+0.4,A.az)){CX.moveTo(gx,gy);CX.lineTo(_px,_py);}
    if(B&&project(B.ax,B.ay+0.4,B.az)){CX.moveTo(gx,gy);CX.lineTo(_px,_py);}
  }
  CX.stroke();
  // Câbles du trapèze du porteur, puis sa barre.
  CX.strokeStyle='rgba(226,214,196,0.55)';
  CX.beginPath();
  if(project(c.ax+nx,c.ay,c.az+nz)){
    const p1x=_px,p1y=_py;
    if(project(bx+nx,by,bz+nz)){CX.moveTo(p1x,p1y);CX.lineTo(_px,_py);}
  }
  if(project(c.ax-nx,c.ay,c.az-nz)){
    const p2x=_px,p2y=_py;
    if(project(bx-nx,by,bz-nz)){CX.moveTo(p2x,p2y);CX.lineTo(_px,_py);}
  }
  CX.stroke();
  if(!pjoint(0,bx+nx,by,bz+nz))return;
  if(!pjoint(1,bx-nx,by,bz-nz))return;
  pseg(0,1,0.10,'#D8C28A');
  // Corps : jarrets à la barre, tronc vers le bas, bras selon la fenêtre.
  const kx=bx, ky=by, kz=bz;
  const hipX=c.ax+ux*(hang+0.62), hipY=c.ay+uy*(hang+0.62), hipZ=c.az+uz*(hang+0.62);
  const shX=c.ax+ux*(hang+1.42), shY=c.ay+uy*(hang+1.42), shZ=c.az+uz*(hang+1.42);
  // Bras tendus vers l'amont, là d'où arrive le voltigeur.
  const reach=c.ready?1:0.34;
  const hx=shX+ux*0.50*reach-c.dx*0.30*reach, hy=shY+uy*0.50*reach, hz2=shZ+uz*0.50*reach-c.dz*0.30*reach;
  if(!pjoint(2,kx,ky,kz))return;
  if(!pjoint(3,hipX,hipY,hipZ))return;
  if(!pjoint(4,shX,shY,shZ))return;
  if(!pjoint(5,hx,hy,hz2))return;
  const suit=c.ready?'#2FB8D8':'#1E6C80';
  pseg(2,3,0.10,suit);
  pseg(3,4,0.145,suit);
  pseg(4,5,0.085,c.ready?'#F2C79B':'#C9A886');
  // Tête, et le halo qui signe la fenêtre ouverte.
  if(pjoint(6,shX+ux*0.30,shY+uy*0.30,shZ+uz*0.30)){
    CX.fillStyle='#F2C79B';
    CX.beginPath();CX.arc(_PJX[6],_PJY[6],Math.max(1,0.14*_PJK[6]),0,6.2832);CX.fill();
  }
  if(c.ready&&_PJK[5]>0){
    CX.fillStyle='rgba(255,217,138,0.22)';
    CX.beginPath();CX.arc(_PJX[5],_PJY[5],Math.max(2,CFG.PORT_R*0.55*_PJK[5]),0,6.2832);CX.fill();
  }
}

/* Le drone. Un volume dans le tampon de faces (il se trie donc avec la
   ville), plus ses hélices et son feu, tracés en superposition. */
function collectDrone(){
  if(!DRONE.live||DRONE.fade<=0.02)return;
  const dx=Math.cos(DRONE.ang+Math.PI*0.5), dz=Math.sin(DRONE.ang+Math.PI*0.5);
  const col=MAT_STRUCT+5;
  pushBoxDir(DRONE.x,DRONE.y,DRONE.z,dx,dz,0.62,0.40,0.20,col);
  if(QUAL.name!=='low'){
    pushBoxDir(DRONE.x,DRONE.y+0.16,DRONE.z,dx,dz,0.96,0.07,0.045,MAT_STRUCT);
    pushBoxDir(DRONE.x,DRONE.y+0.16,DRONE.z,-dz,dx,0.96,0.07,0.045,MAT_STRUCT);
  }
}
function drawDroneBits(){
  if(!DRONE.live||DRONE.fade<=0.02)return;
  const dx=Math.cos(DRONE.ang+Math.PI*0.5), dz=Math.sin(DRONE.ang+Math.PI*0.5);
  const px=-dz, pz=dx;
  const a=DRONE.fade;
  for(let i=0;i<4;i++){
    const sx=(i<2?1:-1)*0.78, sy=((i%2)?1:-1)*0.78;
    const rx=DRONE.x+dx*sx+px*sy, ry=DRONE.y+0.22, rz=DRONE.z+dz*sx+pz*sy;
    if(!project(rx,ry,rz))continue;
    const r=Math.max(1.6,0.42*_pk);
    CX.strokeStyle='rgba(180,210,255,'+(0.30*a).toFixed(3)+')';
    CX.lineWidth=Math.max(1,0.9*DPR);
    CX.beginPath();CX.ellipse(_px,_py,r,r*0.30,0,0,6.2832);CX.stroke();
    // Deux pales figées par l'échantillonnage : c'est le rendu d'une hélice
    // qui tourne plus vite que l'image, et c'est exactement ce qu'on voit.
    const ph=DRONE.rot+i*1.7;
    CX.beginPath();
    CX.moveTo(_px-Math.cos(ph)*r,_py-Math.sin(ph)*r*0.30);
    CX.lineTo(_px+Math.cos(ph)*r,_py+Math.sin(ph)*r*0.30);
    CX.stroke();
  }
  // Feu de position et objectif tourné vers l'acrobate.
  if(project(DRONE.x,DRONE.y-0.26,DRONE.z)){
    const blink=(DRONE.t%74)<30?1:0.15;
    CX.fillStyle='rgba(255,60,90,'+(a*blink*0.9).toFixed(3)+')';
    CX.beginPath();CX.arc(_px,_py,Math.max(1.2,0.13*_pk),0,6.2832);CX.fill();
    const g=CX.createRadialGradient(_px,_py,0,_px,_py,Math.max(6,0.9*_pk));
    g.addColorStop(0,'rgba(255,80,110,'+(a*blink*0.30).toFixed(3)+')');
    g.addColorStop(1,'rgba(255,80,110,0)');
    CX.fillStyle=g;CX.beginPath();CX.arc(_px,_py,Math.max(6,0.9*_pk),0,6.2832);CX.fill();
  }
}

/* Particules : un chemin par teinte, six remplissages au maximum pour
   toute la nuée. Aucune chaîne construite, aucun objet créé. */
function drawParticles(){
  if(pLive<=0)return;
  for(let c=0;c<PART_COLS.length;c++){
    let any=false;
    CX.beginPath();
    for(let i=0;i<PCAP;i++){
      if(pLife[i]<=0||pCol[i]!==c)continue;
      if(!project(pX[i],pY[i],pZ[i]))continue;
      const k=pLife[i]/pMax[i];
      const r=Math.max(0.7,pR[i]*_pk*(0.35+0.65*k));
      CX.moveTo(_px+r,_py);
      CX.arc(_px,_py,r,0,6.2832);
      any=true;
    }
    if(any){CX.globalAlpha=0.85;CX.fillStyle=PART_COLS[c];CX.fill();CX.globalAlpha=1;}
  }
}

/* Textes flottants. Ils appartiennent au monde (ils sont projetés) mais
   sont tracés à plat : c'est la convention de Deluxe, elle reste lisible
   quelle que soit l'orientation de la caméra. */
function drawFloatTexts(){
  CX.textAlign='center';CX.textBaseline='middle';
  for(let i=0;i<FTMAX;i++){
    const f=FT[i];if(!f.live)continue;
    if(!project(f.x,f.y,f.z))continue;
    const k=1-f.t/f.max;
    const sz=Math.max(9,Math.min(46,f.size*uiScale*0.55*Math.min(2.2,_pk*0.06+0.5)));
    CX.globalAlpha=k<0.28?k/0.28:1;
    CX.font='800 '+Math.round(sz)+'px '+FONT;
    CX.lineJoin='round';CX.lineWidth=Math.max(2,sz*0.22);
    CX.strokeStyle='rgba(6,2,16,0.72)';CX.strokeText(f.txt,_px,_py);
    CX.fillStyle=f.col;CX.fillText(f.txt,_px,_py);
  }
  CX.globalAlpha=1;
}

/* ─────────────────────────────────────────────────────────────
   16. RENDU
   Ordre strict : ciel, sol, volumes triés, et l'acrobate INSÉRÉ dans la
   pile triée à sa propre profondeur — pas plaqué devant tout le monde.
   ───────────────────────────────────────────────────────────── */
const OVCAP=32;
const ovD=new Float64Array(OVCAP), ovT=new Int32Array(OVCAP), ovN=new Int32Array(OVCAP);
const ovOrder=[];
// Types de superposition : 0 barre, 1 acrobate, 2 porteur, 3 filet.
function render(){
  camPrepare();
  CX.setTransform(1,0,0,1,0,0);
  drawSky();
  facesReset();
  collectCity();
  collectRigs();
  collectDrone();
  sortFaces();

  // Superpositions : chacune est INSÉRÉE à sa propre profondeur dans la
  // pile triée, jamais plaquée devant tout le monde.
  let on=0;
  for(let n=0;n<RIGS.length&&on<OVCAP-4;n++){
    const rig=RIGS[n];
    if(n===P.rig&&P.state==='hang')continue;   // dessinée avec l'acrobate
    barAt(rig,rig.ang);
    ovD[on]=eyeZ(_bx,_by,_bz);ovT[on]=0;ovN[on]=n;on++;
  }
  for(let i=0;i<PORTS.length&&on<OVCAP-2;i++){
    const c=PORTS[i];
    portHands(c,c.ang);
    ovD[on]=eyeZ(_hx,_hy,_hz);ovT[on]=2;ovN[on]=i;on++;
  }
  if(gs==='playing'||gs==='finale'){
    const a=RIGS[P.rig], b=RIGS[P.dst]||a;
    ovD[on]=eyeZ((a.x+b.x)*0.5,netYNow(),(a.z+b.z)*0.5);ovT[on]=3;ovN[on]=0;on++;
  }
  ovD[on]=eyeZ(P.x,P.y-0.9,P.z);ovT[on]=1;ovN[on]=P.rig;on++;
  ovOrder.length=on;
  for(let i=0;i<on;i++)ovOrder[i]=i;
  ovOrder.sort(function(a,b){return ovD[b]-ovD[a];});

  let cursor=fStart;
  for(let i=0;i<on;i++){
    const o=ovOrder[i];
    const cut=faceSplit(ovD[o]);
    if(cut>cursor){drawFaceRange(cursor,cut);cursor=cut;}
    const ty=ovT[o];
    if(ty===0)drawBar(RIGS[ovN[o]],RIGS[ovN[o]].ang);
    else if(ty===2)drawPorteur(PORTS[ovN[o]]);
    else if(ty===3)drawNet();
    else{
      if(P.state==='hang')drawBar(RIGS[P.rig],P.ang);
      drawAcrobat();
    }
  }
  if(cursor<fn)drawFaceRange(cursor,fn);

  // Couche des billboards : hélices du drone, particules, textes du monde.
  drawDroneBits();
  drawParticles();
  drawFloatTexts();

  drawHUD();
}

/* ─────────────────────────────────────────────────────────────
   17. ÉTAT DE JEU ET INTERFACE
   Le HUD complet — radar des toits, étoiles de hype, compteur de cagnotte —
   est le lot de la session 4. Ici : le strict nécessaire pour piloter et
   pour vérifier le socle.
   ───────────────────────────────────────────────────────────── */
let gs='menu';            // 'menu' | 'playing' | 'finale' | 'levelcomplete' | 'gameover'
let paused=false;
// `lives` et l'état 'gameover' ne servent plus au jeu : une chute ne coûte
// plus de vie, le filet rattrape et on repart du dernier toit. Les deux
// restent déclarés et rendus parce que tools/check.js traverse les trois
// jeux avec le même pont de test et force cet état ; le jeu, lui, n'y entre
// jamais de lui-même.
let lives=5, score=0, level=1, frame=0;
let debugOn=false, fps=60, faceAvg=0;

function uiFont(size,weight){CX.font=(weight||700)+' '+Math.round(size*uiScale)+'px '+FONT;}
function outlineText(txt,x,y,size,col,weight,align){
  uiFont(size,weight);
  CX.textAlign=align||'center';CX.textBaseline='middle';
  CX.lineJoin='round';CX.lineWidth=Math.max(2,size*uiScale*0.22);
  CX.strokeStyle='rgba(6,2,16,0.72)';CX.strokeText(txt,x,y);
  CX.fillStyle=col;CX.fillText(txt,x,y);
}

// Le chrono n'est reformaté qu'au dixième de seconde : une chaîne par
// image pour un affichage qui ne change pas serait du gaspillage pur.
let _tStr='0:00.0', _tKey=-1;
function timeStr(sec){
  const k=(sec*10)|0;
  if(k!==_tKey){
    _tKey=k;
    const m=(k/600)|0, r=k-m*600;
    const ss=(r/10)|0;
    _tStr=m+':'+(ss<10?'0':'')+ss+'.'+(r%10);
  }
  return _tStr;
}

// Étoile à cinq branches. Le rendu définitif est le lot de la session 4 ;
// ici la forme est juste, la finition ne l'est pas encore.
function starPath(cx,cy,r){
  CX.beginPath();
  for(let i=0;i<10;i++){
    const a=-Math.PI*0.5+i*Math.PI/5;
    const rr=(i%2)?r*0.44:r;
    const x=cx+Math.cos(a)*rr, y=cy+Math.sin(a)*rr;
    if(i)CX.lineTo(x,y);else CX.moveTo(x,y);
  }
  CX.closePath();
}
// x est le bord DROIT de la rangee : c'est la colonne du HUD qui commande,
// et une rangee de cinq etoiles ne doit jamais deborder de l'ecran.
function drawHypeStars(xRight,y,r,gap){
  const x=xRight-r-4*(2*r+gap);
  const st=hypeStars();
  // Fraction de l'étoile en cours : la jauge doit se lire AVANT de gagner
  // l'étoile, sinon le joueur ne sait pas s'il progresse.
  const frac=clamp((hype-st*CFG.STAR_STEP)/CFG.STAR_STEP,0,1);
  for(let i=0;i<5;i++){
    const cx=x+i*(r*2+gap);
    starPath(cx,y,r);
    CX.fillStyle='rgba(10,4,26,0.55)';CX.fill();
    CX.lineWidth=Math.max(1,1.4*uiScale);
    CX.strokeStyle=i<st?'rgba(255,217,138,0.95)':'rgba(255,255,255,0.26)';CX.stroke();
    if(i<st){starPath(cx,y,r*0.92);CX.fillStyle='#FFD98A';CX.fill();}
    else if(i===st&&frac>0.02){
      CX.save();CX.beginPath();
      CX.rect(cx-r,y+r-2*r*frac,2*r,2*r*frac);CX.clip();
      starPath(cx,y,r*0.92);CX.fillStyle='rgba(255,217,138,0.42)';CX.fill();
      CX.restore();
    }
  }
}

function drawHUD(){
  const u=uiScale;
  if(gs==='menu'){
    CX.fillStyle='rgba(8,3,22,0.52)';CX.fillRect(0,0,SW,SH);
    outlineText(t('title'),HW,SH*0.38,44,'#FFFFFF',900);
    outlineText(t('sub'),HW,SH*0.38+40*u,15,'rgba(255,255,255,0.62)',700);
    outlineText(t('hintStart'),HW,SH*0.60,18,'#25E5FF',800);
    outlineText(t('pump')+'   ·   '+t('release')+'   ·   '+t('figure'),
      HW,SH*0.60+30*u,13,'rgba(255,255,255,0.5)',700);
    return;
  }
  if(gs==='levelcomplete'){drawResults();return;}

  // ── Jauge d'amplitude, à gauche ──
  const gx=26*u, gy=SH-38*u, gw=Math.min(SW*0.34,240*u), gh=9*u;
  CX.fillStyle='rgba(8,3,22,0.55)';CX.fillRect(gx,gy,gw,gh);
  const k=clamp(P.amp/CFG.AMP_MAX,0,1);
  CX.fillStyle=P.amp>=CFG.GIANT?'#FF2E88':'#25E5FF';
  CX.fillRect(gx,gy,gw*k,gh);
  CX.fillStyle='rgba(255,255,255,0.30)';
  CX.fillRect(gx+gw*(CFG.GIANT/CFG.AMP_MAX),gy-3*u,2*u,gh+6*u);
  outlineText(P.amp>=CFG.GIANT?t('giant'):t('amp'),gx,gy-13*u,11,
    P.amp>=CFG.GIANT?'#FF2E88':'rgba(255,255,255,0.72)',800,'left');

  // ── Étoiles de hype et multiplicateur, en haut à droite ──
  // Le bouton plein écran est un élément HTML posé par-dessus le canvas :
  // il faut lui laisser sa place, sinon le HUD passe dessous en portrait.
  const rx=SW-(46*DPR+10*u);
  drawHypeStars(rx,20*u,7*u,3*u);
  const st=hypeStars();
  if(st>0)outlineText('×'+hypeMult().toFixed(1),rx,40*u,13,'#FFD98A',900,'right');
  // ── Cagnotte, façon compteur de fric ──
  outlineText('$'+score,rx,64*u,22,'#9CFF7A',900,'right');
  if(bankVal>0){
    outlineText('+'+Math.round(bankVal)+' × '+(hypeMult()).toFixed(1),
      rx,86*u,14,'#FFD98A',800,'right');
    outlineText(bankN+' '+t('tricks'),rx,102*u,11,'rgba(255,255,255,0.55)',700,'right');
  }

  // ── Chrono et rig, en haut à gauche ──
  outlineText(timeStr(runTime()),22*u,22*u,20,'#FFFFFF',900,'left');
  outlineText(t('rig')+' '+(P.rig+1)+'/'+RIGS.length
    +'   ·   '+t(ACT_KEYS[act-1][0]),22*u,42*u,12,'rgba(255,255,255,0.6)',800,'left');
  if(falls>0)outlineText(t('rFalls')+' '+falls,22*u,58*u,11,'rgba(255,140,150,0.7)',700,'left');

  // ── Vent, quand le rig courant en subit un ──
  const wr=RIGS[P.rig];
  if(wr&&wr.wind){
    const w=(P.state==='fly'||P.state==='held')?P.windA:windNow(wr);
    const wk=clamp(Math.abs(w)/wr.wind,0,1);
    const wx=HW, wy=SH-56*u, ww=90*u;
    CX.fillStyle='rgba(8,3,22,0.5)';CX.fillRect(wx-ww*0.5,wy,ww,6*u);
    CX.fillStyle=wk<0.25?'#9CFF7A':(wk<0.6?'#FFD98A':'#FF5B6E');
    CX.fillRect(wx,wy,ww*0.5*(w/(wr.wind||1)),6*u);
    CX.fillStyle='rgba(255,255,255,0.5)';CX.fillRect(wx-1*u,wy-3*u,2*u,12*u);
    outlineText(wk<0.25?t('windCalm'):t('wind'),wx,wy-11*u,11,
      wk<0.25?'#9CFF7A':'rgba(255,255,255,0.72)',800);
  }

  if(toastT>0&&(gs==='playing'||gs==='finale'))outlineText(toast,HW,SH*0.22,22,toastCol,900);

  // ── Acte 1 : la porte des deux étoiles ──
  if(gs==='playing'&&!gateOpen)
    outlineText(t('gate'),HW,SH*0.30,15,'rgba(255,217,138,0.88)',800);

  // ── Carton d'acte ──
  if(actT>0){
    const p2=1-actT/ACT_CARD;
    // Entrée, tenue, sortie : trois temps, comme un carton de mission.
    const al=p2<0.14?p2/0.14:(p2>0.82?(1-p2)/0.18:1);
    CX.globalAlpha=clamp(al,0,1);
    const bh=SH*0.13;
    CX.fillStyle='rgba(6,2,16,0.78)';
    CX.fillRect(0,HH-bh,SW,bh*2);
    CX.fillStyle='#FF2E88';CX.fillRect(0,HH-bh,SW,2*u);
    CX.fillRect(0,HH+bh-2*u,SW,2*u);
    outlineText(t(ACT_KEYS[act-1][0]),HW,HH-16*u,30,'#FFFFFF',900);
    outlineText(t(ACT_KEYS[act-1][1]),HW,HH+18*u,17,'#FFD98A',800);
    CX.globalAlpha=1;
  }

  // ── Rappel contextuel de la commande utile à l'instant ──
  if(gs==='playing'&&!paused){
    let hint='';
    if(P.state==='fly')hint=t('grab')+'   ·   '+t('figure');
    else if(P.state==='hang')hint=t('pump')+'   ·   '+t('release');
    if(hint)outlineText(hint,HW,SH-22*u,12,'rgba(255,255,255,0.42)',700);
  }
  if(paused){
    CX.fillStyle='rgba(8,3,22,0.6)';CX.fillRect(0,0,SW,SH);
    outlineText(t('paused'),HW,HH-12*u,32,'#FFF',900);
    outlineText(t('resume'),HW,HH+22*u,14,'rgba(255,255,255,0.6)',700);
  }
  if(gs==='finale'){
    // Bandes cinéma : le numéro se termine, on sort du jeu et on entre
    // dans le spectacle.
    const bh=SH*0.10*clamp(finT/40,0,1);
    CX.fillStyle='rgba(4,1,12,0.92)';
    CX.fillRect(0,0,SW,bh);CX.fillRect(0,SH-bh,SW,bh);
    outlineText(t('arrived'),HW,SH*0.30,30,'#25E5FF',900);
  }
  if(gs==='gameover'){
    CX.fillStyle='rgba(8,3,22,0.6)';CX.fillRect(0,0,SW,SH);
    outlineText(t('fall'),HW,HH-14*u,30,'#FF5B6E',900);
    outlineText(t('again'),HW,HH+22*u,14,'rgba(255,255,255,0.62)',700);
  }
  if(debugOn){
    CX.fillStyle='rgba(0,0,0,0.55)';CX.fillRect(0,0,244*u,150*u);
    const L=['fps '+fps.toFixed(0)+'   faces '+drawnFaces+(fnDropped?' (+'+fnDropped+' perdues)':''),
      'qual '+QUAL.name+'   dpr '+DPR.toFixed(2)+'   '+SW+'x'+SH,
      'etat '+P.state+'   rig '+(P.rig+1)+'/'+RIGS.length+'   acte '+act,
      'ang '+P.ang.toFixed(2)+'  angV '+P.angV.toFixed(2)+'  amp '+P.amp.toFixed(2),
      'pos '+P.x.toFixed(1)+' '+P.y.toFixed(1)+' '+P.z.toFixed(1),
      'hype '+hype.toFixed(0)+' ('+hypeStars()+'*)  cagnotte '+Math.round(bankVal)+'/'+bankN,
      'part '+pLive+'/'+pLiveMax+'   drone '+DRONE.fade.toFixed(2)+'   vent '+P.windA.toFixed(2),
      'cam yaw '+(CAM.yaw*180/Math.PI).toFixed(0)+'  pitch '+(CAM.pitch*180/Math.PI).toFixed(0)
        +'  fov '+(CAM.fov*180/Math.PI).toFixed(0)];
    for(let i=0;i<L.length;i++)outlineText(L[i],8*u,(14+i*17)*u,11,'#9CFF7A',700,'left');
  }
}

/* Écran de résultats. Il ne recalcule rien : toutes ces mesures ont été
   tenues pendant la traversée. */
const RES_K=['rTime','rChain','rStars','rFalls','rBank','rScore'];
function gradeOf(){
  // Trois critères lisibles, annoncés : finir, tomber peu, aller vite.
  if(falls===0&&runTime()<=120&&maxStars>=4)return 3;
  if(falls<=2)return 2;
  return 1;
}
function drawResults(){
  const u=uiScale;
  CX.fillStyle='rgba(6,2,16,0.86)';CX.fillRect(0,0,SW,SH);
  const bh=SH*0.09;
  CX.fillStyle='rgba(2,0,8,0.95)';CX.fillRect(0,0,SW,bh);CX.fillRect(0,SH-bh,SW,bh);
  CX.fillStyle='#FF2E88';CX.fillRect(0,bh,SW,2*u);CX.fillRect(0,SH-bh-2*u,SW,2*u);
  outlineText(t('results'),HW,SH*0.19,34,'#FFFFFF',900);
  const y0=SH*0.32, dy=Math.min(30*u,SH*0.075);
  const vals=[timeStr(runTime()),
    bestChain+' '+t('tricks'),
    maxStars+' / 5',
    String(falls),
    '$'+totalBank,
    '$'+score];
  for(let i=0;i<RES_K.length;i++){
    const y=y0+i*dy;
    outlineText(t(RES_K[i]),HW-14*u,y,14,'rgba(255,255,255,0.58)',700,'right');
    outlineText(vals[i],HW+14*u,y,16,'#FFFFFF',900,'left');
  }
  // Note sur trois, en étoiles.
  const g=gradeOf(), sr=13*u;
  const gy2=y0+RES_K.length*dy+22*u;
  outlineText(t('rGrade'),HW,gy2-20*u,12,'rgba(255,255,255,0.5)',800);
  for(let i=0;i<3;i++){
    const cx=HW+(i-1)*(sr*2.4);
    starPath(cx,gy2+6*u,sr);
    CX.fillStyle=i<g?'#FFD98A':'rgba(255,255,255,0.10)';CX.fill();
    CX.lineWidth=Math.max(1,1.5*u);
    CX.strokeStyle=i<g?'rgba(255,217,138,0.9)':'rgba(255,255,255,0.25)';CX.stroke();
  }
  outlineText(t('rAgain'),HW,SH-bh*0.5,14,'#25E5FF',800);
}

/* ─────────────────────────────────────────────────────────────
   18. LA MACHINE À ÉTATS DE LA TRAVERSÉE

   Trois actes, et une règle : les transitions sont MONOTONES et ne
   dépendent que de l'état courant. Une chute pendant un carton, un
   lâcher à l'instant d'une prise, un retour au menu en plein vol — rien
   de tout cela ne peut coincer la machine, parce qu'aucune transition
   n'attend qu'une autre soit finie.

   Noms conservés (startGame, togglePause, toMenu, loseLife, startFinale)
   pour que tools/check.js traverse les trois jeux avec le même pont.
   ───────────────────────────────────────────────────────────── */
function setAct(n){
  if(n<=act)return;      // monotone : un acte ne se rejoue jamais
  act=n;actT=ACT_CARD;
}
function startGame(){
  gs='playing';paused=false;
  lives=5;score=0;level=1;
  hype=0;starsNow=0;gateOpen=0;act=1;actT=ACT_CARD;
  bankVal=0;bankN=0;
  runSteps=0;penalty=0;falls=0;totalBank=0;maxStars=0;bestChain=0;finT=0;
  for(let n=0;n<RIGS.length;n++){RIGS[n].giants=0;RIGS[n].giantOn=0;RIGS[n].ang=0;RIGS[n].angV=0;}
  for(let i=0;i<PORTS.length;i++){const c=PORTS[i];c.used=0;c.announced=0;c.phase=0;c.ready=false;}
  DRONE.live=0;DRONE.fade=0;
  partReset();ftReset();
  P.rig=0;P.dst=1;P.best=0;P.amp=0;
  respawn();
  CAMS.ready=false;
  toastT=0;
}
// La réception qui boucle le numéro : un temps de salut, puis le bilan.
function startFinale(){
  if(gs==='levelcomplete'||gs==='finale')return;
  gs='finale';finT=0;
  say(t('arrived'),'#25E5FF');
  ftext(P.x,P.y+3.0,P.z,t('bow'),'#FFD98A',26);
  burst(P.x,P.y+1.0,P.z,34,5.4,1,90,0.16);
  shake(9);
}
function toMenu(){gs='menu';paused=false;}
function togglePause(){if(gs==='playing')paused=!paused;}

/* ─────────────────────────────────────────────────────────────
   19. ENTRÉES
   Le pad tactile complet est le lot de la session 4. Ici, deux boutons et
   le glissement de caméra : de quoi ne pas être mort au doigt.
   ───────────────────────────────────────────────────────────── */
function action(){
  if(gs==='menu'){startGame();return;}
  if(gs==='gameover'||gs==='levelcomplete'){startGame();return;}
  if(gs==='finale'){gs='levelcomplete';return;}   // passer le salut
  if(paused)return;
  if(P.state==='hang')pump();
  else P.grabBuf=CFG.GRAB_BUF;
}
function doRelease(){
  if(gs!=='playing'||paused)return;
  release();
}
// Figure. Maintenue, elle accélère la rotation ; une simple pression
// suffit à en lancer une, pour que le jeu reste jouable sans keyup.
function figure(){
  if(gs!=='playing'||paused)return;
  P.trickHeld=1;P.trickBuf=CFG.GRAB_BUF;
}
function figureEnd(){P.trickHeld=0;}
window.addEventListener('keydown',function(e){
  const k=e.key;
  if(k===' '||k==='Spacebar'||k==='w'||k==='z'||k==='ArrowUp'){e.preventDefault();action();return;}
  if(k==='s'||k==='ArrowDown'||k==='Shift'){e.preventDefault();doRelease();return;}
  if(k==='f'||k==='F'||k==='x'||k==='ArrowLeft'||k==='ArrowRight'){e.preventDefault();figure();return;}
  if(k==='p'||k==='P'){togglePause();return;}
  if(k==='r'||k==='R'){startGame();return;}
  if(k==='Escape'){toMenu();return;}
  if(k==='F3'){e.preventDefault();debugOn=!debugOn;return;}
  if(k==='1'){setQuality('low');return;}
  if(k==='2'){setQuality('med');return;}
  if(k==='3'){setQuality('high');return;}
});
window.addEventListener('keyup',function(e){
  const k=e.key;
  if(k==='f'||k==='F'||k==='x'||k==='ArrowLeft'||k==='ArrowRight')figureEnd();
});
// Regard libre. Il revient de lui-même : on ne laisse jamais le joueur
// coincé face à un mur.
let dragId=-1, dragX=0, dragY=0;
function look(dx,dy){
  CAMS.yawOff=clamp(CAMS.yawOff-dx*0.0032,-1.1,1.1);
  CAMS.pitchOff=clamp(CAMS.pitchOff+dy*0.0026,-0.5,0.5);
}
CV.addEventListener('pointerdown',function(e){
  if(dragId<0){dragId=e.pointerId;dragX=e.clientX;dragY=e.clientY;}
});
CV.addEventListener('pointermove',function(e){
  if(e.pointerId!==dragId)return;
  look(e.clientX-dragX,e.clientY-dragY);
  dragX=e.clientX;dragY=e.clientY;
});
function endDrag(e){if(e.pointerId===dragId)dragId=-1;}
CV.addEventListener('pointerup',endDrag);
CV.addEventListener('pointercancel',endDrag);
CV.addEventListener('click',function(){if(gs!=='playing')action();});

(function bindTouch(){
  const a=document.getElementById('tAct'), r=document.getElementById('tRel');
  const f=document.getElementById('tFig');
  const pad=document.getElementById('pad');
  if(pad&&pad.classList&&isTouch)pad.classList.add('on');
  if(a)a.addEventListener('pointerdown',function(e){e.preventDefault();action();});
  if(r)r.addEventListener('pointerdown',function(e){e.preventDefault();doRelease();});
  if(f){
    f.addEventListener('pointerdown',function(e){e.preventDefault();figure();});
    f.addEventListener('pointerup',function(e){e.preventDefault();figureEnd();});
    f.addEventListener('pointercancel',figureEnd);
    f.addEventListener('pointerleave',figureEnd);
  }
})();
(function bindFull(){
  const b=document.getElementById('btnFull');
  if(!b)return;
  b.addEventListener('click',function(){
    const el=document.documentElement;
    try{
      if(document.fullscreenElement||document.webkitFullscreenElement){
        if(document.exitFullscreen)document.exitFullscreen();
        else if(document.webkitExitFullscreen)document.webkitExitFullscreen();
      }else if(el.requestFullscreen)el.requestFullscreen();
      else if(el.webkitRequestFullscreen)el.webkitRequestFullscreen();
    }catch(err){}
  });
})();

/* ─────────────────────────────────────────────────────────────
   20. BOUCLE PRINCIPALE
   Pas de temps fixe à 1/120 s. La physique du pendule devient instable en
   dessous, et le jeu doit être identique en 60 Hz et en 120 Hz.
   ───────────────────────────────────────────────────────────── */
const STEP=1000/120;
let acc=0, lastT=0, fpsAcc=0, fpsN=0;
function step(){
  frame++;
  if(toastT>0)toastT--;
  if(actT>0)actT--;
  if(gs==='playing'&&!paused){
    runSteps++;
    stepPorteurs();
    stepPlayer();
    // La porte de l'acte 1 : deux étoiles de hype ouvrent la traversée.
    // Elle est testée ICI et pas dans addHype, pour qu'elle ne dépende
    // d'aucun chemin d'événement particulier — c'est ce qui la rend
    // insensible à l'ordre des choses.
    if(!gateOpen&&hypeStars()>=CFG.GATE_STARS){
      gateOpen=1;setAct(2);
      say(t('gateOpen'),'#25E5FF');
      burst(P.x,P.y+1.2,P.z,20,4.4,1,64,0.14);
    }
  }else if(gs==='finale'&&!paused){
    finT++;
    stepPorteurs();
    stepPlayer();               // le salut : l'acrobate continue de balancer
    if(finT>240)gs='levelcomplete';
  }
  stepParticles();
  stepTexts();
  stepDrone();
  stepCamera();
}
function frameLoop(now){
  requestAnimationFrame(frameLoop);
  if(!lastT)lastT=now;
  let dt=now-lastT;lastT=now;
  if(dt>250)dt=STEP;                 // onglet réveillé : on ne rattrape pas
  watchPerf(dt);
  fpsAcc+=dt;fpsN++;
  if(fpsAcc>500){fps=1000/(fpsAcc/fpsN);fpsAcc=0;fpsN=0;}
  acc+=dt;
  let n=0;
  while(acc>=STEP&&n<10){acc-=STEP;n++;step();}
  // Le temps d'image affiché par le navigateur est plafonné par la
  // synchronisation verticale : il ne dit rien du coût réel. On mesure donc
  // le temps passé dans render(), qui est la vraie marge disponible.
  const t0=performance.now();
  render();
  const t1=performance.now();
  rtSamples[rtN++%rtSamples.length]=t1-t0;
  if(rtN>rtSamples.length)rtFull=true;
}
const rtSamples=new Float64Array(120);let rtN=0,rtFull=false;
function renderMs(){
  const n=rtFull?rtSamples.length:rtN;
  if(!n)return{p50:0,p95:0};
  const a=Array.prototype.slice.call(rtSamples,0,n).sort(function(x,y){return x-y;});
  return{p50:a[(n*0.5)|0],p95:a[Math.min(n-1,(n*0.95)|0)]};
}

/* ─────────────────────────────────────────────────────────────
   21. DÉMARRAGE ET PONT DE DÉBOGAGE
   ───────────────────────────────────────────────────────────── */
function init(){
  buildMaterials();
  buildWindowColours();
  buildCity();
  buildRoute();
  respawn();
  resize();
  requestAnimationFrame(frameLoop);
}
// Pont exposé pour les outils : shot_v3.js et le pilote automatique de la
// session 2 en dépendent, et il évite de deviner l'état depuis l'extérieur.
window.__v3={
  CFG:CFG,P:P,CAM:CAM,RIGS:RIGS,PORTS:PORTS,
  get state(){return{gs:gs,paused:paused,score:score,lives:lives,
    rig:P.rig,dst:P.dst,pstate:P.state,amp:P.amp,ang:P.ang,angV:P.angV,
    x:P.x,y:P.y,z:P.z,
    // Session 2 : tout ce dont le pilote automatique et les captures
    // ont besoin, pour qu'aucun outil n'ait à deviner un état interne.
    hype:hype,stars:hypeStars(),mult:hypeMult(),bank:bankVal,bankN:bankN,
    act:act,gate:gateOpen,falls:falls,time:runTime(),penalty:penalty,
    totalBank:totalBank,bestChain:bestChain,maxStars:maxStars,grade:gradeOf(),
    wind:P.windA,windNow:windNow(RIGS[P.rig]),
    port:(function(){const c=portOf(P.rig);return c?{ready:!!c.ready,used:!!c.used,ang:c.ang}:null;})(),
    drone:DRONE.fade,parts:pLive,partsMax:pLiveMax,partsCap:PCAP,
    faces:drawnFaces,dropped:fnDropped,winFaces:winFaces,winDrawn:winDrawn,fps:fps,
    qual:QUAL.name,sw:SW,sh:SH,render:renderMs()};},
  action:action,release:doRelease,figure:figure,figureEnd:figureEnd,
  start:startGame,menu:toMenu,finale:startFinale,
  pause:togglePause,quality:setQuality,
  debug:function(v){debugOn=!!v;},
  look:look,
  // Utilisé par les tests : place le joueur sur un rig donné, au repos.
  // Ouvre aussi la porte de l'acte 1, sinon toute capture à partir du rig 2
  // partirait d'un état que le jeu n'autorise pas encore.
  goRig:function(n){
    P.rig=clamp(n|0,0,RIGS.length-1);
    if(P.rig>0){gateOpen=1;if(act<2)act=2;}
    if(P.rig>=RIGS.length-2&&act<3)act=3;
    respawn();CAMS.ready=false;
  },
  // Force la hype, pour cadrer le drone ou franchir la porte en test.
  setHype:function(v){hype=clamp(v,0,CFG.HYPE_MAX);refreshStars();},
  setAmp:function(a){const r=RIGS[P.rig];P.ang=0;P.angV=0.0001;setAmp(r,a);},
  // Avance la simulation d'un nombre exact de pas : les captures de test
  // sont ainsi reproductibles, au lieu de dépendre du temps réel écoulé.
  sim:function(n){for(let i=0;i<(n|0);i++)step();},
  // Fige la caméra à un endroit choisi. Sert notamment à la coller contre
  // un mur pour vérifier le découpage au plan proche.
  freeze:function(x,y,z,yaw,pitch){
    camFrozen=true;CAM.x=x;CAM.y=y;CAM.z=z;
    CAM.yaw=yaw;CAM.pitch=pitch||0;CAM.shakeX=0;CAM.shakeY=0;skyDirty=true;
  },
  unfreeze:function(){camFrozen=false;CAMS.ready=false;},
  // Renvoie la tour occupée la plus proche d'un point : de quoi viser un
  // mur sans le coder en dur.
  nearestTower:function(x,z){
    let best=null,bd=1e9;
    for(let j=0;j<G;j++)for(let i=0;i<G;i++){
      const k=j*G+i;if(!tOcc[k])continue;
      const d=Math.hypot(tX[k]-x,tZ[k]-z);
      if(d<bd){bd=d;best={x:tX[k],z:tZ[k],w:tW[k],d:tD[k],h:tH[k]};}
    }
    return best;
  },
};
init();
</script>
