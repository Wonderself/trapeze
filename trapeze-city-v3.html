  dropBank();
  P.state='net';P.netT=CFG.NET_HOLD;P.port=null;
  P.y=ny;P.vy=Math.min(9,Math.abs(P.vy)*0.34+2.4);
  P.vx*=0.22;P.vz*=0.22;P.spin=0;P.spinAcc=0;P.windA=0;
  hype*=CFG.HYPE_FALL;refreshStars();
  falls++;penalty+=CFG.NET_PEN;
  say(t('net'),'#FF5B6E');
  sfx('net');
  // Ralenti et resserrement : la réception ratée est le moment que le
  // joueur doit VOIR, pas celui qu'il doit subir en une demi-seconde.
  if(!reducedMotion)slowT=760;
  ftext(P.x,ny+3.0,P.z,t('back'),'rgba(255,255,255,0.78)',17);
  shake(7);
  burst(P.x,ny,P.z,18,3.4,4,54,0.12);
}
// Conservé sous ce nom pour rester compatible avec tools/check.js, qui
// vérifie sur les trois jeux que la boucle survit à la perte d'une vie.
// Ici une chute ne coûte plus de vie : le filet rattrape, on repart du
// dernier toit atteint. C'est la règle du §7 du plan.
function loseLife(){hitNet();}

function respawn(){
  const rig=RIGS[P.rig];
  P.state='hang';P.ang=0;P.angV=0;P.phi=0;P.spin=0;P.spinAcc=0;
  trailReset();
  barAt(rig,0);P.x=_bx;P.y=_by;P.z=_bz;
  P.vx=P.vy=P.vz=0;P.flyT=0;P.netT=0;P.holdT=0;
  P.dst=Math.min(RIGS.length-1,P.rig+1);
  P.port=null;P.windA=0;P.grabBuf=0;P.trickBuf=0;P.trickHeld=0;
  P.pumpCd=0;P.pumpArm=1;
  const pc=portOf(P.rig);
  if(pc){pc.used=0;pc.announced=0;}
}

function shake(a){if(!reducedMotion)CAM.shake=Math.max(CAM.shake,a);}

/* Pas de simulation du joueur. dt est fixe : 1/120 s. */
const DT=1/120;
function stepPlayer(){
  if(P.pumpCd>0)P.pumpCd--;
  if(P.grabBuf>0)P.grabBuf--;
  if(P.trickBuf>0)P.trickBuf--;
  const rig=RIGS[P.rig];

  // Fuite de hype : jouer prudemment la fait retomber toute seule. Plus on
  // a d'étoiles, plus il faut en faire pour les garder.
  hype=Math.max(0,hype-(CFG.HYPE_DEC+CFG.HYPE_DECS*starsNow));
  refreshStars();

  if(P.state==='hang'){
    const w2=CFG.G_SWING/rig.rope;
    P.angV+=-w2*Math.sin(P.ang)*DT;
    P.angV*=CFG.DAMP;
    P.angV=clamp(P.angV,-CFG.ANGV_MAX,CFG.ANGV_MAX);
    P.ang+=P.angV*DT;
    // Au-delà du tour complet on replie l'angle, sinon la pose se dévisse.
    if(P.ang>Math.PI)P.ang-=2*Math.PI;
    if(P.ang<-Math.PI)P.ang+=2*Math.PI;
    barAt(rig,P.ang);
    P.x=_bx;P.y=_by;P.z=_bz;
    P.phi=-P.ang;
    P.amp=ampOf(P.ang,P.angV,rig.rope);
    // L'ampleur du balancé nourrit la hype : le public regarde la taille du
    // geste, pas le nombre d'appuis.
    const k=P.amp/CFG.AMP_MAX;
    addHype(CFG.HYPE_AMP*k*k);
    // Grand soleil : compté une fois par passage, et à rendement
    // décroissant sur un même rig — sinon rester à tourner sur place
    // remplacerait la traversée.
    if(P.amp>=CFG.GIANT&&!rig.giantOn){
      rig.giantOn=1;rig.giants++;
      const dec=Math.pow(0.45,rig.giants-1);
      addHype(CFG.HYPE_GIANT*dec);
      addScore(400*dec);
      if(rig.giants<=2){say(t('giant'),'#FF2E88');shake(4);
        if(!reduceFlash)burst(P.x,P.y,P.z,14,3.6,1,50,0.12);sfx('giant');}
    }else if(P.amp<CFG.GIANT*0.86){rig.giantOn=0;}
    // Cambré à l'arrière du balancé, groupé à l'avant : la pose raconte
    // le sens du mouvement, ce qui aide à sentir quand pomper.
    P.pike=clamp(P.angV*0.17,-0.55,0.55);
    P.tuck=0;
    // Réarmement au passage par le point bas.
    if(Math.abs(P.ang)<0.30*Math.max(P.amp,0.25))P.pumpArm=1;

  }else if(P.state==='fly'){
    P.flyT++;
    P.vy-=CFG.G_FLIGHT*DT;
    if(P.windA){
      // Le vent pousse perpendiculairement au plan du vol : il décale la
      // trajectoire sans la ralentir.
      const px=rig.dz, pz=-rig.dx;
      P.vx+=px*P.windA*DT;P.vz+=pz*P.windA*DT;
    }
    P.vx*=CFG.AIR_DRAG;P.vy*=CFG.AIR_DRAG;P.vz*=CFG.AIR_DRAG;
    P.x+=P.vx*DT;P.y+=P.vy*DT;P.z+=P.vz*DT;

    // Figures : chaque demi-tour bouclé tombe dans la cagnotte. Une
    // rotation entamée et non terminée ne vaut rien.
    if(P.trickHeld||P.trickBuf>0){
      P.spin+=P.spinDir*CFG.SPIN_ACC*DT;
      if(P.spin>CFG.SPIN_MAX)P.spin=CFG.SPIN_MAX;
      if(P.spin<-CFG.SPIN_MAX)P.spin=-CFG.SPIN_MAX;
    }else if(Math.abs(P.spin)>0.05){P.spin*=CFG.SPIN_DEC;}
    const h0=(P.spinAcc/Math.PI)|0;
    P.spinAcc+=Math.abs(P.spin)*DT;
    const h1=(P.spinAcc/Math.PI)|0;
    if(h1>h0){
      P.halfs=h1;
      const id=(h1%2)===0?1:0;         // demi-tour, puis salto bouclé
      const v=bankTrick(id,CFG.TRICK_PTS*(h1<=1?1:1.2));
      ftext(P.x,P.y+1.8,P.z,t(TRICK_KEYS[id])+' +'+Math.round(v),'#25E5FF',17);
      emit(P.x,P.y,P.z,0,1.0,0,30,0.07,0);
      sfx('trick');
    }
    P.phi+=P.spin*DT;
    P.tuck=clamp(Math.abs(P.spin)/8,0,1);
    P.pike=0;
    if(Math.abs(P.spin)>1.2&&(P.flyT&1)===0)trailPush();

    // Le porteur, s'il travaille sur ce vol.
    const pc=portOf(P.rig);
    if(pc&&!pc.used){
      portHands(pc,pc.ang);
      const d=Math.hypot(P.x-_hx,P.y-_hy,P.z-_hz);
      if(!pc.announced&&d<11){pc.announced=1;ftext(_hx,_hy+2.2,_hz,t('portReady'),'#FFD98A',17);}
      if(pc.ready&&d<CFG.PORT_R)portCatch(pc);
    }

    if(P.state==='fly'){
      if(P.grabBuf>0)tryGrab();
      if(P.state==='fly'&&(P.y<netYNow()||P.flyT>900))hitNet();
    }

  }else if(P.state==='held'){
    // Suspendu au porteur : il continue de balancer et l'emporte avec lui.
    const c=P.port;
    if(!c){P.state='fly';P.flyT=0;}
    else{
      portHands(c,c.ang);
      P.x=_hx;P.y=_hy;P.z=_hz;
      P.phi=lerp(P.phi,c.ang,0.12);
      P.tuck=0;P.pike=clamp(c.ang*0.4,-0.5,0.5);
      P.holdT--;
      if(P.holdT<=0)portThrow();
    }

  }else{   // 'net'
    const ny=netYNow();
    P.netT--;
    P.vy-=CFG.G_FLIGHT*0.45*DT;
    P.x+=P.vx*DT;P.y+=P.vy*DT;P.z+=P.vz*DT;
    if(P.y<ny){P.y=ny;P.vy=Math.abs(P.vy)*0.42;P.vx*=0.6;P.vz*=0.6;}
    P.phi=lerp(P.phi,0,0.08);
    P.tuck=lerp(P.tuck,0.35,0.06);
    if(P.netT<=0)respawn();
  }
  if(P.amp>P.best)P.best=P.amp;
}

/* ── Le drone de télévision ──────────────────────────────────
   L'équivalent visuel de l'hélicoptère d'un jeu urbain, mais c'est une
   caméra de diffusion, pas une menace : il tourne autour de l'acrobate
   avec du retard, il ne gêne rien et il repart quand la hype retombe. */
const DRONE={live:0,fade:0,t:0,ang:0,rot:0,x:0,y:0,z:0,tx:0,ty:0,tz:0};
function stepDrone(){
  const want=(gs==='playing'&&hypeStars()>=CFG.DRONE_ST)?1:0;
  DRONE.fade=clamp(DRONE.fade+(want?0.010:-0.008),0,1);
  if(DRONE.fade<=0){DRONE.live=0;return;}
  DRONE.t++;
  DRONE.rot+=0.62;
  // Une orbite libre le fait sortir du cadre les trois quarts du temps —
  // mesuré : projeté en (−264, −123) sur une image de 1600 × 900. Un drone
  // de diffusion qu'on ne voit jamais ne raconte rien.
  // Il se tient donc DERRIÈRE l'acrobate vu de la caméra, et dérive
  // lentement de part et d'autre : toujours dans le cadre, et jamais entre
  // la caméra et le geste, donc jamais gênant.
  const camA=Math.atan2(CAM.z-P.z,CAM.x-P.x);
  DRONE.ang=camA+Math.PI+Math.sin(DRONE.t*0.0042)*0.90;
  const r=10.0+2.4*Math.sin(DRONE.t*0.0105);
  DRONE.tx=P.x+Math.cos(DRONE.ang)*r;
  DRONE.ty=P.y+4.6+1.3*Math.sin(DRONE.t*0.017);
  DRONE.tz=P.z+Math.sin(DRONE.ang)*r;
  if(!DRONE.live){DRONE.live=1;DRONE.x=DRONE.tx;DRONE.y=DRONE.ty;DRONE.z=DRONE.tz;}
  // Retard élastique : il court après l'acrobate, il ne le colle pas.
  DRONE.x=lerp(DRONE.x,DRONE.tx,0.034);
  DRONE.y=lerp(DRONE.y,DRONE.ty,0.046);
  DRONE.z=lerp(DRONE.z,DRONE.tz,0.034);
}

/* ─────────────────────────────────────────────────────────────
   12. LA CAMÉRA DE CADREUR

   Ce n'est pas une caméra de poursuite. Elle se place de trois quarts par
   rapport au plan du balancé — jamais dedans, jamais perpendiculaire.
   Dans le plan, le geste devient illisible ; perpendiculaire, la ville
   perd toute profondeur. Le trois-quarts donne les deux.
   ───────────────────────────────────────────────────────────── */
const CAMS={
  fx:0,fz:1, px:0,py:90,pz:-40, lx:0,ly:80,lz:0,
  yawOff:0,pitchOff:0, ready:false,
};
let camFrozen=false;

/* Caméra d'écran-titre. Elle survole la ville en orbite lente, très haut,
   légèrement plongeante. C'est ce plan qui doit donner envie : le logo se
   pose dessus, il ne se pose pas sur un fond fixe. */
function menuCamera(){
  const a=frame*0.00085;
  // À deux cents mètres et cent soixante de haut, on ne voyait que du
  // brouillard : la ville tenait dans le tiers bas de l'image. La caméra
  // descend DANS la ville, à hauteur de toits, et vise un point bas — les
  // tours passent alors devant le couchant, ce qui est tout l'argument.
  // La trame fait 918 m de côté : à 158 m du centre on est DANS les tours,
  // et l'écran-titre se remplit d'une seule façade. À 340 m on est dehors,
  // et la ville redevient une silhouette découpée sur le couchant.
  const r=340;
  CAM.x=Math.cos(a)*r;
  CAM.z=Math.sin(a)*r-20;
  CAM.y=126+7*Math.sin(frame*0.0021);
  const tx=0, ty=58, tz=0;
  const vx=tx-CAM.x, vy=ty-CAM.y, vz=tz-CAM.z;
  const h=Math.hypot(vx,vz)||0.0001;
  CAM.yaw=Math.atan2(vx,vz);
  CAM.pitch=Math.atan2(vy,h);
  CAM.fov=CFG.FOV;
  CAM.shakeX=0;CAM.shakeY=0;CAM.shake=0;
  CAMS.ready=false;
}

function stepCamera(){
  if(camFrozen)return;
  if(gs==='menu'){menuCamera();return;}
  const rig=RIGS[P.rig];
  // Le porteur et le filet sont des moments de vol : la caméra doit les
  // cadrer comme tels, sinon elle se recolle au rig de départ en plein
  // milieu de l'action.
  const inAir=(P.state==='fly'||P.state==='held');
  let dx=rig.dx, dz=rig.dz;
  if(inAir&&RIGS[P.dst]){
    const b=RIGS[P.dst];
    dx+=b.dx;dz+=b.dz;
    const l=Math.hypot(dx,dz)||1;dx/=l;dz/=l;
  }
  CAMS.fx=lerp(CAMS.fx,dx,0.05);CAMS.fz=lerp(CAMS.fz,dz,0.05);
  const l=Math.hypot(CAMS.fx,CAMS.fz)||1;
  const ux=CAMS.fx/l, uz=CAMS.fz/l;
  const nx=uz, nz=-ux;                       // perpendiculaire horizontale
  const ampK=clamp(P.amp/CFG.AMP_MAX,0,1);
  const flyK=(P.state==='hang')?0:1;
  CAM.fov=lerp(CFG.FOV,CFG.FOV_WIDE,clamp(ampK*0.7+flyK*0.35,0,1));
  if(slowT>0)CAM.fov*=lerp(1,0.82,clamp(slowT/760,0,1));

  // Point visé. À grande amplitude on glisse vers le POINT D'ANCRAGE : le
  // pendule décrit alors un arc presque complet centré dessus, et c'est le
  // pivot qui doit tenir l'image. Viser la barre ferait balayer le cadre au
  // rythme du balancé, ce qui est illisible.
  // Étendue réelle de l'arc à l'amplitude courante. Le point bas est
  // toujours à une longueur de câble sous l'ancrage ; le point haut est à
  // rope·cos(amplitude) — donc au-dessus de l'ancrage seulement au-delà du
  // quart de tour. Cadrer systématiquement le cercle entier ferait reculer
  // la caméra pour rien sur un balancé modeste.
  const amp=Math.max(P.amp,0.35);
  const cosA=Math.cos(Math.min(amp,Math.PI*0.98));
  const arcY=rig.ay-rig.rope*(1+cosA)*0.5;      // centre vertical de l'arc
  const halfV=rig.rope*(1-cosA)*0.5+1.9;
  const halfH=rig.rope*Math.sin(Math.min(amp,Math.PI*0.5))+1.6;
  const pull=Math.pow(ampK,0.7)*0.85;
  let ax=lerp(P.x,rig.ax,pull), ay=lerp(P.y-1.0,arcY,pull), az=lerp(P.z,rig.az,pull);
  if(P.state==='net'){ax=P.x;ay=P.y+1.4;az=P.z;}
  if(inAir&&RIGS[P.dst]){
    const b=RIGS[P.dst];barAt(b,b.ang);
    ax=lerp(ax,_bx,0.42);ay=lerp(ay,_by,0.46);az=lerp(az,_bz,0.42);
  }
  // Distance de cadrage, DÉDUITE de la géométrie et non devinée : l'arc du
  // balancé a pour rayon la longueur de câble, il doit tenir dans la
  // hauteur de l'image. C'est la même discipline que l'échelle de vue de
  // Deluxe — on calcule ce qu'il faut voir, on ne tâtonne pas.
  const vTan=Math.tan(CAM.fov*0.5)*SH/SW;
  const hTan=Math.tan(CAM.fov*0.5);
  const base=Math.hypot(CFG.CAM_SIDE,CFG.CAM_BACK);
  let want=Math.max(base,halfV/vTan,halfH/hTan);
  if(inAir&&RIGS[P.dst]){
    // En vol, l'acrobate et la barre visée doivent tenir ensemble dans le cadre.
    const b=RIGS[P.dst];barAt(b,b.ang);
    const spread=Math.hypot(_bx-P.x,_by-P.y,_bz-P.z)*0.60;
    want=Math.max(want,(spread+3)/hTan);
  }
  const dist=want/base;
  const side=rig.side;
  let tx=ax+nx*CFG.CAM_SIDE*side*dist-ux*CFG.CAM_BACK*dist;
  let ty=ay+CFG.CAM_UP*Math.sqrt(dist)*(1-0.45*flyK);
  let tz=az+nz*CFG.CAM_SIDE*side*dist-uz*CFG.CAM_BACK*dist;

  /* CADRAGE DE CHUTE. Une place déduite du portique est bonne au niveau
     des toits et catastrophique quinze mètres plus bas : elle enfonce la
     caméra dans une façade, et on regarde le filet à travers l'intérieur
     d'un immeuble. C'est exactement ce qu'a montré la capture d'une prise
     ratée.
     Sous le niveau des toits, on se raccroche donc au COULOIR du parcours,
     qui est dégagé par construction — les tours de la trame sont effacées
     à moins de 27 m de chaque rig, et aucun segment ne dépasse 37,5 m. */
  const dstRig=RIGS[P.dst]||rig;
  const roofLow=Math.min(rig.roofY,dstRig.roofY);
  if(P.state==='net'||P.y<roofLow-2){
    // La caméra se cale sur L'ACROBATE, pas sur le milieu du segment : un
    // vol parti à l'envers l'emmène à cinquante mètres de la ligne, et
    // viser le segment le laisse alors hors champ. À treize mètres de lui,
    // perpendiculairement au plan du vol et neuf mètres plus haut, il est
    // cadré quoi qu'il arrive.
    tx=P.x+nx*13*side;
    ty=P.y+9;
    tz=P.z+nz*13*side;
    ax=P.x;ay=P.y+1.0;az=P.z;
  }
  /* CINÉMATIQUE D'OUVERTURE. Elle part d'un plan large très haut au-dessus
     de la ville et vient se poser sur le premier rig. Le trajet n'est pas
     une liste de points : c'est une interpolation amortie entre ce plan
     large et la place que la caméra de jeu occuperait de toute façon. Elle
     se termine donc exactement là où le jeu prend la main — aucun raccord
     à cacher, et rien à re-régler si le cadrage de jeu change. */
  if(gs==='intro'){
    const k=clamp(introT/INTRO_LEN,0,1);
    const e=1-Math.pow(1-k,3);            // sortie cubique : on arrive en douceur
    const sx=rig.x-118, sy=rig.roofY+142, sz=rig.z-152;
    tx=lerp(sx,tx,e);ty=lerp(sy,ty,e);tz=lerp(sz,tz,e);
    // Le regard part du centre de la ville et glisse vers l'acrobate.
    ax=lerp(rig.x*0.2,ax,e);ay=lerp(rig.roofY+18,ay,e);az=lerp(rig.z*0.2+40,az,e);
    // Pas de retard élastique pendant un plan écrit : il le ferait traîner.
    CAMS.px=tx;CAMS.py=ty;CAMS.pz=tz;
    CAMS.lx=ax;CAMS.ly=ay;CAMS.lz=az;CAMS.ready=true;
    CAM.x=CAMS.px;CAM.y=CAMS.py;CAM.z=CAMS.pz;
    const ivx=ax-CAM.x, ivy=ay-CAM.y, ivz=az-CAM.z;
    const ih=Math.hypot(ivx,ivz)||0.0001;
    CAM.yaw=Math.atan2(ivx,ivz);
    CAM.pitch=clamp(Math.atan2(ivy,ih),-1.15,1.05);
    CAM.shakeX=0;CAM.shakeY=0;
    return;
  }
  if(!CAMS.ready){
    CAMS.px=tx;CAMS.py=ty;CAMS.pz=tz;CAMS.lx=ax;CAMS.ly=ay;CAMS.lz=az;CAMS.ready=true;
  }
  CAMS.px=lerp(CAMS.px,tx,CFG.CAM_LAG);
  CAMS.py=lerp(CAMS.py,ty,CFG.CAM_LAG);
  CAMS.pz=lerp(CAMS.pz,tz,CFG.CAM_LAG);
  CAMS.lx=lerp(CAMS.lx,ax,CFG.CAM_AIM);
  CAMS.ly=lerp(CAMS.ly,ay,CFG.CAM_AIM);
  CAMS.lz=lerp(CAMS.lz,az,CFG.CAM_AIM);

  CAM.x=CAMS.px;CAM.y=CAMS.py;CAM.z=CAMS.pz;
  const vx=CAMS.lx-CAM.x, vy=CAMS.ly-CAM.y, vz=CAMS.lz-CAM.z;
  const h=Math.hypot(vx,vz)||0.0001;
  CAM.yaw=Math.atan2(vx,vz)+CAMS.yawOff;
  CAM.pitch=clamp(Math.atan2(vy,h)+CAMS.pitchOff,-1.15,1.05);

  // Regard libre : il revient de lui-même derrière l'action.
  CAMS.yawOff*=0.955;CAMS.pitchOff*=0.955;

  // Secousse : bruit lissé plutôt qu'un Math.random() par image, qui
  // scintille au lieu de secouer.
  if(CAM.shake>0.01){
    CAM.shake*=0.90;
    const s=CAM.shake*DPR*2.2;
    CAM.shakeX=Math.sin(frame*0.9)*s;
    CAM.shakeY=Math.cos(frame*1.27)*s;
  }else{CAM.shake=0;CAM.shakeX=0;CAM.shakeY=0;}
}

/* ─────────────────────────────────────────────────────────────
   13. CIEL, SOL, SOLEIL
   Le ciel est ancré sur la ligne d'horizon réelle : pour un point à
   l'infini au niveau des yeux, l'écran donne y = HH + FOCAL·tan(tangage).
   Le dégradé suit donc le tangage au lieu de flotter.
   ───────────────────────────────────────────────────────────── */
let skyDirty=true, skyGrad=null, skyGnd=null, skyH=-9999;
// Le disque solaire et les nuages étaient recréés à chaque image : un
// createRadialGradient par image, c'est exactement l'allocation dans la
// boucle chaude que le plan interdit. Ils sont maintenant construits une
// fois, centrés sur l'origine, et amenés à leur place par une translation.
let sunGrad=null, sunR=1, cloudGrad=null, glowGrad=null;
function buildSkyAssets(){
  sunR=Math.max(1,Math.min(SW,SH)*0.5);
  sunGrad=CX.createRadialGradient(0,0,0,0,0,sunR);
  sunGrad.addColorStop(0,'rgba(255,217,138,0.92)');
  sunGrad.addColorStop(0.08,'rgba(255,180,116,0.46)');
  sunGrad.addColorStop(0.34,'rgba(255,102,124,0.16)');
  sunGrad.addColorStop(1,'rgba(255,90,120,0)');
  // Nuage : un disque doux à l'unité, étiré à la volée. Un seul dégradé
  // sert à toutes les bandes.
  cloudGrad=CX.createRadialGradient(0,0,0,0,0,1);
  cloudGrad.addColorStop(0,'rgba(255,214,196,0.16)');
  cloudGrad.addColorStop(0.40,'rgba(255,190,180,0.07)');
  cloudGrad.addColorStop(1,'rgba(255,180,170,0)');
  // Lueur additive générique des sources émissives (néons, drone, magnésie).
  glowGrad=CX.createRadialGradient(0,0,0,0,0,1);
  glowGrad.addColorStop(0,'rgba(255,255,255,0.55)');
  glowGrad.addColorStop(0.35,'rgba(255,255,255,0.18)');
  glowGrad.addColorStop(1,'rgba(255,255,255,0)');
}
// Tache lumineuse douce, teintée, sans créer le moindre dégradé.
function glowAt(x,y,r,col,a){
  CX.save();
  CX.globalCompositeOperation='lighter';
  CX.globalAlpha=a;
  CX.translate(x,y);CX.scale(r,r);
  CX.fillStyle=col;
  CX.beginPath();CX.arc(0,0,1,0,6.2832);CX.fill();
  CX.restore();
}

/* Les bandes de nuages. Elles sont plaquées sur l'azimut : quand la caméra
   tourne, elles défilent ; quand elle tangue, elles montent. C'est de la
   parallaxe gratuite, et c'est ce qui empêche le ciel de ressembler à un
   aplat collé derrière la ville. */
const CLOUD_AZ=[0.4,1.15,1.9,2.7,3.4,4.1,4.8,5.4,6.0];
const CLOUD_H =[0.13,0.30,0.06,0.22,0.40,0.11,0.34,0.19,0.27];
const CLOUD_W =[1.9,1.3,2.4,1.6,1.1,2.0,1.4,1.8,1.2];
function drawClouds(hz){
  const n=QUAL.clouds;
  if(!n||!cloudGrad)return;
  const span=SW/(CAM.fov);            // pixels par radian d'azimut
  for(let i=0;i<n;i++){
    // Azimut relatif, replié dans [-π, π] : une bande qui sort par la
    // droite revient par la gauche.
    let da=CLOUD_AZ[i]-CAM.yaw;
    while(da>Math.PI)da-=6.2832;
    while(da<-Math.PI)da+=6.2832;
    const x=HW+da*span;
    if(x<-SW*0.6||x>SW*1.6)continue;
    const y=hz-SH*CLOUD_H[i]*0.9;
    const w=SW*0.46*CLOUD_W[i], h=SH*0.070*(0.7+CLOUD_H[i]);
    CX.save();
    CX.translate(x,y);CX.scale(w,h);
    CX.fillStyle=cloudGrad;
    CX.fillRect(-1,-1,2,2);
    CX.restore();
  }
}

function drawSky(){
  const hz=HH+FOCAL*Math.tan(CAM.pitch)+CAM.shakeY;
  if(skyDirty||Math.abs(hz-skyH)>3){
    skyH=hz;skyDirty=false;
    const top=hz-SH*1.5, bot=hz+SH*0.15;
    skyGrad=CX.createLinearGradient(0,top,0,bot);
    // La palette de la bible : indigo profond, magenta, orange brûlé.
    skyGrad.addColorStop(0,'#120A2C');
    skyGrad.addColorStop(0.30,'#1B1040');
    skyGrad.addColorStop(0.58,'#6B2360');
    skyGrad.addColorStop(0.78,'#B0316E');
    skyGrad.addColorStop(0.92,'#E9603F');
    skyGrad.addColorStop(1,'#FF8A3D');
    skyGnd=CX.createLinearGradient(0,hz,0,hz+SH*0.9);
    skyGnd.addColorStop(0,'rgb('+FOG_COL.r+','+FOG_COL.g+','+FOG_COL.b+')');
    skyGnd.addColorStop(0.38,'#1B1030');
    skyGnd.addColorStop(1,'#0A0518');
  }
  CX.fillStyle=skyGrad;CX.fillRect(0,0,SW,Math.max(0,Math.min(SH,hz)));
  drawClouds(hz);
  // Le sol n'est pas de la géométrie : un plan infini à y = 0 est
  // exactement ce que le tri par peintre gère le plus mal. Rempli en
  // espace écran sous l'horizon, il est correct et gratuit.
  if(hz<SH){
    CX.fillStyle=skyGnd;CX.fillRect(0,Math.max(0,hz),SW,SH-Math.max(0,hz));
    drawStreetGlow(hz);
  }

  // Le soleil, très loin dans sa direction d'éclairage.
  if(sunGrad&&project(CAM.x+SUN.x*3000,CAM.y+SUN.y*3000,CAM.z+SUN.z*3000)){
    CX.save();
    CX.translate(_px,_py);
    CX.fillStyle=sunGrad;
    CX.fillRect(-sunR,-sunR,sunR*2,sunR*2);
    CX.restore();
    CX.fillStyle='rgba(255,240,206,0.94)';
    CX.beginPath();CX.arc(_px,_py,Math.min(SW,SH)*0.030,0,6.2832);CX.fill();
    bloomBlob(_px,_py,Math.min(SW,SH)*0.075,'#FFD98A',0.85);
  }
}

/* La rue, tout en bas. On ne la détaille pas — on la voit de cent mètres.
   Ce qui la vend, ce sont les TRAÎNÉES VERTICALES de reflet sous chaque
   source lumineuse : l'asphalte mouillé sans un seul pixel d'asphalte.
   Les positions viennent des tours elles-mêmes, donc elles sont stables et
   suivent la caméra sans le moindre état à entretenir. */
function drawStreetGlow(hz){
  if(!QUAL.streaks)return;
  const half=(G-1)*0.5;
  const d=Math.min(QUAL.dist,300);
  const i0=Math.max(0,Math.floor((CAM.x-d)/CFG.CELL+half));
  const i1=Math.min(G-1,Math.ceil((CAM.x+d)/CFG.CELL+half));
  const j0=Math.max(0,Math.floor((CAM.z-d)/CFG.CELL+half));
  const j1=Math.min(G-1,Math.ceil((CAM.z+d)/CFG.CELL+half));
  CX.save();
  CX.globalCompositeOperation='lighter';
  for(let j=j0;j<=j1;j++)for(let i=i0;i<=i1;i++){
    const k=j*G+i;
    if(!tOcc[k])continue;
    if(hash2(k,4441)>0.34)continue;             // une tour sur trois éclaire la rue
    if(!project(tX[k],0.6,tZ[k]))continue;
    if(_py<hz-2||_py>SH+40)continue;
    const w=Math.max(1.5,3.2*_pk), h=Math.max(6,26*_pk);
    CX.fillStyle=hash2(k,911)>0.5?'rgba(255,46,136,0.16)':'rgba(37,229,255,0.14)';
    CX.beginPath();
    CX.ellipse(_px,_py+h*0.4,w,h,0,0,6.2832);
    CX.fill();
  }
  CX.restore();
}

/* ─────────────────────────────────────────────────────────────
   14. COLLECTE DE LA VILLE ET DES RIGS
   La trame est régulière : elle sert directement de grille spatiale.
   On ne parcourt que les cellules dans la distance de rendu, et on rejette
   par cône de vue avant de pousser la moindre face.
   ───────────────────────────────────────────────────────────── */
function collectCity(){
  const d=QUAL.dist;
  const half=(G-1)*0.5;
  const i0=Math.max(0,Math.floor((CAM.x-d)/CFG.CELL+half));
  const i1=Math.min(G-1,Math.ceil((CAM.x+d)/CFG.CELL+half));
  const j0=Math.max(0,Math.floor((CAM.z-d)/CFG.CELL+half));
  const j1=Math.min(G-1,Math.ceil((CAM.z+d)/CFG.CELL+half));
  const tanH=Math.tan(CAM.fov*0.5);
  for(let j=j0;j<=j1;j++)for(let i=i0;i<=i1;i++){
    const k=j*G+i;
    if(!tOcc[k])continue;
    const hgt=tH[k];
    toEye(tX[k],hgt*0.5,tZ[k]);
    if(_ez>d)continue;
    const marg=(tW[k]+tD[k])*1.2+10;
    if(_ez<-marg)continue;
    if(Math.abs(_ex)>(Math.abs(_ez)+marg)*tanH*1.6+marg)continue;
    pushBox(tX[k],tZ[k],tW[k],tD[k],0,hgt,tCol[k],k);
    // ── Ce qu'il y a SUR les toits ──────────────────────────────────
    // Un toit nu ne donne aucune échelle : c'est une surface, pas un
    // endroit. Une cage d'escalier, un groupe de climatisation, un
    // château d'eau, une antenne — et d'un coup la tour fait cent mètres.
    // Tout est décidé par hachage de la position : stable d'une image à
    // l'autre, et identique d'un chargement à l'autre.
    if(tTop[k]&&_ez<230&&QUAL.windows>0){
      const w=tW[k]*0.34, dd=tD[k]*0.34;
      pushBox(tX[k]-tW[k]*0.3,tZ[k]+tD[k]*0.3,w,dd,hgt,hgt+3.4,MAT_STRUCT+1,-1);
    }
    if(QUAL.clutter&&_ez<150){
      const h1=hash2(k,3301), h2=hash2(k,5507), h3=hash2(k,7717);
      // Groupe de climatisation : la pièce la plus commune d'un toit.
      if(h1>0.35){
        const cw=Math.min(2.2,tW[k]*0.22);
        pushBox(tX[k]+tW[k]*0.42,tZ[k]-tD[k]*0.38,cw,cw,hgt,hgt+1.5,MAT_STRUCT+4,-1);
      }
      // Antenne : un mât fin, très haut. Elle allonge la silhouette.
      if(h2>0.62){
        const ah=6+10*h3;
        pushBox(tX[k]-tW[k]*0.24,tZ[k]-tD[k]*0.24,0.22,0.22,hgt,hgt+ah,MAT_STRUCT,-1);
      }
      // Château d'eau : une cuve sur pieds, sur les toits les plus larges.
      if(QUAL.clutter>1&&h3>0.74&&tW[k]>9){
        const bx2=tX[k]-tW[k]*0.36, bz2=tZ[k]+tD[k]*0.30;
        pushBox(bx2,bz2,1.5,1.5,hgt,hgt+2.4,MAT_STRUCT+1,-1);
        pushBox(bx2,bz2,2.3,2.3,hgt+2.4,hgt+6.0,MAT_STRUCT+2,-1);
      }
    }
  }
}
function collectRigs(){
  for(let n=0;n<RIGS.length;n++){
    const rig=RIGS[n];
    toEye(rig.x,rig.roofY*0.5,rig.z);
    if(_ez>QUAL.dist+80||_ez<-60)continue;
    // La tour porteuse du rig : élancée, pour que la ligne du parcours se
    // lise dans la silhouette de la ville.
    pushBox(rig.x,rig.z,9.5,9.5,0,rig.roofY,(n*2)%BASE_COLS.length,4000+n);
    // Platelage du toit.
    pushBox(rig.x,rig.z,9.55,9.55,rig.roofY,rig.roofY+0.25,MAT_STRUCT+2,-1);
    const px=rig.dz, pz=-rig.dx;
    const my=rig.roofY+CFG.RIG_H*0.5;
    // Deux montants et une traverse : le portique.
    pushBoxDir(rig.x+px*1.9,my,rig.z+pz*1.9,rig.dx,rig.dz,0.24,0.24,CFG.RIG_H*0.5,MAT_STRUCT);
    pushBoxDir(rig.x-px*1.9,my,rig.z-pz*1.9,rig.dx,rig.dz,0.24,0.24,CFG.RIG_H*0.5,MAT_STRUCT);
    pushBoxDir(rig.ax,rig.ay+0.2,rig.az,px,pz,2.2,0.22,0.22,MAT_STRUCT);
    // Plateforme de départ, en retrait dans le plan du balancé.
    pushBox(rig.x-rig.dx*5.4,rig.z-rig.dz*5.4,1.7,1.7,rig.roofY+0.4,rig.roofY+2.0,MAT_STRUCT+1,-1);
    // La tour du final porte un mât : c'est le point d'arrivée, il doit se
    // repérer depuis n'importe où sur le parcours.
    if(rig.tower){
      pushBox(rig.x,rig.z,1.5,1.5,rig.roofY+0.25,rig.roofY+17,MAT_STRUCT+1,-1);
      pushBox(rig.x,rig.z,0.45,0.45,rig.roofY+17,rig.roofY+30,MAT_STRUCT,-1);
    }
  }
}

/* ─────────────────────────────────────────────────────────────
   15. L'ACROBATE

   Le squelette est décrit en coordonnées planes (avant, haut) dans le plan
   du rig, puis placé dans le monde. Chaque articulation est projetée, et
   les membres sont tracés ENTRE DEUX POINTS PROJETÉS.

   Ce détail a son importance : Deluxe dessinait ses membres à partir
   d'angles, avec une convention où l'angle 0 pointait vers le bas, ce qui
   avait fini par produire des bras à l'envers. En traçant de point à
   point, cette classe d'erreur devient structurellement impossible.
   ───────────────────────────────────────────────────────────── */
/* Traînée de figure. Un anneau de positions passées des mains, tracé en
   ruban qui s'efface. C'est ce qui rend une rotation LISIBLE : sans elle,
   un salto à 1,8 tour par seconde n'est qu'une silhouette qui clignote.
   Tableaux typés, écriture en anneau : aucune allocation. */
const TRN=26;
const trX=new Float64Array(TRN), trY=new Float64Array(TRN), trZ=new Float64Array(TRN);
let trN=0, trLive=0;
function trailReset(){trN=0;trLive=0;}
function trailPush(){
  trX[trN%TRN]=P.x;trY[trN%TRN]=P.y;trZ[trN%TRN]=P.z;
  trN++;if(trLive<TRN)trLive++;
}
function drawTrail(){
  if(trLive<3)return;
  CX.save();
  CX.globalCompositeOperation='lighter';
  CX.lineCap='round';CX.lineJoin='round';
  let px2=0,py2=0,has=false;
  for(let i=0;i<trLive;i++){
    const idx=(trN-trLive+i)%TRN;
    if(!project(trX[idx],trY[idx],trZ[idx])){has=false;continue;}
    const k=i/trLive;
    if(has){
      CX.strokeStyle=TRIM;
      CX.globalAlpha=0.30*k*k;
      CX.lineWidth=Math.max(1,0.16*_pk*k);
      CX.beginPath();CX.moveTo(px2,py2);CX.lineTo(_px,_py);CX.stroke();
    }
    px2=_px;py2=_py;has=true;
  }
  CX.restore();
}

const JX=new Float64Array(24),JY=new Float64Array(24),JK=new Float64Array(24);
let jOK=true, _jcs=1, _jsn=0;
function jproj(idx,gx,gy,gz,dx,dz,nx,nz,la,lb,off){
  const A=la*_jcs+lb*_jsn, B=-la*_jsn+lb*_jcs;
  if(!project(gx+dx*A+nx*off,gy+B,gz+dz*A+nz*off)){jOK=false;JK[idx]=0;return;}
  JX[idx]=_px;JY[idx]=_py;JK[idx]=_pk;
}
function seg(a,b,rad,col){
  const k=(JK[a]+JK[b])*0.5;
  if(k<=0)return;
  CX.strokeStyle=col;
  CX.lineWidth=Math.max(1,rad*2*k);
  CX.beginPath();CX.moveTo(JX[a],JY[a]);CX.lineTo(JX[b],JY[b]);CX.stroke();
}
const SUIT='#E8365F', SUIT_D='#8E1B3A', SKIN='#F2C79B', TRIM='#25E5FF';

function drawAcrobat(){
  const rig=RIGS[P.rig];
  const dx=rig.dx, dz=rig.dz;
  const nx=dz, nz=-dx;
  _jcs=Math.cos(P.phi);_jsn=Math.sin(P.phi);
  jOK=true;
  const tuck=P.tuck, pike=P.pike+tuck*0.75;
  const kA=0.05+pike*0.5+1.55*tuck;
  const sA=0.10+1.75*tuck;
  const hipA=pike*0.34;
  const kx=hipA+Math.sin(kA)*0.52, ky=-1.34-Math.cos(kA)*0.52;
  const fx=kx+Math.sin(kA+sA)*0.50, fy=ky-Math.cos(kA+sA)*0.50;
  // Le côté le plus proche de la caméra est dessiné en dernier.
  const nearSide=((CAM.x-P.x)*nx+(CAM.z-P.z)*nz)>=0?1:-1;

  for(let pass=0;pass<2;pass++){
    const off=(pass===0?-nearSide:nearSide);
    const A=0.19*off, L=0.13*off;
    jproj(0,P.x,P.y,P.z,dx,dz,nx,nz,0,0,A);            // main
    jproj(1,P.x,P.y,P.z,dx,dz,nx,nz,0,-0.66,A);        // épaule
    jproj(2,P.x,P.y,P.z,dx,dz,nx,nz,hipA,-1.34,L);     // hanche
    jproj(3,P.x,P.y,P.z,dx,dz,nx,nz,kx,ky,L);          // genou
    jproj(4,P.x,P.y,P.z,dx,dz,nx,nz,fx,fy,L);          // pied
    if(!jOK)return;
    const dark=pass===0;
    seg(0,1,0.075,dark?'#C9A886':SKIN);
    seg(2,3,0.098,dark?SUIT_D:SUIT);
    seg(3,4,0.076,dark?SUIT_D:SUIT);
    if(pass===1){
      // Tronc et tête, une seule fois, sur le côté proche.
      jproj(5,P.x,P.y,P.z,dx,dz,nx,nz,hipA*0.5,-1.0,0);
      jproj(6,P.x,P.y,P.z,dx,dz,nx,nz,0,-0.66,0);
      jproj(7,P.x,P.y,P.z,dx,dz,nx,nz,hipA,-1.34,0);
      if(!jOK)return;
      seg(6,7,0.145,SUIT);
      seg(6,5,0.150,SUIT);
      // Ceinture néon : c'est ce qui rend la silhouette lisible de loin,
      // et c'est la seule lumière que l'acrobate porte sur lui.
      seg(5,7,0.155,TRIM);
      // Bridé : de près, un rayon proportionnel à l'échelle donnait une
      // boule de lumière au milieu du torse au lieu d'un liseré qui rougeoie.
      bloomBlob((JX[5]+JX[7])*0.5,(JY[5]+JY[7])*0.5,
        Math.max(3,Math.min(SW*0.022,0.30*JK[5])),TRIM,0.30);
      jproj(8,P.x,P.y,P.z,dx,dz,nx,nz,0.05,-0.50,0);
      if(!jOK)return;
      CX.fillStyle=SKIN;
      CX.beginPath();CX.arc(JX[8],JY[8],Math.max(1,0.145*JK[8]),0,6.2832);CX.fill();
    }
  }
}

// Barre et câbles d'un rig. Dessinés en traits : ils sont trop fins pour
// mériter des faces, et leur épaisseur suit l'échelle de projection.
function drawBar(rig,ang){
  barAt(rig,ang);
  const bx=_bx,by=_by,bz=_bz;
  const px=rig.dz*0.68, pz=-rig.dx*0.68;
  if(!project(bx+px,by,bz+pz))return;
  const ax1=_px,ay1=_py,k1=_pk;
  if(!project(bx-px,by,bz-pz))return;
  const ax2=_px,ay2=_py,k2=_pk;
  if(!project(rig.ax+px,rig.ay,rig.az+pz))return;
  const cx1=_px,cy1=_py;
  if(!project(rig.ax-px,rig.ay,rig.az-pz))return;
  const cx2=_px,cy2=_py;
  const k=(k1+k2)*0.5;
  CX.strokeStyle='rgba(226,214,196,0.55)';
  CX.lineWidth=Math.max(0.7,0.028*k);
  CX.beginPath();CX.moveTo(cx1,cy1);CX.lineTo(ax1,ay1);
  CX.moveTo(cx2,cy2);CX.lineTo(ax2,ay2);CX.stroke();
  CX.strokeStyle='#D8C28A';
  CX.lineWidth=Math.max(1.2,0.11*k);
  CX.lineCap='round';
  CX.beginPath();CX.moveTo(ax1,ay1);CX.lineTo(ax2,ay2);CX.stroke();
}

/* ─────────────────────────────────────────────────────────────
   15 bis. LE FILET, LE PORTEUR, LE DRONE, LES PARTICULES

   Tout ce qui s'ajoute au décor de la session 1. Le filet et le porteur
   sont tracés en segments projetés, comme l'acrobate : ils sont trop fins
   pour mériter des faces, et leur épaisseur suit l'échelle de projection.
   Le drone, lui, est un volume : il passe par le tampon de faces et se
   trie donc correctement avec la ville.
   ───────────────────────────────────────────────────────────── */

/* Le filet du numéro, tendu sous le vol en cours. Il n'est pas dessiné
   sur toute la traversée : seulement sous le segment courant, là où il
   sert. Une grille de mailles projetées, deux passes de lignes. */
function drawNet(){
  const a=RIGS[P.rig], b=RIGS[P.dst]||a;
  const ny=netYNow();
  const dx=b.x-a.x, dz=b.z-a.z;
  const L=Math.hypot(dx,dz)||1;
  const ux=dx/L, uz=dz/L, px=uz, pz=-ux;
  // Le panneau couvre le segment ET l'acrobate. Un lâcher parti vers
  // l'arrière l'emmène derrière son propre rig : le filet le rattrapait
  // bien, mais il n'était dessiné nulle part sous lui. On étend donc la
  // nappe jusqu'à lui au lieu de la laisser accrochée au segment.
  const tP=(P.x-a.x)*ux+(P.z-a.z)*uz;
  const wP=(P.x-a.x)*px+(P.z-a.z)*pz;
  const t0=Math.min(-7,tP-10), t1=Math.max(L+7,tP+10);
  const HALF=Math.max(11,Math.abs(wP)+8);
  const near=(P.state==='net')?1:0;
  CX.strokeStyle=near?'rgba(240,236,220,0.55)':'rgba(226,214,196,0.28)';
  CX.lineWidth=Math.max(0.6,1.1*DPR);
  CX.beginPath();
  const N=7, M=5;
  for(let i=0;i<=N;i++){
    const tt=t0+(t1-t0)*(i/N);
    let started=false;
    for(let j=0;j<=M;j++){
      const w=-HALF+2*HALF*(j/M);
      if(!project(a.x+ux*tt+px*w,ny,a.z+uz*tt+pz*w)){started=false;continue;}
      if(!started){CX.moveTo(_px,_py);started=true;}else CX.lineTo(_px,_py);
    }
  }
  for(let j=0;j<=M;j++){
    const w=-HALF+2*HALF*(j/M);
    let started=false;
    for(let i=0;i<=N;i++){
      const tt=t0+(t1-t0)*(i/N);
      if(!project(a.x+ux*tt+px*w,ny,a.z+uz*tt+pz*w)){started=false;continue;}
      if(!started){CX.moveTo(_px,_py);started=true;}else CX.lineTo(_px,_py);
    }
  }
  CX.stroke();
}

/* Le porteur. Pendu par les jarrets à son propre trapèze, dans le plan du
   vol. Ses bras sont TENDUS pendant la fenêtre et RENTRÉS en dehors :
   l'annonce est dans la pose, pas seulement dans un texte. */
const _PJX=new Float64Array(8), _PJY=new Float64Array(8), _PJK=new Float64Array(8);
function pjoint(i,x,y,z){
  if(!project(x,y,z)){_PJK[i]=0;return false;}
  _PJX[i]=_px;_PJY[i]=_py;_PJK[i]=_pk;return true;
}
function pseg(i,j,rad,col){
  const k=(_PJK[i]+_PJK[j])*0.5;
  if(k<=0)return;
  CX.strokeStyle=col;CX.lineWidth=Math.max(1,rad*2*k);
  CX.beginPath();CX.moveTo(_PJX[i],_PJY[i]);CX.lineTo(_PJX[j],_PJY[j]);CX.stroke();
}
function drawPorteur(c){
  const s=Math.sin(c.ang), co=Math.cos(c.ang);
  const ux=c.dx*s, uy=-co, uz=c.dz*s;          // direction ancrage → mains
  const hang=c.rope-1.9;                        // la barre, puis le corps
  const bx=c.ax+ux*hang, by=c.ay+uy*hang, bz=c.az+uz*hang;
  const nx=c.dz*0.62, nz=-c.dx*0.62;
  // Câbles vers les deux tours : c'est ce qui explique qu'il tient en l'air.
  const A=RIGS[c.from], B=RIGS[c.from+1];
  CX.strokeStyle='rgba(226,214,196,0.24)';
  CX.lineWidth=Math.max(0.6,1.0*DPR);
  CX.beginPath();
  if(project(c.ax,c.ay,c.az)){
    const gx=_px, gy=_py;
    if(project(A.ax,A.ay+0.4,A.az)){CX.moveTo(gx,gy);CX.lineTo(_px,_py);}
    if(B&&project(B.ax,B.ay+0.4,B.az)){CX.moveTo(gx,gy);CX.lineTo(_px,_py);}
  }
  CX.stroke();
  // Câbles du trapèze du porteur, puis sa barre.
  CX.strokeStyle='rgba(226,214,196,0.55)';
  CX.beginPath();
  if(project(c.ax+nx,c.ay,c.az+nz)){
    const p1x=_px,p1y=_py;
    if(project(bx+nx,by,bz+nz)){CX.moveTo(p1x,p1y);CX.lineTo(_px,_py);}
  }
  if(project(c.ax-nx,c.ay,c.az-nz)){
    const p2x=_px,p2y=_py;
    if(project(bx-nx,by,bz-nz)){CX.moveTo(p2x,p2y);CX.lineTo(_px,_py);}
  }
  CX.stroke();
  if(!pjoint(0,bx+nx,by,bz+nz))return;
  if(!pjoint(1,bx-nx,by,bz-nz))return;
  pseg(0,1,0.10,'#D8C28A');
  // Corps : jarrets à la barre, tronc vers le bas, bras selon la fenêtre.
  const kx=bx, ky=by, kz=bz;
  const hipX=c.ax+ux*(hang+0.62), hipY=c.ay+uy*(hang+0.62), hipZ=c.az+uz*(hang+0.62);
  const shX=c.ax+ux*(hang+1.42), shY=c.ay+uy*(hang+1.42), shZ=c.az+uz*(hang+1.42);
  // Bras tendus vers l'amont, là d'où arrive le voltigeur.
  const reach=c.ready?1:0.34;
  const hx=shX+ux*0.50*reach-c.dx*0.30*reach, hy=shY+uy*0.50*reach, hz2=shZ+uz*0.50*reach-c.dz*0.30*reach;
  if(!pjoint(2,kx,ky,kz))return;
  if(!pjoint(3,hipX,hipY,hipZ))return;
  if(!pjoint(4,shX,shY,shZ))return;
  if(!pjoint(5,hx,hy,hz2))return;
  const suit=c.ready?'#2FB8D8':'#1E6C80';
  pseg(2,3,0.10,suit);
  pseg(3,4,0.145,suit);
  pseg(4,5,0.085,c.ready?'#F2C79B':'#C9A886');
  // Tête, et le halo qui signe la fenêtre ouverte.
  if(pjoint(6,shX+ux*0.30,shY+uy*0.30,shZ+uz*0.30)){
    CX.fillStyle='#F2C79B';
    CX.beginPath();CX.arc(_PJX[6],_PJY[6],Math.max(1,0.14*_PJK[6]),0,6.2832);CX.fill();
  }
  if(c.ready&&_PJK[5]>0){
    CX.fillStyle='rgba(255,217,138,0.22)';
    CX.beginPath();CX.arc(_PJX[5],_PJY[5],Math.max(2,CFG.PORT_R*0.55*_PJK[5]),0,6.2832);CX.fill();
  }
}

/* Le drone. Un volume dans le tampon de faces (il se trie donc avec la
   ville), plus ses hélices et son feu, tracés en superposition. */
function collectDrone(){
  if(!DRONE.live||DRONE.fade<=0.02)return;
  const dx=Math.cos(DRONE.ang+Math.PI*0.5), dz=Math.sin(DRONE.ang+Math.PI*0.5);
  const col=MAT_STRUCT+5;
  pushBoxDir(DRONE.x,DRONE.y,DRONE.z,dx,dz,0.62,0.40,0.20,col);
  if(QUAL.name!=='low'){
    pushBoxDir(DRONE.x,DRONE.y+0.16,DRONE.z,dx,dz,0.96,0.07,0.045,MAT_STRUCT);
    pushBoxDir(DRONE.x,DRONE.y+0.16,DRONE.z,-dz,dx,0.96,0.07,0.045,MAT_STRUCT);
  }
}
function drawDroneBits(){
  if(!DRONE.live||DRONE.fade<=0.02)return;
  const dx=Math.cos(DRONE.ang+Math.PI*0.5), dz=Math.sin(DRONE.ang+Math.PI*0.5);
  const px=-dz, pz=dx;
  const a=DRONE.fade;
  for(let i=0;i<4;i++){
    const sx=(i<2?1:-1)*0.78, sy=((i%2)?1:-1)*0.78;
    const rx=DRONE.x+dx*sx+px*sy, ry=DRONE.y+0.22, rz=DRONE.z+dz*sx+pz*sy;
    if(!project(rx,ry,rz))continue;
    const r=Math.max(1.6,0.42*_pk);
    CX.strokeStyle='rgba(180,210,255,'+(0.30*a).toFixed(3)+')';
    CX.lineWidth=Math.max(1,0.9*DPR);
    CX.beginPath();CX.ellipse(_px,_py,r,r*0.30,0,0,6.2832);CX.stroke();
    // Deux pales figées par l'échantillonnage : c'est le rendu d'une hélice
    // qui tourne plus vite que l'image, et c'est exactement ce qu'on voit.
    const ph=DRONE.rot+i*1.7;
    CX.beginPath();
    CX.moveTo(_px-Math.cos(ph)*r,_py-Math.sin(ph)*r*0.30);
    CX.lineTo(_px+Math.cos(ph)*r,_py+Math.sin(ph)*r*0.30);
    CX.stroke();
  }
  // Feu de position et objectif tourné vers l'acrobate.
  if(project(DRONE.x,DRONE.y-0.26,DRONE.z)){
    const blink=(DRONE.t%74)<30?1:0.15;
    CX.fillStyle='rgba(255,60,90,'+(a*blink*0.9).toFixed(3)+')';
    CX.beginPath();CX.arc(_px,_py,Math.max(1.2,0.13*_pk),0,6.2832);CX.fill();
    const g=CX.createRadialGradient(_px,_py,0,_px,_py,Math.max(6,0.9*_pk));
    g.addColorStop(0,'rgba(255,80,110,'+(a*blink*0.30).toFixed(3)+')');
    g.addColorStop(1,'rgba(255,80,110,0)');
    CX.fillStyle=g;CX.beginPath();CX.arc(_px,_py,Math.max(6,0.9*_pk),0,6.2832);CX.fill();
    bloomBlob(_px,_py,Math.max(5,0.7*_pk),'#FF5A72',a*blink*0.5);
  }
}

/* Particules : un chemin par teinte, six remplissages au maximum pour
   toute la nuée. Aucune chaîne construite, aucun objet créé. */
function drawParticles(){
  if(pLive<=0)return;
  for(let c=0;c<PART_COLS.length;c++){
    let any=false;
    CX.beginPath();
    for(let i=0;i<PCAP;i++){
      if(pLife[i]<=0||pCol[i]!==c)continue;
      if(!project(pX[i],pY[i],pZ[i]))continue;
      const k=pLife[i]/pMax[i];
      const r=Math.max(0.7,pR[i]*_pk*(0.35+0.65*k));
      CX.moveTo(_px+r,_py);
      CX.arc(_px,_py,r,0,6.2832);
      any=true;
    }
    if(any){CX.globalAlpha=0.85;CX.fillStyle=PART_COLS[c];CX.fill();CX.globalAlpha=1;}
    // Les particules brillent : elles nourrissent la lueur, elles aussi.
    if(any&&QUAL.bloom){
      for(let i=0;i<PCAP;i++){
        if(pLife[i]<=0||pCol[i]!==c)continue;
        if(!project(pX[i],pY[i],pZ[i]))continue;
        const kk=pLife[i]/pMax[i];
        bloomBlob(_px,_py,Math.max(2,pR[i]*_pk*2.4),PART_COLS[c],0.16*kk);
      }
    }
  }
}

/* Textes flottants. Ils appartiennent au monde (ils sont projetés) mais
   sont tracés à plat : c'est la convention de Deluxe, elle reste lisible
   quelle que soit l'orientation de la caméra. */
function drawFloatTexts(){
  CX.textAlign='center';CX.textBaseline='middle';
  for(let i=0;i<FTMAX;i++){
    const f=FT[i];if(!f.live)continue;
    if(!project(f.x,f.y,f.z))continue;
    const k=1-f.t/f.max;
    const sz=Math.max(9,Math.min(46,f.size*uiScale*0.55*Math.min(2.2,_pk*0.06+0.5)));
    CX.globalAlpha=k<0.28?k/0.28:1;
    CX.font='800 '+Math.round(sz)+'px '+FONT;
    CX.lineJoin='round';CX.lineWidth=Math.max(2,sz*0.22);
    CX.strokeStyle='rgba(6,2,16,0.72)';CX.strokeText(f.txt,_px,_py);
    CX.fillStyle=f.col;CX.fillText(f.txt,_px,_py);
  }
  CX.globalAlpha=1;
}

/* ─────────────────────────────────────────────────────────────
   15 ter. POST-TRAITEMENT

   Tout est fait au canvas 2D, sans un seul accès pixel : getImageData sur
   une image entière coûte plus cher que tout le reste du rendu réuni.
   Les canevas hors-écran, la tuile de bruit, les dégradés de vignette sont
   construits UNE FOIS, au redimensionnement — jamais dans la boucle.

   Ordre : lueur (bloom) → aberration → étalonnage → vignette → grain.
   Le HUD est dessiné APRÈS : il n'est jamais transformé.
   ───────────────────────────────────────────────────────────── */
let blA=null,blAX=null,blB=null,blBX=null,blC=null,blCX=null,blW=0,blH=0;
let postC=null,postX=null;
let noiseTile=null,noisePat=null,grainC=null;
let gradeVig=null;

function mkCanvas(w,h){
  const c=document.createElement('canvas');
  c.width=Math.max(1,w|0);c.height=Math.max(1,h|0);
  return c;
}
// La tuile de bruit ne dépend pas de la taille de l'écran : une seule fois,
// pour toute la vie de la page.
function buildNoise(){
  if(noiseTile)return;
  const N=128;
  noiseTile=mkCanvas(N,N);
  const x=noiseTile.getContext('2d');
  if(!x)return;
  const img=x.createImageData?x.createImageData(N,N):null;
  if(!img||!img.data){noiseTile=null;return;}
  const d=img.data;
  let seed=987654321;
  for(let i=0;i<N*N;i++){
    seed=(seed*1664525+1013904223)>>>0;
    const v=128+(((seed>>>16)&255)-128)*0.42;
    d[i*4]=v;d[i*4+1]=v;d[i*4+2]=v;d[i*4+3]=255;
  }
  if(x.putImageData)x.putImageData(img,0,0);
  try{noisePat=CX.createPattern(noiseTile,'repeat');}catch(e){noisePat=null;}
}
function buildPostBuffers(){
  buildNoise();
  buildSkyAssets();
  blW=Math.max(8,(SW/4)|0);blH=Math.max(8,(SH/4)|0);
  blA=mkCanvas(blW,blH);blAX=blA.getContext('2d');
  blB=mkCanvas(blW,blH);blBX=blB.getContext('2d');
  blC=mkCanvas(blW,blH);blCX=blC.getContext('2d');
  /* ÉTALONNAGE ET VIGNETTE EN UNE SEULE PASSE.
     Mesuré : chaque passe plein écran coûte de 2 à 11 ms en rastérisation
     logicielle, et il y en avait sept — 44 ms d'image, presque trois fois
     le budget. Or l'étalonnage et la vignette font la même chose : ils
     multiplient l'image par une couleur. Il suffit que cette couleur varie
     du centre vers le bord. Un dégradé radial chaud au centre, sombre et
     indigo sur les bords, en 'multiply' : deux effets, une passe. */
  const r=Math.hypot(SW,SH)*0.5;
  gradeVig=CX.createRadialGradient(HW,HH,r*0.24,HW,HH,r);
  gradeVig.addColorStop(0,'#FFD8B4');
  gradeVig.addColorStop(0.45,'#E4B491');
  gradeVig.addColorStop(0.78,'#9C7392');
  gradeVig.addColorStop(1,'#5A4270');
  /* GRAIN. Un fillRect au motif carrelé coûtait 8,7 ms : le carrelage se
     refait à chaque image. Une seule image de bruit, carrelée UNE FOIS à la
     taille de l'écran, se recopie ensuite d'un seul drawImage. */
  if(noiseTile){
    grainC=mkCanvas(SW+128,SH+128);
    const g=grainC.getContext('2d');
    if(g){
      let pat=null;
      try{pat=g.createPattern(noiseTile,'repeat');}catch(e){pat=null;}
      if(pat){g.fillStyle=pat;g.fillRect(0,0,SW+128,SH+128);}
      else grainC=null;
    }else grainC=null;
  }
}

/* LUEUR (bloom). Première version : réduire l'image finie, la multiplier
   par elle-même en guise de seuil, flouter, recomposer. Élégant sur le
   papier, MESURÉ À 8,3 ms — parce que relire le canevas principal pendant
   qu'on dessine dedans force un vidage du pipeline. L'aberration, bâtie sur
   le même principe, coûtait 9,3 ms de plus. À elles deux, elles faisaient
   passer la qualité haute de 2,6 ms à 20,7 ms : au-dessus du budget d'image.

   Deuxième version, celle-ci : on ne relit RIEN. Les sources lumineuses
   sont connues — le soleil, les fenêtres, les néons, les particules, le feu
   du drone, le liseré de l'acrobate — alors chacune dépose sa tache dans un
   tampon au quart de résolution AU MOMENT où elle est dessinée. On floute
   ce tampon, on le recompose en additif. Aucun seuil à approcher : on sait
   déjà ce qui brille. */
const BLK=0.25;                      // le tampon est au quart de résolution
function bloomBegin(){
  if(!QUAL.bloom||!blAX)return;
  blAX.globalCompositeOperation='source-over';blAX.globalAlpha=1;
  blAX.clearRect(0,0,blW,blH);
  blAX.globalCompositeOperation='lighter';
}
// Tache de lueur, en coordonnées ÉCRAN. Appelée par chaque source au
// moment où elle se dessine.
function bloomBlob(px,py,r,col,a){
  if(!QUAL.bloom||!blAX)return;
  const rr=r*BLK;
  const x=px*BLK, y=py*BLK;
  if(x<-rr||y<-rr||x>blW+rr||y>blH+rr)return;
  blAX.globalAlpha=a;
  blAX.fillStyle=col;
  blAX.beginPath();blAX.arc(x,y,rr<0.7?0.7:rr,0,6.2832);blAX.fill();
}
/* Compose la lueur, frange chromatique comprise, DANS le petit tampon —
   puis une seule montée en pleine résolution. La première version faisait
   trois montées plein écran (une par teinte) : 11 ms à elle seule. Ici les
   décalages et les teintes se paient à 320 × 180. */
function bloomCompose(){
  // blB reçoit la lueur finale.
  blBX.globalCompositeOperation='source-over';blBX.globalAlpha=1;
  blBX.clearRect(0,0,blW,blH);
  if(QUAL.aberr){
    // Teinte chaude, légèrement agrandie ; teinte froide, légèrement
    // réduite. L'écart croît avec la distance au centre : c'est exactement
    // le comportement d'un objectif, et ça ne se voit que sur les hautes
    // lumières — donc ici, et nulle part ailleurs.
    blBX.globalCompositeOperation='lighter';
    bloomFringe('#FF7A58',1.014,0.30);
    bloomFringe('#66A6FF',0.986,0.30);
    blBX.globalAlpha=0.42;
    blBX.drawImage(blA,0,0);
  }else{
    blBX.drawImage(blA,0,0);
  }
  blBX.globalCompositeOperation='source-over';blBX.globalAlpha=1;
}
function bloomFringe(col,k,alpha){
  blCX.globalCompositeOperation='source-over';blCX.globalAlpha=1;
  blCX.clearRect(0,0,blW,blH);
  blCX.drawImage(blA,0,0);
  blCX.globalCompositeOperation='multiply';
  blCX.fillStyle=col;blCX.fillRect(0,0,blW,blH);
  blCX.globalCompositeOperation='source-over';
  const dw=blW*k, dh=blH*k;
  blBX.globalAlpha=alpha;
  blBX.drawImage(blC,(blW-dw)*0.5,(blH-dh)*0.5,dw,dh);
}
/* Floute la lueur accumulée, la compose, et la monte à l'écran. Le flou
   est un flou de boîte : deux allers-retours en demi-résolution du petit
   tampon, soit quatre drawImage sur une image de 320 × 180. */
function bloomEnd(){
  if(!QUAL.bloom||!blAX||!blBX||!blCX)return;
  blAX.globalCompositeOperation='source-over';blAX.globalAlpha=1;
  const hw=(blW>>1)<2?2:(blW>>1), hh=(blH>>1)<2?2:(blH>>1);
  for(let i=0;i<2;i++){
    blBX.globalCompositeOperation='source-over';blBX.globalAlpha=1;
    blBX.clearRect(0,0,blW,blH);
    blBX.drawImage(blA,0,0,blW,blH,0,0,hw,hh);
    blAX.clearRect(0,0,blW,blH);
    blAX.drawImage(blB,0,0,hw,hh,0,0,blW,blH);
  }
  bloomCompose();
  // UNE seule montée en pleine résolution : c'est la passe plein écran la
  // plus chère du post-traitement — mesurée à 6 ms en rastérisation
  // logicielle — il ne peut donc y en avoir qu'une. Pré-multiplier
  // l'opacité dans le petit tampon pour composer à globalAlpha 1 a été
  // essayé : aucun gain, le coût est le blit lui-même.
  CX.save();
  CX.globalCompositeOperation='lighter';
  CX.globalAlpha=QUAL.aberr?0.62:0.38;
  CX.drawImage(blB,0,0,blW,blH,0,0,SW,SH);
  CX.restore();
}

/* Étalonnage ET vignette, en UNE passe. Le dégradé fait les deux : chaud au
   centre, sombre et indigo sur les bords. Voir buildPostBuffers. */
function postGradeVignette(){
  if(!QUAL.grade&&!QUAL.vignette)return;
  if(!gradeVig)return;
  CX.save();
  CX.globalCompositeOperation='multiply';
  CX.globalAlpha=QUAL.grade?0.62:0.40;
  CX.fillStyle=gradeVig;
  CX.fillRect(0,0,SW,SH);
  CX.restore();
}
/* Grain. La tuile est décalée d'un cran entier par image : le grain
   bouge, mais il ne scintille pas — il est le même bruit, ailleurs. */
function postGrain(){
  if(!QUAL.grain||!grainC)return;
  const ox=(frame*37)%128, oy=(frame*61)%128;
  CX.save();
  CX.globalCompositeOperation='overlay';
  CX.globalAlpha=0.05;
  CX.drawImage(grainC,-ox,-oy);
  CX.restore();
}
// Bandes cinéma : briefing, cartons d'acte, écran final. Elles font partie
// de l'image, pas du HUD — elles se ferment sur le jeu, pas sur l'interface.
let barsK=0;
function postBars(){
  const want=(gs==='menu'||gs==='intro'||gs==='finale'||gs==='levelcomplete'||actT>0)?1:0;
  barsK=lerp(barsK,want,0.10);
  if(barsK<0.01)return;
  const h=SH*0.105*barsK;
  CX.fillStyle='rgba(3,1,10,0.96)';
  CX.fillRect(0,0,SW,h);CX.fillRect(0,SH-h,SW,h);
}
function postProcess(){
  bloomEnd();
  postGradeVignette();
  postGrain();
  postBars();
}

/* ─────────────────────────────────────────────────────────────
   16. RENDU
   Ordre strict : ciel, sol, volumes triés, et l'acrobate INSÉRÉ dans la
   pile triée à sa propre profondeur — pas plaqué devant tout le monde.
   ───────────────────────────────────────────────────────────── */
const OVCAP=32;
const ovD=new Float64Array(OVCAP), ovT=new Int32Array(OVCAP), ovN=new Int32Array(OVCAP);
const ovOrder=[];
// Types de superposition : 0 barre, 1 acrobate, 2 porteur, 3 filet.
function render(){
  camPrepare();
  CX.setTransform(1,0,0,1,0,0);
  bloomBegin();
  drawSky();
  facesReset();
  collectCity();
  collectRigs();
  collectDrone();
  sortFaces();

  // Superpositions : chacune est INSÉRÉE à sa propre profondeur dans la
  // pile triée, jamais plaquée devant tout le monde.
  let on=0;
  for(let n=0;n<RIGS.length&&on<OVCAP-4;n++){
    const rig=RIGS[n];
    if(n===P.rig&&P.state==='hang')continue;   // dessinée avec l'acrobate
    barAt(rig,rig.ang);
    ovD[on]=eyeZ(_bx,_by,_bz);ovT[on]=0;ovN[on]=n;on++;
  }
  for(let i=0;i<PORTS.length&&on<OVCAP-2;i++){
    const c=PORTS[i];
    portHands(c,c.ang);
    ovD[on]=eyeZ(_hx,_hy,_hz);ovT[on]=2;ovN[on]=i;on++;
  }
  if(gs==='playing'||gs==='finale'){
    const a=RIGS[P.rig], b=RIGS[P.dst]||a;
    ovD[on]=eyeZ((a.x+b.x)*0.5,netYNow(),(a.z+b.z)*0.5);ovT[on]=3;ovN[on]=0;on++;
  }
  ovD[on]=eyeZ(P.x,P.y-0.9,P.z);ovT[on]=1;ovN[on]=P.rig;on++;
  ovOrder.length=on;
  for(let i=0;i<on;i++)ovOrder[i]=i;
  ovOrder.sort(function(a,b){return ovD[b]-ovD[a];});

  let cursor=fStart;
  for(let i=0;i<on;i++){
    const o=ovOrder[i];
    const cut=faceSplit(ovD[o]);
    if(cut>cursor){drawFaceRange(cursor,cut);cursor=cut;}
    const ty=ovT[o];
    if(ty===0)drawBar(RIGS[ovN[o]],RIGS[ovN[o]].ang);
    else if(ty===2)drawPorteur(PORTS[ovN[o]]);
    else if(ty===3)drawNet();
    else{
      if(P.state==='hang')drawBar(RIGS[P.rig],P.ang);
      drawTrail();
      drawAcrobat();
    }
  }
  if(cursor<fn)drawFaceRange(cursor,fn);

  // Couche des billboards : hélices du drone, particules, textes du monde.
  drawDroneBits();
  drawParticles();
  drawFloatTexts();

  // Post-traitement : il transforme l'image du monde, jamais le HUD.
  postProcess();

  drawHUD();
}

/* ─────────────────────────────────────────────────────────────
   17. ÉTAT DE JEU ET INTERFACE
   Le HUD complet, les menus au canvas et les réglages d'accessibilité.
   ───────────────────────────────────────────────────────────── */
let gs='menu';    // 'menu' | 'intro' | 'settings' | 'playing' | 'finale' | 'levelcomplete' | 'gameover'
let introT=0;             // avancement de la cinématique d'ouverture
let slowT=0;              // ralenti, en millisecondes de temps réel restant
const INTRO_LEN=470;      // ~3,9 s à 120 Hz
let paused=false;
let settingsFrom='menu';  // écran vers lequel revenir : 'menu' ou 'pause'
let menuSel=0, settingsSel=0, pauseSel=0, resultsSel=0;

/* ── Zones tactiles des écrans de menu ──
   Repeuplées à chaque image par l'écran actif ; le clic ou le tap les
   consulte plutôt que deviner des coordonnées à l'aveugle. Le motif exact
   de trapeze-stars-v2.html : registre plat, dernier inscrit gagne. */
let hitZones=[];
function zone(x,y,w,h,fn){hitZones.push({x:x,y:y,w:w,h:h,fn:fn});}
function hitTest(px,py){
  for(let i=hitZones.length-1;i>=0;i--){
    const z=hitZones[i];
    if(px>=z.x&&px<=z.x+z.w&&py>=z.y&&py<=z.y+z.h)return z.fn;
  }
  return null;
}
function openSettings(){settingsFrom=(gs==='playing'&&paused)?'pause':'menu';gs='settings';settingsSel=0;sfx('ui');}
function closeSettings(){gs=(settingsFrom==='pause')?'playing':'menu';if(settingsFrom==='pause')paused=true;sfx('uiBack');}
// `lives` et l'état 'gameover' ne servent plus au jeu : une chute ne coûte
// plus de vie, le filet rattrape et on repart du dernier toit. Les deux
// restent déclarés et rendus parce que tools/check.js traverse les trois
// jeux avec le même pont de test et force cet état ; le jeu, lui, n'y entre
// jamais de lui-même.
let lives=5, score=0, level=1, frame=0;
let debugOn=false, fps=60, faceAvg=0;

// La taille de texte du réglage d'accessibilité multiplie TOUTE la
// typographie du HUD : un seul point de passage, jamais une taille codée
// en dur qui l'oublierait.
function uiFont(size,weight){
  CX.font=(weight||700)+' '+Math.round(size*uiScale*SV.textScale)+'px '+FONT;
}
function outlineText(txt,x,y,size,col,weight,align){
  uiFont(size,weight);
  CX.textAlign=align||'center';CX.textBaseline='middle';
  // Contraste renforcé : contour plus large et plus opaque, pour un texte
  // qui reste lisible sur n'importe quel fond de la ville.
  CX.lineJoin='round';
  CX.lineWidth=Math.max(2,size*uiScale*(SV.highContrast?0.34:0.22));
  CX.strokeStyle=SV.highContrast?'rgba(0,0,0,0.92)':'rgba(6,2,16,0.72)';
  CX.strokeText(txt,x,y);
  CX.fillStyle=col;CX.fillText(txt,x,y);
}
// Comme outlineText, mais réduit la taille si le texte dépasserait maxW.
// Une valeur de réglage change de longueur avec la langue ("MOYENNE" contre
// "MED") : deviner une taille qui rentre toujours a déjà coûté deux passes
// sur V2 parce que la première correction n'avait pas été MESURÉE. Ici on
// mesure avec measureText avant de choisir quoi que ce soit.
function fitText(txt,x,y,maxW,size,col,weight,align){
  uiFont(size,weight);
  const w=CX.measureText(txt).width;
  const s=w>maxW?Math.max(9,size*maxW/w):size;
  outlineText(txt,x,y,s,col,weight,align);
}

// Le chrono n'est reformaté qu'au dixième de seconde : une chaîne par
// image pour un affichage qui ne change pas serait du gaspillage pur.
let _tStr='0:00.0', _tKey=-1;
function timeStr(sec){
  const k=(sec*10)|0;
  if(k!==_tKey){
    _tKey=k;
    const m=(k/600)|0, r=k-m*600;
    const ss=(r/10)|0;
    _tStr=m+':'+(ss<10?'0':'')+ss+'.'+(r%10);
  }
  return _tStr;
}

// Étoile à cinq branches. Le rendu définitif est le lot de la session 4 ;
// ici la forme est juste, la finition ne l'est pas encore.
function starPath(cx,cy,r){
  CX.beginPath();
  for(let i=0;i<10;i++){
    const a=-Math.PI*0.5+i*Math.PI/5;
    const rr=(i%2)?r*0.44:r;
    const x=cx+Math.cos(a)*rr, y=cy+Math.sin(a)*rr;
    if(i)CX.lineTo(x,y);else CX.moveTo(x,y);
  }
  CX.closePath();
}
// x est le bord DROIT de la rangee : c'est la colonne du HUD qui commande,
// et une rangee de cinq etoiles ne doit jamais deborder de l'ecran.
function drawHypeStars(xRight,y,r,gap){
  const x=xRight-r-4*(2*r+gap);
  const st=hypeStars();
  // Fraction de l'étoile en cours : la jauge doit se lire AVANT de gagner
  // l'étoile, sinon le joueur ne sait pas s'il progresse.
  const frac=clamp((hype-st*CFG.STAR_STEP)/CFG.STAR_STEP,0,1);
  for(let i=0;i<5;i++){
    const cx=x+i*(r*2+gap);
    // Pop d'apparition, façon étoile de recherche : un rebond bref à
    // l'instant où l'étoile est gagnée, jamais rejoué ensuite — l'étoile
    // grossit puis retombe à sa taille normale en quelques images.
    const pop=starPopT[i]/STAR_POP;
    const rr=r*(pop>0?1+0.55*Math.sin(pop*Math.PI):1);
    starPath(cx,y,rr);
    CX.fillStyle='rgba(10,4,26,0.55)';CX.fill();
    CX.lineWidth=Math.max(1,1.4*uiScale);
    CX.strokeStyle=i<st?'rgba(255,217,138,0.95)':'rgba(255,255,255,0.26)';CX.stroke();
    if(i<st){
      // Clignotement bref juste après le gain, comme la nouvelle étoile
      // de recherche d'un GTA.
      const blink=pop>0&&((starPopT[i]/4)|0)%2===0;
      starPath(cx,y,rr*0.92);CX.fillStyle=blink?'#FFFFFF':'#FFD98A';CX.fill();
    }
    else if(i===st&&frac>0.02){
      CX.save();CX.beginPath();
      CX.rect(cx-r,y+r-2*r*frac,2*r,2*r*frac);CX.clip();
      starPath(cx,y,r*0.92);CX.fillStyle='rgba(255,217,138,0.42)';CX.fill();
      CX.restore();
    }
  }
}

/* ── Radar des toits ──────────────────────────────────────────
   Panneau carré aux angles arrondis, en bas à gauche, comme le radar
   d'un GTA — mais ce qu'il montre, c'est le parcours du numéro : les
   sept rigs, le rig courant, le prochain, le drone. Orienté selon le cap
   de la caméra : « devant » sur le radar, c'est devant à l'écran.
   Peu coûteux — la ville est une grille, mais le radar ne dessine que
   sept points et un cercle. */
const RADAR_RANGE=150;   // mètres visibles du centre au bord
function radarPoint(px,py,wx,wz,R){
  // Position relative au joueur, tournée par le cap de la caméra : le nord
  // du radar suit ce que regarde la caméra, pas le nord du monde.
  const dx=wx-P.x, dz=wz-P.z;
  const cy2=Math.cos(-CAM.yaw), sy2=Math.sin(-CAM.yaw);
  const rx=dx*cy2-dz*sy2, rz=dx*sy2+dz*cy2;
  const d=Math.hypot(rx,rz);
  const k=Math.min(1,d/RADAR_RANGE)*R/(d||1);
  return{x:px+rx*k,y:py-rz*k,clipped:d>RADAR_RANGE};
}
function drawRadar(cx,cy,R){
  CX.save();
  CX.beginPath();CX.roundRect(cx-R,cy-R,R*2,R*2,R*0.22);CX.clip();
  CX.fillStyle='rgba(6,2,16,0.58)';CX.fillRect(cx-R,cy-R,R*2,R*2);
  // Cercles de distance, pour donner une échelle au coup d'œil.
  CX.strokeStyle='rgba(255,255,255,0.10)';CX.lineWidth=1;
  CX.beginPath();CX.arc(cx,cy,R*0.55,0,6.2832);CX.stroke();
  for(let n=0;n<RIGS.length;n++){
    const rig=RIGS[n];
    const p2=radarPoint(cx,cy,rig.x,rig.z,R*0.92);
    const isCur=n===P.rig, isNext=n===P.dst&&P.state!=='hang';
    const rr=(isCur?4.2:(isNext?3.6:2.4))*uiScale;
    CX.fillStyle=isCur?'#25E5FF':(isNext?'#FFD98A':'rgba(255,255,255,0.55)');
    CX.beginPath();CX.arc(p2.x,p2.y,rr,0,6.2832);CX.fill();
    if(isNext){
      CX.strokeStyle='rgba(255,217,138,0.65)';CX.lineWidth=Math.max(1,1.4*uiScale);
      CX.beginPath();CX.arc(p2.x,p2.y,rr+2.4*uiScale+Math.sin(frame*0.12)*1.2,0,6.2832);CX.stroke();
    }
  }
  // Le drone de télévision, s'il est en l'air.
  if(DRONE.live&&DRONE.fade>0.05){
    const dp=radarPoint(cx,cy,DRONE.x,DRONE.z,R*0.92);
    CX.fillStyle='rgba(255,90,110,'+(0.5+0.5*DRONE.fade).toFixed(2)+')';
    CX.beginPath();CX.arc(dp.x,dp.y,2.2*uiScale,0,6.2832);CX.fill();
  }
  CX.restore();
  CX.lineWidth=Math.max(1,1.4*uiScale);
  CX.strokeStyle='rgba(255,255,255,0.22)';
  CX.beginPath();CX.roundRect(cx-R,cy-R,R*2,R*2,R*0.22);CX.stroke();
  // Le joueur, fixe au centre : le radar tourne autour de lui, jamais
  // l'inverse — c'est ce qui le rend lisible en plein vol.
  CX.save();CX.translate(cx,cy);
  CX.fillStyle='#FFFFFF';
  CX.beginPath();CX.moveTo(0,-5*uiScale);CX.lineTo(4*uiScale,4.5*uiScale);
  CX.lineTo(0,2*uiScale);CX.lineTo(-4*uiScale,4.5*uiScale);CX.closePath();CX.fill();
  CX.restore();
}

/* ── Flèche hors champ vers le prochain rig ──────────────────
   Utile en vol et pendant le balancé : si la barre visée n'est pas dans
   le cadre (derrière le plan proche ou hors des bords), une flèche à la
   marge de l'écran indique où elle est. */
function drawNextRigArrow(){
  const tgt=RIGS[P.dst];
  if(!tgt)return;
  toEye(tgt.ax,tgt.ay,tgt.az);
  const onScreen=project(tgt.ax,tgt.ay,tgt.az)&&_px>40&&_px<SW-40&&_py>60&&_py<SH-60;
  if(onScreen)return;
  const ang=Math.atan2(_ex,Math.max(0.001,_ez));
  // Derrière la caméra : l'angle brut pointerait dans le mauvais sens.
  const bearing=_ez<0?(ang>=0?Math.PI-ang:-Math.PI-ang):ang;
  const R=Math.min(SW,SH)*0.42;
  const ax=HW+Math.sin(bearing)*R, ay=HH-Math.cos(bearing)*R*0.62;
  const cxp=clamp(ax,50*uiScale,SW-50*uiScale), cyp=clamp(ay,70*uiScale,SH-90*uiScale);
  CX.save();
  CX.translate(cxp,cyp);CX.rotate(bearing);
  CX.fillStyle='rgba(37,229,255,0.85)';
  CX.beginPath();CX.moveTo(0,-11*uiScale);CX.lineTo(8*uiScale,9*uiScale);
  CX.lineTo(0,4*uiScale);CX.lineTo(-8*uiScale,9*uiScale);CX.closePath();CX.fill();
  CX.restore();
}

/* ── Jauge de fenêtre de prise ────────────────────────────────
   Uniquement pendant un vol : la distance courante à la barre visée,
   colorée selon les MÊMES seuils que tryGrab() — le HUD ne fait
   qu'afficher un calcul qui existe déjà, il n'invente aucune règle. */
function drawCatchGauge(x,y,w,h){
  const tgt=RIGS[P.dst];
  if(!tgt||P.state!=='fly')return;
  barAt(tgt,tgt.ang);
  const d=Math.hypot(P.x-_bx,P.y-_by,P.z-_bz);
  const perf=CFG.GRAB_PERF*tgt.gw, good=CFG.GRAB_GOOD*tgt.gw, r=CFG.GRAB_R;
  const k=clamp(1-(d-perf)/(r-perf),0,1);
  CX.fillStyle='rgba(8,3,22,0.55)';CX.fillRect(x,y,w,h);
  const col=d<perf?'#25E5FF':(d<good?'#9CFF7A':(d<r?'#FFD98A':'rgba(255,255,255,0.25)'));
  CX.fillStyle=col;CX.fillRect(x,y,w*clamp(1-d/r,0,1),h);
  outlineText(t('catchWindow'),x,y-13*uiScale,10,'rgba(255,255,255,0.6)',800,'left');
}

/* Texte à chasse forcée. Le canvas ne sait pas espacer les lettres : on
   les place une par une. C'est ce qui donne la typographie très large et
   très aérée des cartons — impossible autrement, et c'est elle qui porte
   toute la grammaire visuelle du jeu. */
function tracked(txt,cx,cy,size,track,draw){
  CX.textAlign='center';CX.textBaseline='middle';
  CX.font='900 '+Math.round(size)+'px '+FONT;
  let w=0;
  for(let i=0;i<txt.length;i++)w+=CX.measureText(txt[i]).width+track;
  w-=track;
  let x=cx-w*0.5;
  for(let i=0;i<txt.length;i++){
    const ch=txt[i], cw=CX.measureText(ch).width;
    draw(ch,x+cw*0.5,cy);
    x+=cw+track;
  }
}
/* Le logo. Pas de police externe, pas d'image : un lettrage en capitales
   très espacées, cerné de plusieurs passes de contour de plus en plus fin
   et de plus en plus clair. C'est la recette du néon au canvas — un tube
   de verre, c'est exactement ça : un halo large et froid, un cœur blanc. */
// Renvoie le bas du lettrage, pour que ce qui suit ne vienne pas dessus.
let logoBottom=0;
function drawLogo(cx,cy,size,alpha){
  const u=uiScale;
  CX.save();
  CX.globalAlpha=alpha;
  const rows=[[t('title').slice(0,7),size,0.34],[t('title').slice(8),size*0.62,0.52]];
  let y=cy;
  for(let r=0;r<rows.length;r++){
    const txt=rows[r][0], sz=rows[r][1]*u, track=rows[r][2]*rows[r][1]*u;
    CX.save();
    CX.globalCompositeOperation='lighter';
    CX.lineJoin='round';
    // Trois halos, du plus large au plus serré.
    // Des contours trop larges transforment chaque lettre en pavé arrondi :
    // on obtient des lettres encadrées, pas un tube de néon. Ils suivent
    // maintenant la forme de la lettre de près.
    const halos=[[sz*0.17,'rgba(255,46,136,0.13)'],[sz*0.095,'rgba(255,46,136,0.26)'],
                 [sz*0.042,'rgba(37,229,255,0.55)']];
    for(let h=0;h<halos.length;h++){
      CX.lineWidth=halos[h][0];CX.strokeStyle=halos[h][1];
      tracked(txt,cx,y,sz,track,function(ch,x,yy){CX.strokeText(ch,x,yy);});
    }
    CX.restore();
    CX.lineJoin='round';
    CX.lineWidth=sz*0.055;CX.strokeStyle='rgba(8,2,20,0.85)';
    tracked(txt,cx,y,sz,track,function(ch,x,yy){CX.strokeText(ch,x,yy);});
    CX.fillStyle='#FFFFFF';
    tracked(txt,cx,y,sz,track,function(ch,x,yy){CX.fillText(ch,x,yy);});
    y+=sz*0.86;
  }
  logoBottom=y-size*u*0.62*0.40;
  CX.restore();
}

/* ── Réglages : la même grammaire de ligne partout ────────────
   Chaque ligne sait s'afficher (val) et se faire tourner (left/right) ;
   l'écran n'a qu'à les énumérer. C'est le motif exact de V2. */
function cycleQuality(dir){
  const names=['low','med','high'];
  let i=names.indexOf(QUAL.name);
  i=(i+dir+names.length)%names.length;
  setQuality(names[i]);
}
function settingsRowsV3(){
  return[
    {label:t('musicVol'),val:function(){return Math.round(SV.music*100)+'%';},
     left:function(){setVol('music',SV.music-0.1);},right:function(){setVol('music',SV.music+0.1);}},
    {label:t('sfxVol'),val:function(){return Math.round(SV.sfx*100)+'%';},
     left:function(){setVol('sfx',SV.sfx-0.1);},right:function(){setVol('sfx',SV.sfx+0.1);}},
    {label:t('lang'),val:function(){return LANG.toUpperCase();},
     left:function(){setLang(LANG==='fr'?'en':'fr');},right:function(){setLang(LANG==='fr'?'en':'fr');}},
    {label:t('quality'),val:function(){return t(QUAL.name==='med'?'med':QUAL.name);},
     left:function(){cycleQuality(-1);},right:function(){cycleQuality(1);}},
    {label:t('camSens'),val:function(){return Math.round(SV.camSens*100)+'%';},
     left:function(){SV.camSens=clamp(SV.camSens-0.15,0.4,2.2);persist();},
     right:function(){SV.camSens=clamp(SV.camSens+0.15,0.4,2.2);persist();}},
    {label:t('invertY'),val:function(){return SV.invertY?t('on'):t('off');},
     left:toggleInvertY,right:toggleInvertY},
    {label:t('aids'),val:function(){return SV.aids?t('on'):t('off');},
     left:toggleAids,right:toggleAids},
    {label:t('reduceMotion'),val:function(){return SV.reduceMotion?t('on'):t('off');},
     left:toggleReduceMotion,right:toggleReduceMotion},
    {label:t('reduceFlash'),val:function(){return SV.reduceFlash?t('on'):t('off');},
     left:toggleReduceFlash,right:toggleReduceFlash},
    {label:t('textSize'),val:function(){
       return SV.textScale<0.95?t('small'):(SV.textScale>1.15?t('large'):t('normal'));},
     left:function(){cycleTextScale(-1);},right:function(){cycleTextScale(1);}},
    {label:t('highContrast'),val:function(){return SV.highContrast?t('on'):t('off');},
     left:toggleHighContrast,right:toggleHighContrast},
  ];
}
function setLang(l){LANG=l;SV.lang=l;persist();}
function toggleInvertY(){SV.invertY=SV.invertY?0:1;persist();}
function toggleAids(){SV.aids=SV.aids?0:1;persist();}
function toggleReduceMotion(){SV.reduceMotion=SV.reduceMotion?0:1;updateAccessFlags();persist();}
function toggleReduceFlash(){SV.reduceFlash=SV.reduceFlash?0:1;updateAccessFlags();persist();}
function toggleHighContrast(){SV.highContrast=SV.highContrast?0:1;persist();}
const TEXT_SCALES=[0.85,1.0,1.25];
function cycleTextScale(dir){
  let i=0,bd=9;
  for(let k=0;k<TEXT_SCALES.length;k++){const d=Math.abs(TEXT_SCALES[k]-SV.textScale);if(d<bd){bd=d;i=k;}}
  i=(i+dir+TEXT_SCALES.length)%TEXT_SCALES.length;
  SV.textScale=TEXT_SCALES[i];persist();
}

function drawHUD(){
  const u=uiScale;
  if(gs==='menu'){drawMenuScreen();return;}
  if(gs==='settings'){drawSettingsScreen();return;}
  if(gs==='levelcomplete'){drawResults();return;}
  hitZones.length=0;

  // ── Jauge d'amplitude, à gauche ──
  // Sur tactile, le manche virtuel occupe tout le coin bas-gauche (132 px
  // CSS de diamètre) : la première capture montrait le radar totalement
  // avalé dessous. Toute la colonne gauche du HUD remonte donc d'autant
  // sur les écrans tactiles — invisible au clavier/souris, où le manche
  // n'existe pas.
  const touchGuard=isTouch?168*DPR:0;
  const gx=26*u, gy=SH-38*u-touchGuard, gw=Math.min(SW*0.34,240*u), gh=9*u;
  CX.fillStyle='rgba(8,3,22,0.55)';CX.fillRect(gx,gy,gw,gh);
  const k=clamp(P.amp/CFG.AMP_MAX,0,1);
  CX.fillStyle=P.amp>=CFG.GIANT?'#FF2E88':'#25E5FF';
  CX.fillRect(gx,gy,gw*k,gh);
  CX.fillStyle='rgba(255,255,255,0.30)';
  CX.fillRect(gx+gw*(CFG.GIANT/CFG.AMP_MAX),gy-3*u,2*u,gh+6*u);
  outlineText(P.amp>=CFG.GIANT?t('giant'):t('amp'),gx,gy-13*u,11,
    P.amp>=CFG.GIANT?'#FF2E88':'rgba(255,255,255,0.72)',800,'left');

  // ── Fenêtre de prise, juste au-dessus de la jauge d'amplitude ──
  // Réglage « Aides visuelles » : elle affiche un calcul qui existe déjà
  // (les seuils de tryGrab()), pour qui veut le voir avant de lâcher.
  if(SV.aids&&P.state==='fly')drawCatchGauge(gx,gy-38*u,gw*0.62,7*u);

  // ── Radar des toits, en bas à gauche, au-dessus du reste du HUD gauche ──
  const radR=Math.min(58*u,SW*0.09);
  drawRadar(radR+16*u,gy-70*u-radR,radR);

  // ── Étoiles de hype et multiplicateur, en haut à droite ──
  // Le bouton plein écran est un élément HTML posé par-dessus le canvas :
  // il faut lui laisser sa place, sinon le HUD passe dessous en portrait.
  const rx=SW-(46*DPR+10*u);
  drawHypeStars(rx,20*u,7*u,3*u);
  const st=hypeStars();
  if(st>0)outlineText('×'+hypeMult().toFixed(1),rx,40*u,13,'#FFD98A',900,'right');
  // ── Cagnotte, façon compteur de fric : la valeur affichée COURT après
  // le score réel, jamais un saut sec — c'est ce qui fait « compteur »
  // plutôt que « texte qui change ».
  if(displayScore<score)displayScore=Math.min(score,displayScore+Math.max(1,(score-displayScore)*0.14));
  else displayScore=score;
  const cashHot=bankVal>0||hypeMult()>1;
  outlineText('$'+Math.round(displayScore),rx,64*u,22,cashHot?'#FFD98A':'#9CFF7A',900,'right');
  if(bankVal>0){
    outlineText('+'+Math.round(bankVal)+' × '+(hypeMult()).toFixed(1),
      rx,86*u,14,'#FFD98A',800,'right');
    outlineText(bankN+' '+t('tricks'),rx,102*u,11,'rgba(255,255,255,0.55)',700,'right');
  }

  // ── Chrono et rig, en haut à gauche ──
  outlineText(timeStr(runTime()),22*u,22*u,20,'#FFFFFF',900,'left');
  outlineText(t('rig')+' '+(P.rig+1)+'/'+RIGS.length
    +'   ·   '+t(ACT_KEYS[act-1][0]),22*u,42*u,12,'rgba(255,255,255,0.6)',800,'left');
  if(falls>0)outlineText(t('rFalls')+' '+falls,22*u,58*u,11,'rgba(255,140,150,0.7)',700,'left');

  // ── Vent, quand le rig courant en subit un ──
  const wr=RIGS[P.rig];
  if(wr&&wr.wind){
    const w=(P.state==='fly'||P.state==='held')?P.windA:windNow(wr);
    const wk=clamp(Math.abs(w)/wr.wind,0,1);
    const wx=HW, wy=SH-56*u, ww=90*u;
    CX.fillStyle='rgba(8,3,22,0.5)';CX.fillRect(wx-ww*0.5,wy,ww,6*u);
    CX.fillStyle=wk<0.25?'#9CFF7A':(wk<0.6?'#FFD98A':'#FF5B6E');
    CX.fillRect(wx,wy,ww*0.5*(w/(wr.wind||1)),6*u);
    CX.fillStyle='rgba(255,255,255,0.5)';CX.fillRect(wx-1*u,wy-3*u,2*u,12*u);
    outlineText(wk<0.25?t('windCalm'):t('wind'),wx,wy-11*u,11,
      wk<0.25?'#9CFF7A':'rgba(255,255,255,0.72)',800);
  }

  if(toastT>0&&(gs==='playing'||gs==='finale'))outlineText(toast,HW,SH*0.22,22,toastCol,900);

  // ── Flèche vers le prochain rig, quand il n'est pas dans le cadre ──
  if(SV.aids&&gs==='playing'&&!paused&&(P.state==='hang'||P.state==='fly'))drawNextRigArrow();

  // ── Acte 1 : la porte des deux étoiles ──
  if(gs==='playing'&&!gateOpen)
    outlineText(t('gate'),HW,SH*0.30,15,'rgba(255,217,138,0.88)',800);

  // ── Carton d'acte ──
  // Ne s'affiche pas pendant la pause : les deux superposés se lisaient
  // mal (le pilule « REPRENDRE » venait chevaucher le sous-titre du
  // carton), et la pause a de toute façon la priorité visuelle.
  if(actT>0&&!paused){
    const p2=1-actT/ACT_CARD;
    // Entrée, tenue, sortie : trois temps, comme un carton de mission.
    const al=p2<0.14?p2/0.14:(p2>0.82?(1-p2)/0.18:1);
    CX.globalAlpha=clamp(al,0,1);
    const bh=SH*0.13;
    CX.fillStyle='rgba(6,2,16,0.78)';
    CX.fillRect(0,HH-bh,SW,bh*2);
    CX.fillStyle='#FF2E88';CX.fillRect(0,HH-bh,SW,2*u);
    CX.fillRect(0,HH+bh-2*u,SW,2*u);
    const asz=30*u;
    CX.lineJoin='round';
    CX.lineWidth=asz*0.16;CX.strokeStyle='rgba(255,46,136,0.45)';
    tracked(t(ACT_KEYS[act-1][0]),HW,HH-16*u,asz,asz*0.30,function(ch,x,y){CX.strokeText(ch,x,y);});
    CX.fillStyle='#FFFFFF';
    tracked(t(ACT_KEYS[act-1][0]),HW,HH-16*u,asz,asz*0.30,function(ch,x,y){CX.fillText(ch,x,y);});
    CX.fillStyle='#FFD98A';
    tracked(t(ACT_KEYS[act-1][1]),HW,HH+20*u,15*u,15*u*0.42,function(ch,x,y){CX.fillText(ch,x,y);});
    CX.globalAlpha=1;
  }

  // ── Rappel contextuel de la commande utile à l'instant ──
  if(SV.aids&&gs==='playing'&&!paused){
    let hint='';
    if(P.state==='fly')hint=t('grab')+'   ·   '+t('figure');
    else if(P.state==='hang')hint=t('pump')+'   ·   '+t('release');
    if(hint)outlineText(hint,HW,SH-22*u,12,'rgba(255,255,255,0.42)',700);
  }
  if(paused){drawPauseScreen();}
  if(gs==='finale'){
    // Les bandes cinéma sont posées par le post-traitement : elles ferment
    // sur le jeu, pas sur l'interface.
    outlineText(t('arrived'),HW,SH*0.30,30,'#25E5FF',900);
  }
  if(gs==='gameover'){
    CX.fillStyle='rgba(8,3,22,0.6)';CX.fillRect(0,0,SW,SH);
    outlineText(t('fall'),HW,HH-14*u,30,'#FF5B6E',900);
    outlineText(t('again'),HW,HH+22*u,14,'rgba(255,255,255,0.62)',700);
  }
  if(debugOn){
    CX.fillStyle='rgba(0,0,0,0.55)';CX.fillRect(0,0,244*u,150*u);
    const L=['fps '+fps.toFixed(0)+'   faces '+drawnFaces+(fnDropped?' (+'+fnDropped+' perdues)':''),
      'qual '+QUAL.name+'   dpr '+DPR.toFixed(2)+'   '+SW+'x'+SH,
      'etat '+P.state+'   rig '+(P.rig+1)+'/'+RIGS.length+'   acte '+act,
      'ang '+P.ang.toFixed(2)+'  angV '+P.angV.toFixed(2)+'  amp '+P.amp.toFixed(2),
      'pos '+P.x.toFixed(1)+' '+P.y.toFixed(1)+' '+P.z.toFixed(1),
      'hype '+hype.toFixed(0)+' ('+hypeStars()+'*)  cagnotte '+Math.round(bankVal)+'/'+bankN,
      'part '+pLive+'/'+pLiveMax+'   drone '+DRONE.fade.toFixed(2)+'   vent '+P.windA.toFixed(2),
      'cam yaw '+(CAM.yaw*180/Math.PI).toFixed(0)+'  pitch '+(CAM.pitch*180/Math.PI).toFixed(0)
        +'  fov '+(CAM.fov*180/Math.PI).toFixed(0)];
    for(let i=0;i<L.length;i++)outlineText(L[i],8*u,(14+i*17)*u,11,'#9CFF7A',700,'left');
  }
}

/* Écran de résultats. Il ne recalcule rien : toutes ces mesures ont été
   tenues pendant la traversée. */
const RES_K=['rTime','rChain','rStars','rFalls','rBank','rScore'];
function gradeOf(){
  // Trois critères lisibles, annoncés : finir, tomber peu, aller vite.
  if(falls===0&&runTime()<=120&&maxStars>=4)return 3;
  if(falls<=2)return 2;
  return 1;
}
