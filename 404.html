<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#08021a">
  <meta name="robots" content="noindex">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎪</text></svg>">
  <title>Page not found — Trapeze Stars</title>
  <style>
    :root{color-scheme:dark;--bg:#08021a;--card:#180a3b;--ink:#f4eeff;--muted:#b9a8dc;--gold:#ffc53d;--pink:#ff6b9d}
    *{box-sizing:border-box}
    body{margin:0;min-height:100dvh;display:grid;place-items:center;padding:24px;background:radial-gradient(circle at 50% 18%,#35105e 0,var(--bg) 58%);color:var(--ink);font-family:'Trebuchet MS',Avenir,'Segoe UI',system-ui,sans-serif;text-align:center}
    main{width:min(560px,100%);padding:clamp(28px,8vw,56px);border:1px solid rgba(255,255,255,.12);border-radius:24px;background:linear-gradient(160deg,rgba(31,12,73,.96),rgba(13,4,34,.96));box-shadow:0 24px 80px rgba(0,0,0,.45)}
    .mark{font-size:72px;line-height:1;filter:drop-shadow(0 8px 24px rgba(255,197,61,.25))}
    h1{margin:20px 0 8px;font-size:clamp(30px,8vw,48px)}
    p{margin:0 auto 28px;max-width:36ch;color:var(--muted);line-height:1.6}
    a{display:inline-block;padding:13px 24px;border-radius:999px;background:linear-gradient(100deg,var(--gold),var(--pink));color:#240826;font-weight:800;text-decoration:none;box-shadow:0 10px 32px rgba(255,107,157,.24)}
    a:focus-visible{outline:3px solid #fff;outline-offset:4px}
  </style>
</head>
<body>
  <main>
    <div class="mark" aria-hidden="true">🎪</div>
    <h1>Act not found</h1>
    <p>This stage does not exist, but all five Trapeze Stars games are waiting under the big top.</p>
    <a id="home" href="/">Back to the games</a>
  </main>
  <script>if(location.hostname.endsWith('.github.io'))document.getElementById('home').href='/trapeze/'</script>
</body>
</html>
