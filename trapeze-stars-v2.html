<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#05010f">
<meta name="description" content="Trapeze Stars Deluxe — un jeu de trapèze en perspective 3D, jouable au clavier et au tactile.">
<title>Trapeze Stars — Deluxe</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden;background:#05010f;}
body{
  font-family:'Trebuchet MS',Avenir,'Segoe UI',system-ui,sans-serif;
  color:#fff;user-select:none;-webkit-user-select:none;
  overscroll-behavior:none;touch-action:none;
  display:flex;align-items:center;justify-content:center;
}
#stage{position:fixed;inset:0;overflow:hidden;}
canvas{display:block;position:absolute;inset:0;width:100%;height:100%;touch-action:none;}

/* ── Boutons systeme ─────────────────────────────────────── */
.sysbtn{
  position:absolute;z-index:30;height:36px;min-width:36px;padding:0 9px;
  border:1px solid rgba(255,255,255,0.18);border-radius:9px;
  background:rgba(8,2,22,0.55);color:rgba(255,255,255,0.8);
  font:600 13px/1 inherit;cursor:pointer;
  display:none;align-items:center;justify-content:center;gap:5px;
  backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
  -webkit-tap-highlight-color:transparent;touch-action:manipulation;
  transition:background .12s,color .12s,transform .08s;
}
.sysbtn:hover{background:rgba(255,255,255,0.16);color:#fff;}
.sysbtn:active{transform:scale(0.93);}
#btnBack{top:calc(env(safe-area-inset-top,0px) + 10px);left:calc(env(safe-area-inset-left,0px) + 10px);}
#btnPause{top:calc(env(safe-area-inset-top,0px) + 10px);right:calc(env(safe-area-inset-right,0px) + 56px);}
#btnFull{top:calc(env(safe-area-inset-top,0px) + 10px);right:calc(env(safe-area-inset-right,0px) + 10px);display:flex;}

/* ── Commandes tactiles ──────────────────────────────────── */
#pad{position:absolute;inset:0;z-index:20;pointer-events:none;display:none;}
body.touch #pad.on{display:block;}
.tz{position:absolute;bottom:0;height:46%;pointer-events:auto;}
#tzMove{left:0;width:46%;}
#tzAct{right:0;width:54%;pointer-events:none;}

.btn{
  position:absolute;border-radius:50%;
  border:2px solid rgba(255,255,255,0.26);
  background:rgba(10,3,30,0.5);
  color:#fff;font:700 12px/1.15 inherit;text-align:center;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  backdrop-filter:blur(9px);-webkit-backdrop-filter:blur(9px);
  box-shadow:0 4px 20px rgba(0,0,0,0.55);
  pointer-events:auto;-webkit-tap-highlight-color:transparent;touch-action:manipulation;
  transition:transform .07s,background .07s,border-color .12s;
  will-change:transform;
}
.btn .ico{font-size:1.85em;line-height:1;}
.btn .lbl{font-size:0.72em;opacity:0.8;letter-spacing:.4px;margin-top:2px;}
.btn.hit{transform:scale(0.87);background:rgba(255,255,255,0.24);}

/* Deplacement : deux palettes, pouce gauche */
#bL,#bR{
  width:var(--bs);height:var(--bs);
  bottom:calc(env(safe-area-inset-bottom,0px) + 3.5vh);
  background:rgba(22,7,52,0.5);border-color:rgba(155,110,255,0.42);
}
#bL{left:calc(env(safe-area-inset-left,0px) + 3.5vw);}
#bR{left:calc(env(safe-area-inset-left,0px) + 3.5vw + var(--bs) + 3vw);}

/* Actions : pouce droit. Le principal est plus gros et plus bas. */
#bAct{
  width:var(--ba);height:var(--ba);
  right:calc(env(safe-area-inset-right,0px) + 3.5vw);
  bottom:calc(env(safe-area-inset-bottom,0px) + 3.5vh);
  background:radial-gradient(circle at 38% 30%,rgba(255,232,96,0.5),rgba(255,110,0,0.42));
  border-color:rgba(255,205,0,0.85);color:#FFE9A8;
  box-shadow:0 0 26px rgba(255,190,0,0.4),0 4px 16px rgba(0,0,0,0.55);
}
#bTrick{
  width:var(--bs);height:var(--bs);
  right:calc(env(safe-area-inset-right,0px) + 3.5vw + var(--ba) + 2.5vw);
  bottom:calc(env(safe-area-inset-bottom,0px) + 3.5vh + var(--ba) * 0.42);
  background:rgba(6,70,52,0.45);border-color:rgba(70,225,160,0.5);color:#B9FFE2;
}
:root{--bs:clamp(62px,15.5vw,84px);--ba:clamp(76px,19vw,104px);}
@media (orientation:portrait){
  :root{--bs:clamp(64px,17vw,92px);--ba:clamp(80px,21vw,112px);}
  .tz{height:38%;}
}
/* Pulsation quand une action a haute valeur est disponible */
@keyframes rdy{from{box-shadow:0 0 0 0 rgba(255,215,0,.55)}to{box-shadow:0 0 0 15px rgba(255,215,0,0)}}
.btn.ready{animation:rdy .85s ease-out infinite;}

#rotate{
  position:absolute;inset:0;z-index:60;display:none;
  flex-direction:column;align-items:center;justify-content:center;gap:14px;
  background:rgba(5,1,15,0.95);text-align:center;padding:24px;
}
#rotate.on{display:flex;}
#rotate .g{font-size:52px;animation:rot 2.2s ease-in-out infinite;}
@keyframes rot{0%,45%{transform:rotate(0)}55%,100%{transform:rotate(-90deg)}}
</style>
</head>
<body>
<div id="stage">
  <canvas id="cv"></canvas>
  <button class="sysbtn" id="btnBack" aria-label="Retour au menu">←</button>
  <button class="sysbtn" id="btnPause" aria-label="Pause">❚❚</button>
  <button class="sysbtn" id="btnFull" aria-label="Plein écran">⛶</button>
  <div id="pad">
    <div class="tz" id="tzMove"></div>
    <div class="tz" id="tzAct"></div>
    <button class="btn" id="bL" aria-label="Aller à gauche"><span class="ico">◀</span></button>
    <button class="btn" id="bR" aria-label="Aller à droite"><span class="ico">▶</span></button>
    <button class="btn" id="bTrick" aria-label="Figure ou pompage"><span class="ico">🌀</span><span class="lbl" id="lblTrick">FIGURE</span></button>
    <button class="btn" id="bAct" aria-label="Action principale"><span class="ico">⚡</span><span class="lbl" id="lblAct">SAUTER</span></button>
  </div>
  <div id="rotate"><div class="g">📱</div><div id="rotateTxt">Tournez l'appareil pour une vue plus large</div></div>
</div>
<script>
/* ══════════════════════════════════════════════════════════════════════
   TRAPEZE STARS — DELUXE (V2)
   Jeu de trapèze en perspective 3D. Canvas 2D, zéro dépendance.

   Repère du monde :
     X = latéral   (droite positive)
     Y = vertical  (haut positif, 0 = piste)
     Z = profondeur (le joueur progresse vers +Z, loin de la caméra)

   Le rendu projette chaque objet, puis les trie de l'arrière vers l'avant
   (algorithme du peintre). Toute la logique de jeu vit en unités monde ;
   aucune constante de gameplay ne dépend de la taille de l'écran.
   ══════════════════════════════════════════════════════════════════════ */
'use strict';

/* ─────────────────────────────────────────────────────────────
   1. CONFIGURATION
   ───────────────────────────────────────────────────────────── */
const CFG={
  // Physique. Toutes les valeurs sont par pas de simulation (1/60 s).
  GRAV:      0.62,
  MAXFALL:   19,
  JUMP:      -14.6,
  RUN_ACC:   0.85,
  RUN_MAX:   6.2,
  AIR_ACC:   0.52,
  AIR_MAX:   5.4,
  FRICTION:  0.80,
  AIR_DRAG:  0.9965,

  // Trapèze
  ROPE:      118,     // longueur de corde
  PUMP_GAIN: 1.35,    // gain d'amplitude sur un pompage réussi
  PUMP_LOSS: 0.945,   // pénalité sur un pompage manqué
  PUMP_WIN:  0.34,    // demi-largeur de la fenêtre de pompage, en radians
  PUMP_MIN:  0.046,   // impulsion plancher : relance un pendule à l'arrêt
  ANGV_MAX:  0.30,    // garde-fou : au-delà, le pendule s'emballe
  GIANT_ANG: 2.55,    // seuil d'entrée du grand soleil
  DAMP:      0.9985,  // amortissement du pendule

  // Assistance de saisie. Généreuse, invisible, jamais automatique.
  GRAB_R:    72,      // rayon d'assistance
  GRAB_BUF:  9,       // frames de mémoire d'entrée
  PERFECT:   24,      // écart, en unités monde, pour une prise parfaite
  GOOD:      48,

  // Progression avant
  FWD_BASE:  3.4,     // vitesse de course au sol
  FWD_MAX:   17,

  // Monde
  NET_Y:     95,      // filet, tendu au-dessus de la piste
  KILL_Y:    30,
  LANE:      150,     // demi-largeur jouable en X
  RIG_Y:     340,     // hauteur des barres de trapèze
  PEDESTAL:  296,     // hauteur des plateformes de repos

  // Caméra
  FOCAL:     560,
  CAM_BACK:  330,     // recul derrière le joueur
  CAM_UP:    62,
  CAM_LAG:   0.10,
  NEAR:      42,
  FAR:       4200,

  // Confort
  COYOTE:    9,
  JUMP_BUF:  9,
};

// Résolution virtuelle de référence. Le rendu s'adapte, la logique non.
const VW=1280, VH=720;

/* ─────────────────────────────────────────────────────────────
   2. INTERNATIONALISATION
   ───────────────────────────────────────────────────────────── */
const I18N={
  fr:{
    play:'JOUER', resume:'REPRENDRE', restart:'RECOMMENCER', menu:'MENU',
    paused:'PAUSE', gameover:'PARTIE TERMINÉE', levelDone:'NIVEAU RÉUSSI',
    score:'Score', best:'Record', level:'Niveau', lives:'Vies',
    heat:'Public', bank:'Cagnotte', tricks:'Figures', newBest:'Nouveau record !',
    tapStart:'Touchez pour commencer', pressStart:'Espace pour commencer',
    tapCont:'Touchez pour continuer', pressCont:'Espace pour continuer',
    chooseChar:'Choisissez votre artiste', settings:'Réglages', levels:'Niveaux',
    selectLevel:'Choisir un niveau', locked:'Verrouillé',
    jump:'SAUTER', release:'LÂCHER', grab:'SAISIR', pump:'POMPER',
    trick:'FIGURE', catcher:'PORTEUR !', giant:'GRAND SOLEIL !',
    perfect:'PARFAIT !', good:'BIEN', net:'FILET', ovation:'OVATION !',
    ola:'OLA !', combo:'ENCHAÎNEMENT', rotateHint:"Tournez l'appareil pour une vue plus large",
    tutJump:'Sautez pour vous élancer', tutGrab:'Saisissez la barre',
    tutPump:'Pompez en bas de l’arc pour prendre de l’ampleur',
    tutRelease:'Lâchez au bon moment', tutTrick:'Enchaînez des figures en vol',
    music:'Musique', sfx:'Effets', quality:'Qualité', lang:'Langue', speed:'Vitesse du jeu',
    vibrate:'Vibrations', guide:'Guide de trajectoire', back:'Retour',
    low:'Basse', med:'Moyenne', high:'Haute', on:'Oui', off:'Non',
    world:['Cirque','Jungle','Plage','Futur'],
  },
  en:{
    play:'PLAY', resume:'RESUME', restart:'RESTART', menu:'MENU',
    paused:'PAUSED', gameover:'GAME OVER', levelDone:'LEVEL CLEARED',
    score:'Score', best:'Best', level:'Level', lives:'Lives',
    heat:'Crowd', bank:'Bank', tricks:'Tricks', newBest:'New best!',
    tapStart:'Tap to start', pressStart:'Press Space to start',
    tapCont:'Tap to continue', pressCont:'Press Space to continue',
    chooseChar:'Choose your artist', settings:'Settings', levels:'Levels',
    selectLevel:'Select a level', locked:'Locked',
    jump:'JUMP', release:'RELEASE', grab:'GRAB', pump:'PUMP',
    trick:'TRICK', catcher:'CAUGHT!', giant:'GIANT SWING!',
    perfect:'PERFECT!', good:'GOOD', net:'NET', ovation:'OVATION!',
    ola:'WAVE!', combo:'COMBO', rotateHint:'Rotate your device for a wider view',
    tutJump:'Jump to launch yourself', tutGrab:'Grab the bar',
    tutPump:'Pump at the bottom of the arc to build height',
    tutRelease:'Release at the right moment', tutTrick:'Chain tricks in the air',
    music:'Music', sfx:'Effects', quality:'Quality', lang:'Language', speed:'Game speed',
    vibrate:'Vibration', guide:'Trajectory guide', back:'Back',
    low:'Low', med:'Medium', high:'High', on:'On', off:'Off',
    world:['Circus','Jungle','Beach','Future'],
  },
};
let LANG='fr';
function t(k){const d=I18N[LANG]||I18N.fr;return d[k]!==undefined?d[k]:(I18N.fr[k]!==undefined?I18N.fr[k]:k);}

/* ─────────────────────────────────────────────────────────────
   3. SAUVEGARDE
   Une seule clé, versionnée, tolérante à l'échec (Safari privé).
   ───────────────────────────────────────────────────────────── */
const SAVE_KEY='trapeze.v2.save';
const DEFAULT_SAVE={
  schema:1, best:0, bestLevel:{}, bestStars:{}, unlocked:1, char:'marc',
  lang:null, quality:null, music:0.6, sfx:0.75, vibrate:true, guide:true, seen:{},
  speed:1,
};
let SV=Object.assign({},DEFAULT_SAVE);
function loadSave(){
  try{
    const raw=localStorage.getItem(SAVE_KEY);
    if(raw){const o=JSON.parse(raw);
      if(o&&o.schema===1)SV=Object.assign({},DEFAULT_SAVE,o,
        {bestLevel:o.bestLevel||{},bestStars:o.bestStars||{},seen:o.seen||{}});}
  }catch(e){/* stockage indisponible : on garde les valeurs par défaut */}
}
let saveQueued=false;
function persist(){
  if(saveQueued)return;saveQueued=true;
  setTimeout(()=>{saveQueued=false;
    try{localStorage.setItem(SAVE_KEY,JSON.stringify(SV));}catch(e){}},260);
}
loadSave();
LANG=SV.lang||((navigator.language||'fr').slice(0,2)==='en'?'en':'fr');

/* ─────────────────────────────────────────────────────────────
   4. VIEWPORT
   Le canvas remplit l'écran. La caméra s'élargit ou se resserre
   selon le format, pour que le portrait soit jouable de plein droit.
   ───────────────────────────────────────────────────────────── */
const CV=document.getElementById('cv');
const CX=CV.getContext('2d',{alpha:false});
const stage=document.getElementById('stage');
let SW=VW, SH=VH, DPR=1, portrait=false, uiScale=1;

const isTouch=('ontouchstart' in window)||navigator.maxTouchPoints>0;
if(isTouch)document.body.classList.add('touch');

// prefers-reduced-motion : coupe la secousse et le grain, plafonne les
// particules. Le flash est deja plafonne a 0.5 d'opacite pour tous.
const _reduceMQ=window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)');
let reducedMotion=_reduceMQ?_reduceMQ.matches:false;
if(_reduceMQ&&_reduceMQ.addEventListener)
  _reduceMQ.addEventListener('change',e=>{reducedMotion=e.matches;});

function resize(){
  const w=Math.max(320,stage.clientWidth||window.innerWidth);
  const h=Math.max(320,stage.clientHeight||window.innerHeight);
  portrait=h>w;
  const cap=QUAL.dprCap;
  DPR=Math.min(window.devicePixelRatio||1,cap);
  SW=Math.round(w*DPR);SH=Math.round(h*DPR);
  if(CV.width!==SW||CV.height!==SH){CV.width=SW;CV.height=SH;}
  // L'échelle d'interface suit la plus petite dimension, plancher inclus,
  // pour que le HUD reste lisible sur un petit téléphone.
  // Le canvas est en pixels physiques : l'interface doit suivre la
  // densite d'ecran, sinon elle devient minuscule sur un ecran Retina.
  uiScale=clamp(Math.min(SW/VW,SH/VH)*(portrait?1.5:1.05),0.9,3.4);
  const rot=document.getElementById('rotate');
  if(rot)rot.classList.remove('on');
}
window.addEventListener('resize',resize);
window.addEventListener('orientationchange',()=>setTimeout(resize,180));

/* ─────────────────────────────────────────────────────────────
   5. QUALITÉ
   Trois profils. Détection automatique, puis surcharge possible.
   ───────────────────────────────────────────────────────────── */
const QUAL_PRESETS={
  low: {name:'low', bloom:false, grain:false, parts:200, layers:2, dprCap:1.0, shadows:false, trail:8},
  med: {name:'med', bloom:true,  grain:false, parts:460, layers:3, dprCap:1.5, shadows:true,  trail:14},
  high:{name:'high',bloom:true,  grain:true,  parts:900, layers:5, dprCap:2.0, shadows:true,  trail:22},
};
function autoQuality(){
  const mem=navigator.deviceMemory||4;
  const cores=navigator.hardwareConcurrency||4;
  if(isTouch&&(mem<=3||cores<=4))return QUAL_PRESETS.med;
  if(mem<=2||cores<=2)return QUAL_PRESETS.low;
  return QUAL_PRESETS.high;
}
let QUAL=SV.quality&&QUAL_PRESETS[SV.quality]?QUAL_PRESETS[SV.quality]:autoQuality();
function setQuality(name){
  QUAL=QUAL_PRESETS[name]||QUAL_PRESETS.med;
  SV.quality=QUAL.name;persist();onResize();
}
// Le premier dimensionnement a lieu dans init(), une fois que les
// utilitaires de la section 6 sont initialises.

// Surveillance du temps de frame : on descend d'un cran si ça ne suit pas.
// Jamais de remontée automatique, pour éviter les oscillations.
let perfSamples=[], perfChecked=false;
function watchPerf(dtMs){
  if(perfChecked||SV.quality)return;
  perfSamples.push(dtMs);
  if(perfSamples.length<110)return;
  perfSamples.shift();
  if(perfSamples.length>=100){
    const sorted=perfSamples.slice().sort((a,b)=>a-b);
    const p95=sorted[Math.floor(sorted.length*0.95)];
    if(p95>21){
      if(QUAL.name==='high')QUAL=QUAL_PRESETS.med;
      else if(QUAL.name==='med')QUAL=QUAL_PRESETS.low;
      else perfChecked=true;
      perfSamples=[];onResize();
    }
    if(QUAL.name==='low')perfChecked=true;
  }
}

/* ─────────────────────────────────────────────────────────────
   6. MATHS ET CAMÉRA
   ───────────────────────────────────────────────────────────── */
const clamp=(v,a,b)=>v<a?a:(v>b?b:v);
const lerp=(a,b,k)=>a+(b-a)*k;
const rnd=(a,b)=>a+Math.random()*(b-a);
const rndi=(a,b)=>Math.floor(rnd(a,b+1));
const pick=arr=>arr[(Math.random()*arr.length)|0];
// Bruit lisse : utilisé pour les secousses, bien plus stable qu'un
// Math.random() par frame, qui scintille au lieu de secouer.
function noise1(x){const i=Math.floor(x),f=x-i;
  const a=Math.sin(i*127.1)*43758.5453,b=Math.sin((i+1)*127.1)*43758.5453;
  const u=f*f*(3-2*f);return lerp(a-Math.floor(a),b-Math.floor(b),u)*2-1;}

const CAM={x:0,y:150,z:-CFG.CAM_BACK,tx:0,ty:150,tz:0,fov:1,shake:0,shakeT:0,roll:0};

// Projette un point monde. Renvoie null si le point est derrière la caméra.
// `out` évite une allocation par appel dans les boucles de rendu.
const _p={x:0,y:0,s:0,dz:0};
function project(x,y,z,out){
  const o=out||_p;
  const dz=z-CAM.z;
  if(dz<CFG.NEAR){o.dz=dz;o.s=0;return null;}
  // s est exprime en pixels par unite monde a cette profondeur :
  // il sert autant aux positions qu'aux tailles et aux epaisseurs.
  const s=(CFG.FOCAL*CAM.fov)/dz*viewScale;
  o.s=s;o.dz=dz;
  o.x=SW*0.5+(x-CAM.x)*s;
  o.y=SH*horizonY+(CAM.y-y)*s;
  return o;
}
// viewScale convertit les unités de projection en pixels écran.
// En portrait on resserre l'horizontal et on donne plus de hauteur.
let viewScale=1, horizonY=0.42;
function updateView(){
  CAM.fov=portrait?0.86:1;
  // Le couloir jouable, marge de décor comprise, doit toujours remplir la
  // largeur de l'écran à la profondeur du joueur. On en déduit l'échelle
  // au lieu de la deviner, ce qui rend portrait et paysage cohérents.
  const halfWorld=CFG.LANE+112;
  const sAtPlayer=(CFG.FOCAL*CAM.fov)/CFG.CAM_BACK;
  viewScale=clamp((SW*0.5/halfWorld)/sAtPlayer,0.4,8);
  horizonY=portrait?0.36:0.40;
}

/* ─────────────────────────────────────────────────────────────
   7. AUDIO
   Bus séparés (musique / effets) derrière un limiteur, ce qui rend
   les réglages de volume réellement indépendants.
   ───────────────────────────────────────────────────────────── */
const AU={ctx:null,master:null,music:null,sfx:null,ready:false,layers:[],playing:false};
function audioInit(){
  if(AU.ctx)return;
  try{
    const AC=window.AudioContext||window.webkitAudioContext;
    if(!AC)return;
    AU.ctx=new AC();
    const comp=AU.ctx.createDynamicsCompressor();
    comp.threshold.value=-9;comp.knee.value=24;comp.ratio.value=11;
    comp.attack.value=0.004;comp.release.value=0.22;
    AU.master=AU.ctx.createGain();AU.master.gain.value=0.9;
    AU.music=AU.ctx.createGain();AU.music.gain.value=SV.music;
    AU.sfx=AU.ctx.createGain();AU.sfx.gain.value=SV.sfx;
    AU.music.connect(AU.master);AU.sfx.connect(AU.master);
    AU.master.connect(comp);comp.connect(AU.ctx.destination);
    AU.ready=true;
  }catch(e){AU.ready=false;}
}
function audioResume(){
  audioInit();
  if(AU.ctx&&AU.ctx.state==='suspended'){AU.ctx.resume().catch(()=>{});}
}
function setVol(bus,v){
  if(bus==='music'){SV.music=v;if(AU.music)AU.music.gain.value=v;}
  else{SV.sfx=v;if(AU.sfx)AU.sfx.gain.value=v;}
  persist();
}
// Une voix simple : oscillateur, enveloppe exponentielle, glissando optionnel.
function voice(freq,dur,type,vol,glide,bus,delay){
  if(!AU.ready)return;
  try{
    const c=AU.ctx,t0=c.currentTime+(delay||0);
    const o=c.createOscillator(),g=c.createGain();
    o.type=type||'sine';
    o.frequency.setValueAtTime(freq,t0);
    if(glide)o.frequency.exponentialRampToValueAtTime(Math.max(20,glide),t0+dur);
    g.gain.setValueAtTime(0.0001,t0);
    g.gain.exponentialRampToValueAtTime(Math.max(0.0002,vol||0.2),t0+0.008);
    g.gain.exponentialRampToValueAtTime(0.0001,t0+dur);
    o.connect(g);g.connect(bus==='music'?AU.music:AU.sfx);
    o.start(t0);o.stop(t0+dur+0.02);
  }catch(e){}
}
function noiseBurst(dur,vol,freq){
  if(!AU.ready)return;
  try{
    const c=AU.ctx,n=Math.floor(c.sampleRate*dur);
    const buf=c.createBuffer(1,Math.max(1,n),c.sampleRate),d=buf.getChannelData(0);
    for(let i=0;i<n;i++)d[i]=(Math.random()*2-1)*(1-i/n);
    const src=c.createBufferSource();src.buffer=buf;

    const g=c.createGain();g.gain.value=vol||0.2;
    src.connect(f);f.connect(g);g.connect(AU.sfx);
    src.start();
  }catch(e){}
}

// Musique en couches : la base tourne toujours, les couches hautes
// n'entrent qu'avec la chaleur du public.
function musicStop(){
  AU.layers.forEach(o=>{try{o.stop();}catch(e){}});
  AU.layers=[];AU.playing=false;
}
function musicPlay(world){
  if(!AU.ready)return;
  musicStop();
  const c=AU.ctx,t0=c.currentTime+0.06;
  const ROOTS=[[131,165,196,262],[110,147,175,220],[147,185,220,294],[123,155,185,247]];
  const roots=ROOTS[world%4];
  const kind=['triangle','sine','sine','sawtooth'][world%4];
  const BEAT=0.34, BARS=8, total=BEAT*4*BARS;
  const mk=(freq,start,dur,vol,type,det)=>{
    try{
      const o=c.createOscillator(),g=c.createGain();
      o.type=type;o.frequency.value=freq;if(det)o.detune.value=det;
      g.gain.setValueAtTime(0.0001,start);
      g.gain.exponentialRampToValueAtTime(vol,start+0.02);
      g.gain.exponentialRampToValueAtTime(0.0001,start+dur);
      o.connect(g);g.connect(AU.music);
      o.start(start);o.stop(start+dur+0.02);
      AU.layers.push(o);
    }catch(e){}
  };
  // La chaleur du moment ou la boucle démarre décide des couches qui
  // entrent : elles ne sont réévaluées qu'au prochain cycle, ce qui
  // laisse la musique monter en intensité avec quelques secondes de délai.
  const withMelody=heatTier>=2, withBrass=heatTier>=3;
  for(let b=0;b<BARS*4;b++){
    const t=t0+b*BEAT;
    const r=roots[b%4===0?0:(b%2===0?2:1)];
    mk(r/2,t,BEAT*0.85,0.10,'sine');                       // basse
    if(b%2===0)mk(r*2,t,BEAT*0.5,0.045,kind,-6);           // arpège
    if(b%4===2)mk(r*3,t,BEAT*0.4,0.035,kind,7);
    if(withMelody&&b%4===0)mk(r*4,t,BEAT*1.7,0.052,'triangle',3);   // mélodie, palier ola
    if(withMelody&&b%8===4)mk(r*5,t,BEAT*0.9,0.04,'triangle',-4);
    if(withBrass&&b%8===0){                                         // cuivres, ovation
      mk(r*2,t,BEAT*2.4,0.07,'sawtooth',-5);
      mk(r*3,t,BEAT*2.4,0.06,'sawtooth',5);
    }
  }
  AU.playing=true;
  // La boucle se relance tant que la partie dure.
  AU.loopTimer=setTimeout(()=>{if(AU.playing&&gs==='play')musicPlay(world);},total*1000-120);
}

const PMAX=900;
const PP=new Array(PMAX);
for(let i=0;i<PMAX;i++)PP[i]={live:false,x:0,y:0,z:0,vx:0,vy:0,vz:0,
  life:0,dec:0.02,col:'#fff',r:3,grav:0.05,drag:0.98,kind:0,rot:0,rotV:0};
let pCount=0;
function emit(x,y,z,vx,vy,vz,col,r,dec,kind,grav){
  const cap=reducedMotion?Math.min(QUAL.parts,150):QUAL.parts;
  if(pCount>=cap)return null;
  for(let i=0;i<PMAX;i++){
    const p=PP[i];
    if(p.live)continue;
    p.live=true;pCount++;
    p.x=x;p.y=y;p.z=z;p.vx=vx;p.vy=vy;p.vz=vz;
    p.col=col;p.r=r;p.dec=dec;p.life=1;p.kind=kind||0;
    p.grav=grav===undefined?0.05:grav;p.drag=0.985;
    p.rot=Math.random()*6.28;p.rotV=(Math.random()-0.5)*0.3;
    return p;
  }
  return null;
}
function burst(x,y,z,col,n,spd,kind){
  for(let i=0;i<n;i++){
    const a=Math.random()*6.283,b=Math.acos(2*Math.random()-1);
    const s=spd*(0.4+Math.random()*0.8);
    emit(x,y,z,Math.sin(b)*Math.cos(a)*s,Math.cos(b)*s+0.8,Math.sin(b)*Math.sin(a)*s*0.6,
      col,2+Math.random()*3.4,0.020+Math.random()*0.02,kind||0);
  }
}
function confetti(x,y,z,n){
  const cols=['#ff4d5e','#4dc4ff','#ffcf3d','#b06dff','#4de08a','#ffffff','#ff6dc4'];
  for(let i=0;i<n;i++)
    emit(x,y,z,rnd(-4,4),rnd(1,7),rnd(-3,3),pick(cols),3+Math.random()*3.5,0.008,1,0.09);
}
function sparkRing(x,y,z,col,n){
  for(let i=0;i<n;i++){
    const a=(i/n)*6.283;
    emit(x,y,z,Math.cos(a)*4.4,Math.sin(a)*4.4,rnd(-1,1),col,2.6,0.028,2,0.012);
  }
}
function updateParts(){
  for(let i=0;i<PMAX;i++){
    const p=PP[i];if(!p.live)continue;
    p.x+=p.vx;p.y+=p.vy;p.z+=p.vz;
    p.vy-=p.grav;p.vx*=p.drag;p.vz*=p.drag;
    p.rot+=p.rotV;
    p.life-=p.dec;
    if(p.life<=0||p.y<CFG.KILL_Y){p.live=false;pCount--;}
  }
}
function clearParts(){for(let i=0;i<PMAX;i++)PP[i].live=false;pCount=0;}

   10. NIVEAUX
   Trois actes : ouverture écrite, développement modulaire, final écrit.

function levelParams(world,lv){
  const ease=1-dda*0.22;
  return{
    len:      (2600+world*420+lv*380),
    gapMin:   (250+lv*30)*ease,
    gapMax:   (360+lv*55)*ease,
    barY:     [CFG.RIG_Y,CFG.RIG_Y+18,CFG.RIG_Y+34][lv-1]||CFG.RIG_Y,
  };
}

  bars.length=0;catchers.length=0;hoops.length=0;stars.length=0;
  plats.length=0;hazards.length=0;props.length=0;

function addBar(z,x,y){
  const yy=(y===undefined?CFG.RIG_Y:y);
  const b={z,x,y:yy,w:132,
    anchorY:yy+CFG.ROPE,
    ang:rnd(-0.5,0.5),angV:rnd(-0.02,0.02),held:false,used:false,vib:0,cool:0,giants:0};
  bars.push(b);return b;
}
function addCatcher(z,x){
  const c={z,x,y:CFG.RIG_Y+26,ang:0,angV:0.030+Math.random()*0.008,
    phase:Math.random()*6.28,ready:false,used:false,af:0};
  catchers.push(c);return c;
}
function addHoop(z,x,y,r,fire){
  hoops.push({z,x,y,r:r||62,fire:!!fire,passed:false,rot:Math.random()*6.28,spin:rnd(0.01,0.03)});
}
function addStars(z,x,y,n,dz){
  for(let i=0;i<n;i++)stars.push({z:z+i*(dz||46),x,y,taken:false,t:Math.random()*6.28});
}
function addPlat(z,x,y,len,w){
  plats.push({z,x,y:(y===undefined?CFG.PEDESTAL:y),len:len||230,w:w||190});
}
function addHazard(z,x,y,kind){

// ── Banque de blocs. Chacun retourne la longueur en Z qu'il occupe. ──
const BLOCKS=[
  // Enchaînement simple de deux barres
  {name:'duo', diff:1, build(z,p){
    addBar(z+140,rnd(-60,60),p.barY);
    addBar(z+140+p.gapMin*1.05,rnd(-60,60),p.barY+rnd(-18,18));
    addStars(z+240,rnd(-40,40),p.barY-70,4);
    return p.gapMin*1.05+320;
  }},
  // Barre puis cerceau à traverser
  {name:'anneau', diff:2, build(z,p){
    addBar(z+130,rnd(-50,50),p.barY);
    addHoop(z+130+p.gapMin*0.8,rnd(-46,46),p.barY-46,62,Math.random()<0.5);
    addBar(z+130+p.gapMin*1.5,rnd(-60,60),p.barY);
    return p.gapMin*1.5+300;
  }},
  // Plateforme de repos : le joueur peut reprendre pied
  {name:'repos', diff:1, build(z,p){
    addPlat(z+120,0,CFG.PEDESTAL+rnd(-20,40),260,210);
    addStars(z+150,0,CFG.PEDESTAL+rnd(60,130),5,42);
    addBar(z+430,rnd(-50,50),p.barY);
    return 640;
  }},
  // Porteur : la figure signature
  {name:'porteur', diff:3, build(z,p){
    addBar(z+130,rnd(-40,40),p.barY);
    addCatcher(z+130+p.gapMin*1.25,rnd(-30,30));
    addBar(z+130+p.gapMin*2.4,rnd(-50,50),p.barY);
    return p.gapMin*2.4+320;
  }},
  // Slalom : trois barres décalées latéralement
  {name:'slalom', diff:3, build(z,p){
    const side=Math.random()<0.5?-1:1;
    for(let i=0;i<3;i++)
      addBar(z+140+i*p.gapMin*0.92,side*(i%2===0?78:-78),p.barY+i*10);
    return p.gapMin*2.76+320;
  }},
  // Couloir d'anneaux : très lisible en profondeur, idéal en démo
  {name:'tunnel', diff:2, build(z,p){
    addBar(z+120,0,p.barY);
    for(let i=0;i<4;i++)
      addHoop(z+300+i*130,Math.sin(i*1.1)*54,p.barY-34+Math.cos(i*0.9)*24,54+i*3,i%2===0);
    addBar(z+300+4*130+60,rnd(-40,40),p.barY);
    return 300+4*130+380;
  }},
  // Passage à obstacles
  {name:'danger', diff:4, build(z,p){
    addBar(z+130,rnd(-50,50),p.barY);
    addHazard(z+130+p.gapMin*0.72,rnd(-70,70),p.barY-30,0);
    addBar(z+130+p.gapMin*1.5,rnd(-50,50),p.barY+14);
    addHazard(z+130+p.gapMin*2.1,rnd(-70,70),p.barY-8,1);
    addBar(z+130+p.gapMin*2.8,rnd(-50,50),p.barY);
    return p.gapMin*2.8+340;
  }},
  // Grand écart : demande un vrai pompage pour être franchi
  {name:'ecart', diff:4, build(z,p){
    addBar(z+150,rnd(-40,40),p.barY);
    addStars(z+260,0,p.barY+40,6,52);
    addBar(z+150+p.gapMax*1.55,rnd(-40,40),p.barY-6);
    return p.gapMax*1.55+340;
  }},
];

function buildLevel(world,lv){
  resetWorld();
  const p=levelParams(world,lv);
  levelLen=p.len;
  let z=0;

  // ── Acte 1 : ouverture écrite. Sûre, elle enseigne le niveau. ──
  addPlat(-260,0,CFG.PEDESTAL,520,240);   // plateau de départ
  addBar(300,0,p.barY);
  addStars(170,0,120,4,44);
  addHoop(560,0,p.barY-40,66,false);
  addBar(720,rnd(-40,40),p.barY);
  addPlat(1020,0,CFG.PEDESTAL+rnd(-10,30),240,200);
  z=1300;

  // ── Acte 2 : développement modulaire, courbe de difficulté montante ──
  const devEnd=p.len*0.78;
  let last=null;
  while(z<devEnd){
    const prog=z/devEnd;
    const maxDiff=1+Math.round(prog*3)+(lv-1)*0.5;
    const pool=BLOCKS.filter(b=>b.diff<=maxDiff&&b!==last);
    const blk=pool.length?pick(pool):BLOCKS[0];
    last=blk;
    z+=blk.build(z,p);
    // Récompense optionnelle, hors trajectoire directe
    if(Math.random()<0.34)addStars(z-190,rnd(-100,100),p.barY+rnd(30,90),4,40);
  }

  // ── Acte 3 : final écrit. Le morceau de bravoure. ──
  const fz=z;
  addBar(fz+140,0,p.barY);
  addCatcher(fz+140+p.gapMin*1.3,0);
  for(let i=0;i<3;i++)addHoop(fz+560+i*140,Math.sin(i*1.6)*62,p.barY-30,58,true);
  addBar(fz+1080,0,p.barY+18);
  addStars(fz+1180,0,p.barY+60,8,44);
  goalZ=fz+1420;
  addPlat(goalZ-60,0,CFG.PEDESTAL,460,260); // plateau d'arrivée

  // ── Décor : anneaux du chapiteau, jalonnés en profondeur ──
  for(let pz=-400;pz<goalZ+600;pz+=340)props.push({z:pz});

  // Tri par profondeur : le rendu et les tests de proximité en dépendent.
  const byZ=(a,b)=>a.z-b.z;
  bars.sort(byZ);catchers.sort(byZ);hoops.sort(byZ);
  stars.sort(byZ);plats.sort(byZ);hazards.sort(byZ);
}

// Ressort d'écrasement / étirement, partagé par toutes les impulsions.
function squash(sx,sy){P.sx=sx;P.sy=sy;}
function squashUpdate(){
  const k=0.30,d=0.66;
  P.svx+=(1-P.sx)*k;P.svy+=(1-P.sy)*k;
  P.svx*=d;P.svy*=d;P.sx+=P.svx;P.sy+=P.svy;
}
function shake(amp,dur){
  if(reducedMotion)return;           // aucune secousse d'ecran
  camShakeAmp=Math.max(camShakeAmp,amp);camShakeT=Math.max(camShakeT,dur);
}

function vibrate(pattern){
  if(!SV.vibrate||!navigator.vibrate)return;
  try{navigator.vibrate(pattern);}catch(e){}
}

/* ─────────────────────────────────────────────────────────────
   12. SCORE, CHALEUR DU PUBLIC, CAGNOTTE
   La cagnotte n'est encaissée qu'à la réception. Une chute l'annule :
   c'est ce qui donne un sens au risque.
   ───────────────────────────────────────────────────────────── */
const HEAT_TIERS=[0,35,70,100];
function heatMult(){return [1,1.5,2,3][heatTier];}
function addHeat(v){
  heat=clamp(heat+v,0,100);
  const nt=heat>=100?3:heat>=70?2:heat>=35?1:0;
  if(nt>heatTier){
    heatTier=nt;
    if(nt===3){ovation=1;sfx('ovation');doFlash(14,TH.reward);shake(9,26);
      ftext(P.x,P.y+120,P.z,t('ovation'),TH.reward,44);confetti(P.x,P.y+90,P.z,40);}
    else if(nt===2){olaT=150;sfx('cash');ftext(P.x,P.y+100,P.z,t('ola'),TH.accent,32);}
    else{clapT=110;}
  } else if(nt<heatTier){heatTier=nt;if(nt<3)ovation=0;}
}
function addScore(pts,x,y,z,col,size){
  const v=Math.round(pts);
  score+=v;
  if(x!==undefined)ftext(x,y,z,'+'+v,col||'#fff',size||24);
  if(score>bestRun){bestRun=score;SV.best=score;persist();}
}
function bankTrick(name,pts){
  // Répéter la même figure dans une cagnotte la dévalue : cela force la variété.
  let rep=0;
  for(const n of bankNames)if(n===name)rep++;
  const val=pts*Math.pow(0.6,rep);
  bank+=val;bankTricks++;bankNames.push(name);
  sfx('trick');
  return val;
}
function cashBank(mult,x,y,z){
  if(bank<=0){bankNames.length=0;bankTricks=0;return 0;}
  const total=Math.round(bank*mult*heatMult());
  addScore(total,x,y+40,z,TH.reward,Math.min(46,22+total/90));
  addHeat(6+Math.min(18,bankTricks*3));
  sfx('cash');confetti(x,y+30,z,Math.min(30,10+bankTricks*4));
  bank=0;bankTricks=0;bankNames.length=0;
  return total;
}
function dropBank(){
  if(bank>0){
    ftext(P.x,P.y+50,P.z,'−'+Math.round(bank),'rgba(255,255,255,0.55)',22);
    sfx('fail');
  }
  bank=0;bankTricks=0;bankNames.length=0;
}

const KEY={};
function pressAction(){
  audioResume();
  if(gs==='menu'){startRun();return;}
  if(gs==='levelend'){nextLevel();return;}
  if(gs==='gameover'||gs==='finale'){toMenu();return;}
  if(gs==='pause'){togglePause();return;}
  if(gs==='settings'){settingsRows()[settingsSel].right();return;}
  if(gs==='levelselect'){
    if(levelSelIdx+1<=SV.unlocked)startAtLevel(levelSelIdx);
    return;
  }
  if(gs==='play')P.jumpBuf=CFG.JUMP_BUF;
}
function releaseAction(){P.jumpHeld=false;}
function pressTrick(){
  audioResume();
  if(gs==='play')P.trickBuf=CFG.GRAB_BUF;
  else pressAction();
}
function releaseTrick(){P.trickHeld=false;}

addEventListener('keydown',e=>{
  const k=e.key.length===1?e.key.toLowerCase():e.key;
  if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' '].includes(e.key))e.preventDefault();
  if(e.repeat)return;
  KEY[k]=true;

  // Écrans de navigation : réglages et sélection de niveau ont leurs
  // propres flèches, distinctes du déplacement en jeu.
  if(gs==='settings'){
    if(k==='ArrowUp')settingsSel=(settingsSel+settingsRows().length-1)%settingsRows().length;
    else if(k==='ArrowDown')settingsSel=(settingsSel+1)%settingsRows().length;
    else if(k==='ArrowLeft')settingsRows()[settingsSel].left();
    else if(k==='ArrowRight'||k===' '||k==='Enter')settingsRows()[settingsSel].right();
    else if(k==='Escape')closeSettings();
    return;
  }
  if(gs==='levelselect'){
    const cols=portrait?3:4;
    if(k==='ArrowLeft')levelSelIdx=Math.max(0,levelSelIdx-1);
    else if(k==='ArrowRight')levelSelIdx=Math.min(11,levelSelIdx+1);
    else if(k==='ArrowUp')levelSelIdx=Math.max(0,levelSelIdx-cols);
    else if(k==='ArrowDown')levelSelIdx=Math.min(11,levelSelIdx+cols);
    else if(k===' '||k==='Enter'){if(levelSelIdx+1<=SV.unlocked)startAtLevel(levelSelIdx);}
    else if(k==='Escape')closeLevelSelect();
    return;
  }
  if(gs==='menu'){
    if(k==='s')openSettings();
    if(k==='l'&&SV.unlocked>1)openLevelSelect();
  }
  if(gs==='pause'&&k==='s'){openSettings();return;}

  if(k===' '||k==='ArrowUp'||k==='w'||k==='z'){P.jumpHeld=true;pressAction();}
  if(k==='Shift'||k==='f'||k==='ArrowDown'||k==='x'){P.trickHeld=true;pressTrick();}
  if(k==='p'){togglePause();}
  if(k==='Escape'){if(gs==='play'||gs==='pause')togglePause();}
  if(k==='m'){setVol('music',SV.music>0?0:0.6);}
});
addEventListener('keyup',e=>{
  const k=e.key.length===1?e.key.toLowerCase():e.key;
  KEY[k]=false;
  if(k===' '||k==='ArrowUp'||k==='w'||k==='z')releaseAction();
  if(k==='Shift'||k==='f'||k==='ArrowDown'||k==='x')releaseTrick();
});

/* ─────────────────────────────────────────────────────────────
   14. PENDULE ET FIGURES
   ───────────────────────────────────────────────────────────── */
function grabBar(b,quality){
  P.state='swing';P.bar=b;b.held=true;b.vib=1;
  // L'angle de départ vient de la position réelle du joueur par rapport
  // à l'ancrage : la prise ne téléporte jamais, elle raccorde.
  const dz=P.z-b.z, dy=P.y-b.anchorY;
  P.ang=Math.atan2(dz,-dy);
  // La vitesse linéaire devient vitesse angulaire, projetée sur la tangente.
  const tz=Math.cos(P.ang), ty=Math.sin(P.ang);
  P.angV=clamp((P.vz*tz+P.vy*ty)/CFG.ROPE,-0.16,0.16);
  const keep=quality==='perfect'?1:quality==='good'?0.86:0.62;
  P.angV*=keep;
  P.vx*=0.4;P.vy=0;P.vz=0;P.giant=0;P.pumped=0;
  P.landQuality=quality;P.qualityT=44;
  sfx(quality==='perfect'?'perfect':'grab');
  vibrate(quality==='perfect'?[9,40,9]:[9]);
  squash(0.84,1.2);
  if(quality==='perfect'){
    addHeat(7);sparkRing(b.x,b.y,b.z,TH.reward,14);
    const c=cashBank(1.35,P.x,P.y,P.z);
    if(c===0&&!b.used)addScore(120,b.x,b.y,b.z,TH.reward,24);
    ftext(b.x,b.y+30,b.z,t('perfect'),TH.reward,30);
  } else {
    addHeat(3);
    cashBank(quality==='good'?1:0.75,P.x,P.y,P.z);
  }
  // Une fois la barre saisie, on enseigne le geste suivant : le pompage.
  if(tutStep<=2){tutStep=3;tutTimer=220;}
}
function releaseBar(){
  const b=P.bar;if(!b)return;
  b.held=false;b.vib=1;b.used=true;
  // Vitesse tangentielle au moment du lâcher.
  const v=P.angV*CFG.ROPE;
  P.vz=v*Math.cos(P.ang);
  P.vy=v*Math.sin(P.ang);
  // Un lâcher au bon endroit de l'arc donne une vraie portance.
  if(P.vy<0&&P.ang<0)P.vy*=0.5;
  // Chaque pompage réussi allonge la trajectoire : c'est la
  // récompense concrète de la maîtrise du rythme.
  P.vz*=1+0.055*Math.min(P.pumped,5);
  P.vz=clamp(P.vz,-6,CFG.FWD_MAX);
  b.cool=26;                      // évite de ré-attraper la barre qu'on quitte
  P.bar=null;P.state='air';P.spin=0;
  sfx('release');squash(1.22,0.8);
  if(tutStep===3){tutStep=4;tutTimer=200;}
}
function updateSwing(){
  const b=P.bar;if(!b)return;
  // Pendule : θ'' = −(g/L)·sin θ
  P.angV+=-(CFG.GRAV/CFG.ROPE)*Math.sin(P.ang);
  P.angV*=CFG.DAMP;
  P.ang+=P.angV;

  // Pompage : presser FIGURE en bas de l'arc, dans le sens du mouvement.
  if(P.trickBuf>0){
    const inWindow=Math.abs(P.ang)<CFG.PUMP_WIN;
    P.trickBuf=0;
    if(inWindow){
      // Impulsion plancher : on peut toujours relancer un trapèze mort.
      const dir=P.angV!==0?Math.sign(P.angV):(P.ang!==0?-Math.sign(P.ang):1);
      P.angV=dir*clamp(Math.max(Math.abs(P.angV)*CFG.PUMP_GAIN,CFG.PUMP_MIN),
                       0,CFG.ANGV_MAX);
      P.pumped++;P.pumpFlash=16;
      sfx('pump');vibrate([6]);addHeat(2.2);
      sparkRing(P.x,P.y,P.z,TH.accent,8);
      if(P.pumped===3)ftext(P.x,P.y+70,P.z,'RYTHME',TH.accent,24);
    } else {
      P.angV*=CFG.PUMP_LOSS;
      P.pumpFlash=-10;
    }
  }
  if(P.pumpFlash>0)P.pumpFlash--;else if(P.pumpFlash<0)P.pumpFlash++;

  // Grand soleil : le tour complet au-dessus de la barre.
  if(Math.abs(P.ang)>CFG.GIANT_ANG&&P.giant===0){
    P.giant=1;b.giants++;
    // Rendement décroissant : enchaîner les tours sur la même barre
    // ne remplace pas la progression.
    const k=Math.pow(0.45,b.giants-1);
    addScore(Math.round(400*k),P.x,P.y+50,P.z,TH.reward,32);
    bankTrick('giant',260*k);
    addHeat(13*k);
    if(b.giants<=2){
      ftext(P.x,P.y+92,P.z,t('giant'),TH.reward,34);
      sfx('giant');vibrate([14,30,14]);
      shake(6,16);sparkRing(b.x,b.y,b.z,TH.reward,20);
    }
  }
  if(Math.abs(P.ang)>Math.PI*2){P.ang-=Math.sign(P.ang)*Math.PI*2;P.giant=0;}

  // Position suspendue
  P.z=b.z+Math.sin(P.ang)*CFG.ROPE;
  P.y=b.anchorY-Math.cos(P.ang)*CFG.ROPE;
  P.x=lerp(P.x,b.x,0.24);

  // Lâcher
  if(P.jumpBuf>0){P.jumpBuf=0;releaseBar();}
}

// Figures en vol. La rotation est comptée en demi-tours bouclés :
// une rotation entamée mais non terminée ne rapporte rien.
function updateTricks(){
  if(P.state!=='air')return;
  if(P.trickHeld||P.trickBuf>0){
    if(P.trickBuf>0&&P.rotV===0){P.rotV=0.30;}
    P.trickBuf=0;
    P.rotV=Math.min(P.rotV+0.028,0.40);
  } else {
    P.rotV*=0.90;
    if(P.rotV<0.02)P.rotV=0;
  }
  if(P.rotV>0){
    const before=Math.floor(P.spin/Math.PI);
    P.spin+=P.rotV;
    const after=Math.floor(P.spin/Math.PI);
    if(after>before){
      const half=after;
      const nm=half%2===0?'salto':'demi';
      const v=bankTrick(nm,half<=1?100:120);
      ftext(P.x+18,P.y+34,P.z,(half/2).toFixed(half%2?1:0)+'×',TH.accent,20);
      addHeat(1.6);
      emit(P.x,P.y,P.z,rnd(-2,2),rnd(-1,2),rnd(-2,2),TH.accent,3,0.03,2,0.02);
    }
    P.rot=P.spin;
  }
}

/* ─────────────────────────────────────────────────────────────
   15. RECHERCHE D'ACCROCHE
   L'assistance élargit la fenêtre, elle ne décide jamais à la place
   du joueur : sans appui sur ACTION, rien ne s'accroche.
   ───────────────────────────────────────────────────────────── */
function nearestBar(){
  let best=null,bd=CFG.GRAB_R*CFG.GRAB_R*2.2;
  for(const b of bars){
    if(b.cool>0)continue;                 // barre qu'on vient de lâcher
    if(b.z<P.z-260)continue;
    if(b.z>P.z+520)break;                 // tableau trié par Z
    const dx=(P.x-b.x)*0.75,dy=P.y-b.y,dz=P.z-b.z;
    const d=dx*dx+dy*dy+dz*dz;
    if(d<bd){bd=d;best=b;}
  }
  return best?{bar:best,dist:Math.sqrt(bd)}:null;
}
function grabQuality(d){
  return d<=CFG.PERFECT?'perfect':d<=CFG.GOOD?'good':'late';
}
function catcherHands(c){
  // Le porteur pend par les jarrets et oscille dans le plan Y/Z.
  return{x:c.x,
    y:c.y-Math.cos(c.ang)*96,
    z:c.z+Math.sin(c.ang)*96};
}

/* ─────────────────────────────────────────────────────────────
   16. FILET, DÉGÂTS, PROGRESSION
   Tomber ne coûte pas de vie : cela coûte la cagnotte et la chaleur.
   Les vies ne se perdent que sur les dangers explicites.
   ───────────────────────────────────────────────────────────── */
function hitNet(){
  P.state='net';P.netT=26;
  P.vy=13.5;P.vz=Math.max(1.1,P.vz*0.26);P.vx*=0.3;
  P.y=CFG.NET_Y;P.spin=0;P.rotV=0;P.rot=0;
  dropBank();
  heat=Math.max(0,heat*0.45);heatTier=heat>=70?2:heat>=35?1:0;ovation=0;
  sfx('net');vibrate([24]);shake(6,14);
  ftext(P.x,CFG.NET_Y+70,P.z,t('net'),'rgba(255,255,255,0.7)',26);
  burst(P.x,CFG.NET_Y,P.z,TH.net,14,3.2,0);
  runDeaths++;netFalls++;
  // La difficulté s'assouplit discrètement après des chutes répétées.
  if(runDeaths>=3)dda=Math.min(1,dda+0.35);
}
function hurt(){
  if(P.inv>0)return;
  lives--;P.inv=110;
  dropBank();
  heat=Math.max(0,heat*0.3);heatTier=0;ovation=0;
  P.vy=9;P.vz=Math.max(1.5,P.vz*0.3);
  if(P.bar){P.bar.held=false;P.bar=null;}
  P.state='air';P.spin=0;P.rotV=0;
  doFlash(11,'#FF3020');shake(11,18);sfx('hurt');vibrate([60]);
  deaths++;runDeaths++;
  if(runDeaths>=2)dda=Math.min(1,dda+0.3);
  if(lives<=0){lives=0;gs='gameover';endTimer=0;musicStop();}
}
function levelComplete(){
  gs='levelend';endTimer=0;
  cashBank(1.5,P.x,P.y,P.z);
  endStars=1+(runDeaths===0?1:0)+(score>=(level+1)*2200?1:0);

  if(!SV.bestLevel[key]||SV.bestLevel[key]<score)SV.bestLevel[key]=score;
  if(!SV.bestStars[key]||SV.bestStars[key]<endStars)SV.bestStars[key]=endStars;
  SV.unlocked=Math.max(SV.unlocked,level+2);
  persist();
  sfx('cash');confetti(P.x,P.y+60,P.z,50);
  addHeat(30);shake(5,20);
  runDeaths=0;netFalls=0;dda=Math.max(0,dda-0.4);
}
