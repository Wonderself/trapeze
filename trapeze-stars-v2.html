/* ─────────────────────────────────────────────────────────────
   17. SIMULATION
   Un pas = 1/60 s. La boucle principale en exécute autant que
   nécessaire, ce qui rend le jeu identique en 60 et 120 Hz.
   ───────────────────────────────────────────────────────────── */
let _musicDucked=false;
function duckMusic(down){
  if(down===_musicDucked||!AU.ready||!AU.music)return;
  _musicDucked=down;
  try{AU.music.gain.setTargetAtTime(down?SV.music*0.32:SV.music,AU.ctx.currentTime,0.05);}
  catch(e){}
}
function step(){
  frame++;
  if(hitStop>0){hitStop--;duckMusic(true);updateParts();updateFText();return;}
  duckMusic(false);

  squashUpdate();
  updateParts();updateFText();

  if(P.inv>0)P.inv--;
  if(P.qualityT>0)P.qualityT--;
  if(P.jumpBuf>0)P.jumpBuf--;
  if(P.trickBuf>0)P.trickBuf--;
  if(flash>0)flash--;
  if(clapT>0)clapT--;
  if(olaT>0)olaT--;
  if(tutTimer>0)tutTimer--;
  P.af++;

  // La chaleur retombe seule : il faut la nourrir pour la garder.
  addHeat(-(0.055+heatTier*0.03));

  // Déplacement latéral, commun à tous les états
  const goL=KEY['arrowleft']||KEY['a']||KEY['q']||mLeft;
  const goR=KEY['arrowright']||KEY['d']||mRight;
  const acc=P.state==='run'?CFG.RUN_ACC:CFG.AIR_ACC;
  const vmax=P.state==='run'?CFG.RUN_MAX:CFG.AIR_MAX;
  if(goR){P.vx=Math.min(P.vx+acc,vmax);P.face=1;}
  else if(goL){P.vx=Math.max(P.vx-acc,-vmax);P.face=-1;}
  else P.vx*=P.state==='run'?CFG.FRICTION:0.93;

  /* ── SUSPENSION ─────────────────────────────────────────── */
  if(P.state==='swing'){
    updateSwing();
  }
  /* ── PORTEUR ────────────────────────────────────────────── */
  else if(P.state==='caught'){
    const c=P.catcher;
    if(c){const h=catcherHands(c);P.x=h.x;P.y=h.y-30;P.z=h.z;}
    if(P.catchT>0)P.catchT--;
    else{
      // Relance vers l'avant, plus rapide que ce que le joueur avait
      P.state='air';P.catcher=null;
      P.vz=Math.max(9.5,P.vz);P.vy=9.5;P.vx=0;
      sfx('jump');squash(1.25,0.78);
    }
  }
  /* ── FILET ──────────────────────────────────────────────── */
  else if(P.state==='net'){
    P.netT--;
    P.y+=P.vy;P.vy-=CFG.GRAV*0.8;P.z+=P.vz;P.x+=P.vx;
    if(P.netT<=0&&P.y>CFG.NET_Y+40){P.state='air';}
  }
  /* ── VOL ET COURSE ──────────────────────────────────────── */
  else {
    updateTricks();

    // Saut à hauteur variable
    if(!P.jumpHeld&&P.vy>3&&P.state==='air')P.vy*=0.62;

    P.vy-=CFG.GRAV;
    if(P.vy<-CFG.MAXFALL)P.vy=-CFG.MAXFALL;
    P.vz=clamp(P.vz*CFG.AIR_DRAG,-6,CFG.FWD_MAX);

    P.x+=P.vx;P.y+=P.vy;P.z+=P.vz;

    // Plateformes : réception par le dessus uniquement
    let landed=false;
    for(const pl of plats){
      if(pl.z>P.z+40)break;
      if(P.z<pl.z-30||P.z>pl.z+pl.len)continue;
      if(Math.abs(P.x-pl.x)>pl.w*0.5)continue;
      if(P.vy<=0&&P.y<=pl.y+14&&P.y>pl.y-46){
        P.y=pl.y;P.vy=0;
        if(P.state!=='run'){
          sfx('land');squash(1.3,0.72);
          const q=cashBank(1,P.x,P.y,P.z);
          if(q>0)addHeat(4);
          shake(2.5,6);
        }
        P.state='run';P.coyote=CFG.COYOTE;P.spin=0;P.rot=0;P.rotV=0;
        P.vz=Math.max(P.vz,CFG.FWD_BASE);
        landed=true;break;
      }
    }
    if(!landed&&P.state==='run'){P.state='air';}
    if(P.state==='run'){
      P.vz=lerp(P.vz,CFG.FWD_BASE+1.4,0.08);
      if(P.coyote>0)P.coyote--;
    } else if(P.coyote>0)P.coyote--;

    // Saut
    if(P.jumpBuf>0&&(P.state==='run'||P.coyote>0)){
      P.jumpBuf=0;P.coyote=0;
      P.vy=-CFG.JUMP;P.state='air';
      P.vz=Math.max(P.vz,CFG.FWD_BASE+1.6);
      sfx('jump');squash(0.8,1.26);vibrate([7]);
      burst(P.x,P.y,P.z,'rgba(255,255,255,0.5)',6,1.6,0);
      // En l'air, la consigne devient « saisissez la barre »
      if(tutStep===1){tutStep=2;tutTimer=200;}
    }
    // Saisie : barre, puis porteur
    else if(P.jumpBuf>0&&P.state==='air'){
      const found=nearestBar();
      if(found&&found.dist<CFG.GRAB_R*1.5){
        P.jumpBuf=0;
        grabBar(found.bar,grabQuality(found.dist));
      }
    }

    // Le filet rattrape toute chute
    if(P.y<CFG.NET_Y&&P.state==='air')hitNet();
  }

  /* ── PORTEURS : oscillation et fenêtre de réception ─────── */
  for(const c of catchers){
    if(c.z<P.z-400)continue;
    if(c.z>P.z+900)break;
    c.phase+=c.angV;
    c.ang=Math.sin(c.phase)*0.85;
    c.af++;
    // Bras tendus dans le tiers avant de l'arc, quand il vient
    // vers le joueur : c'est là que la réception est possible.
    c.ready=(c.ang>0.18&&Math.cos(c.phase)>0);
    if(c.used||P.state==='caught'||P.state==='swing')continue;
    if(!c.ready)continue;
    const h=catcherHands(c);
    const d=Math.hypot(P.x-h.x,(P.y-h.y)*0.9,P.z-h.z);
    if(d<74){
      c.used=true;
      P.state='caught';P.catcher=c;P.catchT=17;
      P.vx=0;P.vy=0;P.vz=0;P.spin=0;P.rotV=0;P.rot=0;
      hitStop=12;
      const got=cashBank(2,h.x,h.y,h.z);
      addScore(500,h.x,h.y+60,h.z,TH.reward,34);
      ftext(h.x,h.y+104,h.z,t('catcher'),TH.reward,38);
      addHeat(24);sfx('catcher');vibrate([30]);
      shake(10,22);doFlash(10,TH.reward);
      confetti(h.x,h.y+30,h.z,42);sparkRing(h.x,h.y,h.z,TH.reward,22);
    }
  }

  /* ── CERCEAUX ───────────────────────────────────────────── */
  for(const h of hoops){
    if(h.z<P.z-200)continue;
    if(h.z>P.z+700)break;
    h.rot+=h.spin;
    if(h.passed)continue;
    // Franchissement : on traverse le plan du cerceau dans son ouverture.
    if(P.z>=h.z&&P.z-P.vz<=h.z){
      const d=Math.hypot(P.x-h.x,P.y-h.y);
      if(d<h.r){
        h.passed=true;
        const perfect=d<h.r*0.36;
        const pts=(perfect?260:150);
        addScore(Math.round(pts*heatMult()),h.x,h.y,h.z,perfect?TH.reward:'#fff',perfect?30:22);
        if(perfect)ftext(h.x,h.y+40,h.z,t('perfect'),TH.reward,26);
        bankTrick('hoop',perfect?150:90);
        addHeat(perfect?7:4);
        sfx('hoop');vibrate([6]);
        sparkRing(h.x,h.y,h.z,h.fire?'#FF8A2B':TH.accent,16);
      }
    }
  }

  /* ── ÉTOILES ────────────────────────────────────────────── */
  for(const s of stars){
    if(s.z<P.z-160)continue;
    if(s.z>P.z+600)break;
    s.t+=0.07;
    if(s.taken)continue;
    if(Math.hypot(P.x-s.x,P.y-s.y,P.z-s.z)<44){
      s.taken=true;
      addScore(Math.round(50*heatMult()),s.x,s.y,s.z,TH.reward,18);
      addHeat(1.1);sfx('star');
      burst(s.x,s.y,s.z,TH.reward,7,2.2,2);
    }
  }

  /* ── DANGERS ────────────────────────────────────────────── */
  for(const hz of hazards){
    if(hz.z<P.z-200)continue;
    if(hz.z>P.z+800)break;
    hz.af++;
    hz.y=hz.base+Math.sin(hz.af*0.024)*54;
    if(P.inv>0||P.state==='caught')continue;
    if(Math.hypot(P.x-hz.x,P.y-hz.y,(P.z-hz.z)*1.2)<hz.r+22)hurt();
  }

  // Limites latérales : bordure souple plutôt que mur sec
  if(P.x<-CFG.LANE){P.x=-CFG.LANE;P.vx*=-0.25;}
  if(P.x>CFG.LANE){P.x=CFG.LANE;P.vx*=-0.25;}
  if(P.y<CFG.KILL_Y)hitNet();

  // Traînée
  if(frame%2===0){
    P.trail.push(P.x,P.y,P.z);
    while(P.trail.length>QUAL.trail*3)P.trail.splice(0,3);
  }

  // Barres : oscillation à vide et vibration après un lâcher
  for(const b of bars){
    if(b.z<P.z-300)continue;
    if(b.z>P.z+900)break;
    if(!b.held){
      b.ang+=b.angV;b.angV+=-0.0016*Math.sin(b.ang);
      b.angV*=0.97;b.ang*=0.985;   // revient au repos, la zone de saisie reste fiable
    }
    if(b.vib>0)b.vib*=0.9;
    if(b.cool>0)b.cool--;
  }

  // Arrivée
  if(P.z>=goalZ&&gs==='play')levelComplete();

  updateCamera();
}

/* ─────────────────────────────────────────────────────────────
   18. CAMÉRA
   Anticipation sur la vitesse, dézoom à haute vitesse, secousse
   par bruit continu plutôt que par tirage aléatoire par frame.
   ───────────────────────────────────────────────────────────── */
function updateCamera(){
  const speed=clamp(P.vz/CFG.FWD_MAX,0,1);
  const back=CFG.CAM_BACK+speed*66;
  const up=CFG.CAM_UP+(P.state==='swing'?34:0);

  CAM.tx=P.x*0.42;
  CAM.ty=P.y+up;
  CAM.tz=P.z-back;

  // Le suivi vertical est plus lâche que l'horizontal : cela évite
  // que la caméra ne « pompe » à chaque oscillation du trapèze.
  CAM.x=lerp(CAM.x,CAM.tx,CFG.CAM_LAG*1.3);
  CAM.y=lerp(CAM.y,CAM.ty,CFG.CAM_LAG*0.72);
  CAM.z=lerp(CAM.z,CAM.tz,CFG.CAM_LAG*1.5);

  // Dézoom progressif pour donner de l'air quand ça va vite
  const targetFov=(portrait?0.86:1)*(1-speed*0.12);
  CAM.fov=lerp(CAM.fov,targetFov,0.05);

  if(camShakeT>0){
    camShakeT--;
    const k=camShakeT/22,a=camShakeAmp*k*k;
    CAM.shake=a;
    CAM.x+=noise1(frame*0.7)*a;
    CAM.y+=noise1(frame*0.7+31.7)*a;
    CAM.roll=noise1(frame*0.5+7.1)*a*0.0018;
    if(camShakeT<=0){camShakeAmp=0;CAM.roll=0;}
  } else {CAM.shake=0;CAM.roll=0;}
}

/* ─────────────────────────────────────────────────────────────
   19. PERSONNAGE
   Un rig articulé plutôt qu'un dessin par état : les poses sont des
   jeux de valeurs, ce qui rend les transitions continues.
   Le personnage est dessiné dans un espace local de 100 unités de
   haut, puis mis à l'échelle par la profondeur.
   ───────────────────────────────────────────────────────────── */
const CHARS={
  marc:  {skin:'#F2C79A',skinD:'#C0865A',suit:'#2E7BE8',suitD:'#0C2E72',suitL:'#7EC0FF',
          hair:'#E8C040',hairD:'#9A6C10',trim:'#FFD24D',name:'Marc'},
  claire:{skin:'#F5CBA2',skinD:'#C88C60',suit:'#E8387A',suitD:'#7A0838',suitL:'#FF9CCB',
          hair:'#C89050',hairD:'#7A5020',trim:'#FFD700',name:'Claire'},
};

// Pose : angles en radians. Toutes les poses partagent la même structure,
// donc on peut interpoler de l'une à l'autre.
const _pose={sh:0,tors:0,armL:0,armLf:0,armR:0,armRf:0,legL:0,legLf:0,legR:0,legRf:0,head:0,tuck:0};
function poseFor(st,af,vy,tuckAmt){
  const q=_pose;
  if(st==='run'){
    const c=Math.sin(af*0.30);
    q.tors=0.06*c;q.head=-0.04*c;
    // Bras le long du corps, qui balancent en opposition des jambes
    q.armL=-0.55*c;q.armLf=-0.55;q.armR=0.55*c;q.armRf=-0.55;
    q.legL=0.75*c;q.legLf=Math.max(0,-c)*0.95;
    q.legR=-0.75*c;q.legRf=Math.max(0,c)*0.95;
    q.tuck=0;
  } else if(st==='swing'){
    // Suspendu : bras tendus vers le haut, corps qui pend, jambes groupées
    const sw=Math.sin(af*0.09);
    q.tors=0.03*sw;q.head=0.14;
    q.armL=2.94;q.armLf=-0.05;q.armR=2.94;q.armRf=0.05;
    q.legL=0.22+0.12*sw;q.legLf=0.30;
    q.legR=-0.06+0.12*sw;q.legRf=0.34;
    q.tuck=0;
  } else if(st==='caught'){
    q.tors=0;q.head=0.16;
    q.armL=2.82;q.armLf=-0.3;q.armR=2.82;q.armRf=0.3;
    q.legL=0.45;q.legLf=0.5;q.legR=0.28;q.legRf=0.5;q.tuck=0;
  } else if(st==='net'){
    // Étalé dans le filet, membres écartés
    q.tors=0.28;q.head=0.3;
    q.armL=-1.75;q.armLf=-0.6;q.armR=1.75;q.armRf=0.6;
    q.legL=0.95;q.legLf=0.9;q.legR=-0.75;q.legRf=0.85;q.tuck=0;
  } else { // en vol
    const tk=tuckAmt||0;
    q.tors=0.05;q.head=-0.08;
    // Bras écartés en vol libre, ramenés sur la poitrine en groupé
    q.armL=lerp(-1.55,-2.45,tk);q.armLf=lerp(-0.35,-1.55,tk);
    q.armR=lerp(1.55,2.45,tk);q.armRf=lerp(0.35,1.55,tk);
    const rise=clamp(-vy/12,-1,1);
    q.legL=lerp(0.34+rise*0.24,1.45,tk);q.legLf=lerp(0.14,1.75,tk);
    q.legR=lerp(-0.20+rise*0.24,1.25,tk);q.legRf=lerp(0.10,1.75,tk);
    q.tuck=tk;
  }
  return q;
}

// Segment tronconique : un membre lisible même minuscule à l'écran.
function limb(x,y,a1,l1,a2,l2,w1,w2,col,colD){
  const x1=x+Math.sin(a1)*l1, y1=y+Math.cos(a1)*l1;
  const x2=x1+Math.sin(a1+a2)*l2, y2=y1+Math.cos(a1+a2)*l2;
  CX.lineCap='round';CX.lineJoin='round';
  CX.strokeStyle=colD;CX.lineWidth=w1;
  CX.beginPath();CX.moveTo(x,y);CX.lineTo(x1,y1);CX.stroke();
  CX.strokeStyle=col;CX.lineWidth=w2;
  CX.beginPath();CX.moveTo(x1,y1);CX.lineTo(x2,y2);CX.stroke();
  return{x:x2,y:y2};
}

function drawArtist(px,py,scale,st,rot,face,charId,alpha,sqx,sqy){
  const C=CHARS[charId]||CHARS.marc;
  const s=scale;
  if(s<0.02)return;
  CX.save();
  CX.globalAlpha=alpha===undefined?1:alpha;
  CX.translate(px,py);
  CX.rotate(rot||0);
  CX.scale(face*s*(sqx||1),s*(sqy||1));

  const tuck=st==='air'?clamp(Math.abs(P.rotV)*3.2,0,1):0;
  const q=poseFor(st,P.af,P.vy,tuck);

  // Ombre de contact, seulement au sol et en qualité suffisante
  if(QUAL.shadows&&st==='run'){
    CX.save();CX.globalAlpha=(alpha===undefined?1:alpha)*0.3;
    CX.fillStyle='#000';CX.beginPath();
    CX.ellipse(0,4,20,5,0,0,6.283);CX.fill();CX.restore();
  }

  const hipY=-30, shY=-58;
  // Jambes. Dans limb(), l'angle 0 pointe vers le bas : une jambe au repos
  // est donc proche de 0, pas de PI.
  limb(-7,hipY,q.legL,20,q.legLf,18,9,7,C.suit,C.suitD);
  limb( 7,hipY,q.legR,20,q.legRf,18,9,7,C.suit,C.suitD);

  // Torse
  CX.save();CX.rotate(q.tors);
  const g=CX.createLinearGradient(-14,shY,14,hipY);
  g.addColorStop(0,C.suitL);g.addColorStop(0.45,C.suit);g.addColorStop(1,C.suitD);
  CX.fillStyle=g;
  CX.beginPath();
  CX.moveTo(-13,shY+4);CX.quadraticCurveTo(-15,hipY-12,-8,hipY);
  CX.lineTo(8,hipY);CX.quadraticCurveTo(15,hipY-12,13,shY+4);
  CX.quadraticCurveTo(0,shY-4,-13,shY+4);CX.closePath();CX.fill();
  // Ceinture-signature
  CX.fillStyle=C.trim;CX.fillRect(-11,hipY-8,22,4);
  // Reflet
  CX.globalAlpha=(alpha===undefined?1:alpha)*0.24;
  CX.fillStyle='#fff';CX.beginPath();
  CX.ellipse(-6,shY+18,4.5,12,-0.2,0,6.283);CX.fill();
  CX.globalAlpha=alpha===undefined?1:alpha;
  CX.restore();

  // Bras
  limb(-11,shY+4,q.armL,17,q.armLf,15,8,6,C.suit,C.suitD);
  limb( 11,shY+4,q.armR,17,q.armRf,15,8,6,C.suit,C.suitD);
  // Mains, au bout de la chaine bras + avant-bras
  CX.fillStyle=C.skin;
  const hxL=-11+Math.sin(q.armL)*17+Math.sin(q.armL+q.armLf)*15;
  const hyL=shY+4+Math.cos(q.armL)*17+Math.cos(q.armL+q.armLf)*15;
  const hxR= 11+Math.sin(q.armR)*17+Math.sin(q.armR+q.armRf)*15;
  const hyR=shY+4+Math.cos(q.armR)*17+Math.cos(q.armR+q.armRf)*15;
  CX.beginPath();CX.arc(hxL,hyL,4.2,0,6.283);CX.fill();
  CX.beginPath();CX.arc(hxR,hyR,4.2,0,6.283);CX.fill();

  // Tête
  CX.save();CX.translate(0,shY-2);CX.rotate(q.head);
  const hg=CX.createRadialGradient(-3,-6,1,0,-2,13);
  hg.addColorStop(0,'#FFF0D8');hg.addColorStop(0.45,C.skin);hg.addColorStop(1,C.skinD);
  CX.fillStyle=hg;CX.beginPath();CX.arc(0,-8,11.5,0,6.283);CX.fill();
  // Cheveux
  CX.fillStyle=C.hair;CX.beginPath();
  CX.arc(0,-10,11.5,Math.PI*1.02,Math.PI*2.02);CX.fill();
  if(charId==='claire'){
    CX.beginPath();CX.ellipse(-9,-2,5,9,0.4,0,6.283);CX.fill();
    CX.beginPath();CX.ellipse(9,-2,5,9,-0.4,0,6.283);CX.fill();
  }
  // Yeux : simples, lisibles à toute échelle
  CX.fillStyle='#20161C';
  CX.beginPath();CX.arc(-4,-8,1.7,0,6.283);CX.fill();
  CX.beginPath();CX.arc(4.2,-8,1.7,0,6.283);CX.fill();
  CX.restore();

  CX.restore();
}

/* ─────────────────────────────────────────────────────────────
   20. RENDU DU MONDE
   Liste d'affichage triée de l'arrière vers l'avant.
   ───────────────────────────────────────────────────────────── */
const DL=[];                       // liste d'affichage réutilisée
let dlN=0;
function push(z,fn,a){if(dlN<DL.length){const e=DL[dlN];e.z=z;e.fn=fn;e.a=a;}
  else DL.push({z,fn,a});dlN++;}
function flushDL(){
  DL.length=Math.max(DL.length,dlN);
  const list=DL.slice(0,dlN);
  list.sort((p,q)=>q.z-p.z);        // le plus loin d'abord
  for(let i=0;i<list.length;i++)list[i].fn(list[i].a);
  dlN=0;
}

const pr1={x:0,y:0,s:0,dz:0}, pr2={x:0,y:0,s:0,dz:0}, pr3={x:0,y:0,s:0,dz:0};

// Fondu de proximité : un objet déjà dépassé occupe tout l'écran sans rien
// apporter. On l'estompe entre 460 et 200 unités de la caméra.
const NEAR_FADE_FAR=460, NEAR_FADE_NEAR=200;
function nearFade(dz){
  if(dz>=NEAR_FADE_FAR)return 1;
  if(dz<=NEAR_FADE_NEAR)return 0;
  return (dz-NEAR_FADE_NEAR)/(NEAR_FADE_FAR-NEAR_FADE_NEAR);
}

function drawSky(){
  const g=CX.createLinearGradient(0,0,0,SH);
  g.addColorStop(0,TH.sky[0]);g.addColorStop(0.52,TH.sky[1]);g.addColorStop(1,TH.sky[2]);
  CX.fillStyle=g;CX.fillRect(0,0,SW,SH);

  // Halo de projecteur au sommet du chapiteau
  const hy=SH*horizonY;
  const rg=CX.createRadialGradient(SW*0.5,hy-SH*0.12,10,SW*0.5,hy,SW*0.62);
  rg.addColorStop(0,'rgba(255,240,200,0.20)');
  rg.addColorStop(0.4,'rgba(255,220,160,0.06)');
  rg.addColorStop(1,'rgba(0,0,0,0)');
  CX.fillStyle=rg;CX.fillRect(0,0,SW,SH);
}

// Gradins : un arc de spectateurs qui réagissent à la chaleur.
function drawCrowd(){
  const hy=SH*horizonY;
  const rows=QUAL.layers>=3?5:3;
  const cols=QUAL.layers>=3?34:20;
  const wave=olaT>0?(1-olaT/150):-1;
  for(let r=0;r<rows;r++){
    const depth=1400+r*230;
    const s=(CFG.FOCAL*CAM.fov)/(depth)*viewScale;
    const yBase=hy+(CAM.y-(120+r*74))*s;
    const halfW=SW*(0.62+r*0.09);
    for(let c=0;c<cols;c++){
      const u=(c+0.5)/cols;
      const x=SW*0.5+(u-0.5)*2*halfW;
      if(x<-30||x>SW+30)continue;
      // Excitation : applaudissements globaux, ola en vague locale
      let ex=0;
      if(clapT>0)ex=Math.abs(Math.sin(frame*0.32+c*0.7))*0.7;
      if(ovation)ex=Math.max(ex,Math.abs(Math.sin(frame*0.42+c*0.5))*1);
      if(wave>=0){const d=Math.abs(u-wave);if(d<0.10)ex=Math.max(ex,1-d/0.10);}
      const lift=ex*13*s;
      const rad=Math.max(1.2,7*s);
      CX.fillStyle=TH.crowd[(c*7+r*3)%TH.crowd.length];
      CX.globalAlpha=0.42+r*0.06+ex*0.35;
      CX.beginPath();CX.arc(x,yBase-lift,rad,0,6.283);CX.fill();
      if(ex>0.5&&QUAL.layers>=3){ // bras levés
        CX.globalAlpha=0.5;
        CX.strokeStyle=TH.crowd[(c*7+r*3)%TH.crowd.length];
        CX.lineWidth=Math.max(1,rad*0.35);
        CX.beginPath();
        CX.moveTo(x-rad,yBase-lift);CX.lineTo(x-rad*1.5,yBase-lift-rad*1.9);
        CX.moveTo(x+rad,yBase-lift);CX.lineTo(x+rad*1.5,yBase-lift-rad*1.9);
        CX.stroke();
      }
    }
  }
  CX.globalAlpha=1;
}

// Piste : un damier en perspective donne la lecture de vitesse.
function drawGround(){
  const step=180;
  const z0=Math.floor((CAM.z+CFG.NEAR)/step)*step;
  const hy=SH*horizonY;
  // Fond de piste : un degre sombre qui s'eclaircit vers le lointain,
  // pour que le sol se lise comme un sol et non comme un mur.
  const bgGrad=CX.createLinearGradient(0,hy,0,SH);
  bgGrad.addColorStop(0,TH.fog);
  bgGrad.addColorStop(1,TH.sky[2]);
  CX.fillStyle=bgGrad;
  CX.fillRect(0,hy,SW,SH-hy);
  for(let i=0;i<26;i++){
    const zA=z0+i*step, zB=zA+step;
    const dA=zA-CAM.z, dB=zB-CAM.z;
    if(dB<CFG.NEAR)continue;
    if(dA>CFG.FAR)break;
    const sA=(CFG.FOCAL*CAM.fov)/Math.max(CFG.NEAR,dA)*viewScale;
    const sB=(CFG.FOCAL*CAM.fov)/Math.max(CFG.NEAR,dB)*viewScale;
    const yA=hy+CAM.y*sA, yB=hy+CAM.y*sB;
    const wA=(CFG.LANE+230)*sA, wB=(CFG.LANE+230)*sB;
    const xA=SW*0.5-CAM.x*sA, xB=SW*0.5-CAM.x*sB;
    const band=(Math.floor(zA/step)%2===0);
    CX.fillStyle=band?TH.ring:TH.fog;
    CX.beginPath();
    CX.moveTo(xA-wA,yA);CX.lineTo(xA+wA,yA);
    CX.lineTo(xB+wB,yB);CX.lineTo(xB-wB,yB);
    CX.closePath();CX.fill();
    // Bordure de piste
    CX.strokeStyle=TH.ringTop;CX.lineWidth=Math.max(1,2.4*sB*10);
    CX.globalAlpha=0.5;
    CX.beginPath();CX.moveTo(xA-wA,yA);CX.lineTo(xB-wB,yB);
    CX.moveTo(xA+wA,yA);CX.lineTo(xB+wB,yB);CX.stroke();
    CX.globalAlpha=1;
  }
  // Brume de distance : masque la ligne d'horizon nette
  const fg=CX.createLinearGradient(0,hy-SH*0.03,0,hy+SH*0.16);
  fg.addColorStop(0,TH.fog);fg.addColorStop(1,'rgba(0,0,0,0)');
  CX.globalAlpha=0.85;CX.fillStyle=fg;
  CX.fillRect(0,hy-SH*0.03,SW,SH*0.2);CX.globalAlpha=1;
}

// Filet de sécurité : le maillage se lit en profondeur et rassure.
function drawNet(){
  const step=170;
  const z0=Math.floor((CAM.z+CFG.NEAR)/step)*step;
  CX.strokeStyle=TH.net;CX.globalAlpha=0.10;
  for(let i=0;i<14;i++){
    const z=z0+i*step;
    const a=project(-CFG.LANE-70,CFG.NET_Y,z,pr1);
    const b=project(CFG.LANE+70,CFG.NET_Y,z,pr2);
    if(!a||!b)continue;
    CX.lineWidth=Math.max(0.6,1.6*a.s);
    CX.beginPath();CX.moveTo(a.x,a.y);CX.lineTo(b.x,b.y);CX.stroke();
  }
  for(let k=-3;k<=3;k++){
    const x=k*(CFG.LANE+70)/3;
    const a=project(x,CFG.NET_Y,Math.max(CAM.z+CFG.NEAR+10,z0),pr1);
    const b=project(x,CFG.NET_Y,z0+13*step,pr2);
    if(!a||!b)continue;
    CX.lineWidth=Math.max(0.6,1.4*a.s);
    CX.beginPath();CX.moveTo(a.x,a.y);CX.lineTo(b.x,b.y);CX.stroke();
  }
  CX.globalAlpha=1;
}

// Arceaux du chapiteau : ils donnent l'échelle et la profondeur.
function drawProps(){
  for(const pp of props){
    const dz=pp.z-CAM.z;
    if(dz<CFG.NEAR||dz>CFG.FAR)continue;
    const top=project(0,CFG.RIG_Y+150,pp.z,pr1);
    if(!top)continue;
    const l=project(-CFG.LANE-190,0,pp.z,pr2);
    const r=project(CFG.LANE+190,0,pp.z,pr3);
    if(!l||!r)continue;
    const fade=clamp(1-dz/CFG.FAR,0,1);
    CX.globalAlpha=0.16+fade*0.34;
    CX.strokeStyle=TH.rig;CX.lineWidth=Math.max(1,3.4*top.s);
    CX.beginPath();
    CX.moveTo(l.x,l.y);
    CX.quadraticCurveTo(top.x,top.y-Math.abs(top.y)*0.12,r.x,r.y);
    CX.stroke();
    // Projecteur au sommet
    CX.globalAlpha=(0.25+fade*0.5)*(ovation?1:0.6);
    CX.fillStyle=TH.light;
    CX.beginPath();CX.arc(top.x,top.y,clamp(4*top.s,1.5,14*uiScale),0,6.283);CX.fill();
    CX.globalAlpha=1;
  }
}

// Position réelle de la barre : elle suit le voltigeur quand il est
// suspendu, et pend à son propre angle sinon.
function barPose(b,out){
  const a=b.held?P.ang:b.ang;
  out.y=b.anchorY-Math.cos(a)*CFG.ROPE;
  out.z=b.z+Math.sin(a)*CFG.ROPE;
  return out;
}
const _bp={y:0,z:0};
function drawBarObj(b){
  const anchor=project(b.x,b.anchorY,b.z,pr1);
  barPose(b,_bp);
  const bar=project(b.x,_bp.y,_bp.z,pr2);
  if(!anchor||!bar)return;
  // La barre que l'on tient reste opaque, celles qu'on a dépassées s'effacent.
  const fade=(P.bar===b)?1:nearFade(bar.dz);
  if(fade<=0)return;
  CX.save();CX.globalAlpha=fade;
  const near=nearBar===b;
  // Cordes. Une légère caténaire quand la barre n'est pas chargée.
  CX.strokeStyle=TH.rope;
  CX.lineWidth=Math.max(0.8,2.2*bar.s);
  const halfW=b.w*0.5*bar.s;
  const sag=b.held?0:2.5*bar.s;
  for(const side of [-1,1]){
    CX.beginPath();
    CX.moveTo(anchor.x+side*halfW*0.82,anchor.y);
    CX.quadraticCurveTo(
      anchor.x+side*halfW*0.92,(anchor.y+bar.y)/2+sag,
      bar.x+side*halfW,bar.y);
    CX.stroke();
  }
  // Halo de proximité : la barre visée est désignée sans être saisie seule.
  if(near){
    const q=grabQuality(nearDist);
    const col=q==='perfect'?TH.reward:q==='good'?TH.accent:'rgba(255,255,255,0.5)';
    const pulse=0.45+0.35*Math.sin(frame*0.28);
    CX.globalAlpha=pulse;
    CX.strokeStyle=col;CX.lineWidth=Math.max(1.5,4*bar.s);
    CX.beginPath();
    CX.ellipse(bar.x,bar.y,halfW*1.3,Math.max(5,11*bar.s),0,0,6.283);
    CX.stroke();
    // Repère de synchronisation : l'anneau se resserre à l'approche
    const t2=clamp(1-nearDist/(CFG.GRAB_R*1.5),0,1);
    CX.globalAlpha=pulse*0.8;
    CX.beginPath();
    CX.ellipse(bar.x,bar.y,halfW*(2.6-t2*1.3),Math.max(4,(20-t2*9)*bar.s),0,0,6.283);
    CX.stroke();
    CX.globalAlpha=1;
  }
  // Barre
  const vib=b.vib>0.02?Math.sin(frame*0.9)*b.vib*2.5*bar.s:0;
  const g=CX.createLinearGradient(bar.x-halfW,0,bar.x+halfW,0);
  g.addColorStop(0,TH.rig);g.addColorStop(0.5,TH.ringTop);g.addColorStop(1,TH.rig);
  CX.fillStyle=g;
  const th=Math.max(2,5*bar.s);
  CX.beginPath();CX.roundRect(bar.x-halfW,bar.y-th*0.5+vib,halfW*2,th,th*0.5);CX.fill();
  // Embouts
  CX.fillStyle=TH.accent;
  CX.beginPath();CX.arc(bar.x-halfW,bar.y+vib,th*0.75,0,6.283);CX.fill();
  CX.beginPath();CX.arc(bar.x+halfW,bar.y+vib,th*0.75,0,6.283);CX.fill();
  CX.restore();
}

function drawCatcherObj(c){
  const h=catcherHands(c);
  const anchor=project(c.x,c.y+96,c.z,pr1);
  const body=project(h.x,h.y,h.z,pr2);
  if(!anchor||!body)return;
  const s=body.s;
  // Barre fixe du porteur
  CX.strokeStyle=TH.rig;CX.lineWidth=Math.max(1.5,4*s);
  CX.beginPath();
  CX.moveTo(anchor.x-70*s,anchor.y);
  CX.lineTo(anchor.x+70*s,anchor.y);CX.stroke();
  // Corps suspendu par les jarrets
  CX.strokeStyle=TH.rope;CX.lineWidth=Math.max(1,2.4*s);
  CX.beginPath();CX.moveTo(anchor.x,anchor.y);CX.lineTo(body.x,body.y);CX.stroke();
  // Le porteur, tête en bas
  const sc=Math.max(0.02,s*0.62);
  drawArtist(body.x,body.y-85*sc,sc,'caught',Math.PI,1,'marc',1,1,1);
  // Fenêtre de réception : annoncée avant, jamais après
  if(c.ready&&!c.used){
    const pulse=0.5+0.45*Math.sin(frame*0.34);
    CX.globalAlpha=pulse;
    CX.strokeStyle=TH.reward;CX.lineWidth=Math.max(2,5*s);
    CX.beginPath();CX.arc(body.x,body.y,Math.max(10,52*s),0,6.283);CX.stroke();
    CX.globalAlpha=pulse*0.55;
    CX.fillStyle=TH.reward;
    CX.beginPath();CX.arc(body.x,body.y,Math.max(6,26*s),0,6.283);CX.fill();
    CX.globalAlpha=1;
  }
}

function drawHoopObj(h){
  const c=project(h.x,h.y,h.z,pr1);
  if(!c)return;
  const fade=nearFade(c.dz);
  if(fade<=0)return;
  const R=h.r*c.s;
  if(R<1.5)return;
  const lw=Math.max(1.5,7*c.s);
  CX.save();CX.globalAlpha=fade;
  if(h.passed){
    CX.globalAlpha=0.18*fade;CX.strokeStyle='#fff';CX.lineWidth=lw*0.5;
    CX.beginPath();CX.arc(c.x,c.y,R,0,6.283);CX.stroke();CX.restore();return;
  }
  const col=h.fire?'#FF8A2B':TH.accent2;
  // Halo
  CX.globalAlpha=0.22;CX.strokeStyle=col;CX.lineWidth=lw*2.6;
  CX.beginPath();CX.arc(c.x,c.y,R,0,6.283);CX.stroke();
  // Anneau
  CX.globalAlpha=1;CX.strokeStyle=col;CX.lineWidth=lw;
  CX.beginPath();CX.arc(c.x,c.y,R,0,6.283);CX.stroke();
  // Cœur, plus clair : indique la zone de passage parfait
  CX.globalAlpha=0.30;CX.fillStyle=col;
  CX.beginPath();CX.arc(c.x,c.y,R*0.36,0,6.283);CX.fill();
  CX.globalAlpha=1;
  // Flammes ou éclats tournants
  const n=h.fire?10:6;
  for(let i=0;i<n;i++){
    const a=h.rot+(i/n)*6.283;
    const rr=R*(1+0.10*Math.abs(Math.sin(frame*0.13+i)));
    CX.fillStyle=h.fire?(i%2?'#FFD24D':'#FF5E2B'):TH.accent;
    CX.globalAlpha=0.55+0.4*Math.abs(Math.sin(frame*0.1+i));
    CX.beginPath();CX.arc(c.x+Math.cos(a)*rr,c.y+Math.sin(a)*rr,Math.max(1,lw*0.55),0,6.283);CX.fill();
  }
  CX.restore();
}

function drawStarObj(st){
  const c=project(st.x,st.y+Math.sin(st.t)*7,st.z,pr1);
  if(!c)return;
  const R=Math.max(1.5,15*c.s);
  CX.globalAlpha=0.25;CX.fillStyle=TH.reward;
  CX.beginPath();CX.arc(c.x,c.y,R*1.7,0,6.283);CX.fill();
  CX.globalAlpha=0.85+0.15*Math.sin(st.t*2);
  CX.fillStyle=TH.reward;
  CX.beginPath();
  for(let i=0;i<10;i++){
    const a=i*0.6283-1.5708, r=(i%2?R*0.42:R);
    i?CX.lineTo(c.x+Math.cos(a)*r,c.y+Math.sin(a)*r)
     :CX.moveTo(c.x+Math.cos(a)*r,c.y+Math.sin(a)*r);
  }
  CX.closePath();CX.fill();CX.globalAlpha=1;
}

function drawPlatObj(pl){
  const zN=Math.max(pl.z,CAM.z+CFG.NEAR+1);
  const a=project(pl.x-pl.w*0.5,pl.y,zN,pr1);
  const b=project(pl.x+pl.w*0.5,pl.y,zN,pr2);
  const c=project(pl.x+pl.w*0.5,pl.y,pl.z+pl.len,pr3);
  if(!a||!b||!c)return;
  const d=project(pl.x-pl.w*0.5,pl.y,pl.z+pl.len,{x:0,y:0,s:0,dz:0});
  if(!d)return;
  // Plateau
  // Dessus mat, arête avant lumineuse : la plateforme se lit comme un
  // appui sans écraser la scène.
  const g=CX.createLinearGradient(0,c.y,0,a.y);
  g.addColorStop(0,TH.plat);g.addColorStop(1,TH.plat);
  CX.fillStyle=g;CX.globalAlpha=0.92;
  CX.beginPath();CX.moveTo(a.x,a.y);CX.lineTo(b.x,b.y);
  CX.lineTo(c.x,c.y);CX.lineTo(d.x,d.y);CX.closePath();CX.fill();
  CX.globalAlpha=1;
  // Arête avant, très lisible : c'est le repère de réception
  CX.strokeStyle=TH.platTop;CX.lineWidth=Math.max(1.5,3.4*a.s);
  CX.beginPath();CX.moveTo(a.x,a.y);CX.lineTo(b.x,b.y);CX.stroke();
  // Pieds
  const foot=project(pl.x,0,pl.z+pl.len*0.5,{x:0,y:0,s:0,dz:0});
  if(foot&&pl.y>8){
    CX.strokeStyle=TH.rig;CX.lineWidth=Math.max(1.5,6*a.s);
    CX.globalAlpha=0.7;
    CX.beginPath();CX.moveTo((a.x+b.x)/2,(a.y+b.y)/2);CX.lineTo(foot.x,foot.y);CX.stroke();
    CX.globalAlpha=1;
  }
}

function drawHazardObj(hz){
  const c=project(hz.x,hz.y,hz.z,pr1);
  if(!c)return;
  const fade=nearFade(c.dz);
  if(fade<=0)return;
  CX.save();CX.globalAlpha=fade;
  const R=Math.max(2,hz.r*c.s);
  const warn=0.4+0.4*Math.sin(frame*0.18);
  // Aura d'avertissement : un danger doit s'annoncer avant d'être là
  CX.globalAlpha=warn*0.3;CX.fillStyle=TH.danger;
  CX.beginPath();CX.arc(c.x,c.y,R*1.9,0,6.283);CX.fill();
  CX.globalAlpha=1;
  const g=CX.createRadialGradient(c.x-R*0.3,c.y-R*0.3,0,c.x,c.y,R);
  g.addColorStop(0,'#FF8A7A');g.addColorStop(0.6,TH.danger);g.addColorStop(1,'#6A0000');
  CX.fillStyle=g;CX.beginPath();CX.arc(c.x,c.y,R,0,6.283);CX.fill();
  // Pointes : la forme dit « danger » même sans la couleur (daltonisme)
  CX.fillStyle='#FFE0DC';
  for(let i=0;i<8;i++){
    const a=(i/8)*6.283+hz.af*0.012;
    CX.beginPath();
    CX.moveTo(c.x+Math.cos(a-0.2)*R*0.9,c.y+Math.sin(a-0.2)*R*0.9);
    CX.lineTo(c.x+Math.cos(a)*R*1.42,c.y+Math.sin(a)*R*1.42);
    CX.lineTo(c.x+Math.cos(a+0.2)*R*0.9,c.y+Math.sin(a+0.2)*R*0.9);
    CX.closePath();CX.fill();
  }
  CX.restore();
}

function drawPartObj(p){
  const c=project(p.x,p.y,p.z,pr1);
  if(!c)return;
  const R=Math.max(0.6,p.r*c.s);
  CX.globalAlpha=clamp(p.life,0,1);
  CX.fillStyle=p.col;
  if(p.kind===1){ // confetti : rectangle qui tourne
    CX.save();CX.translate(c.x,c.y);CX.rotate(p.rot);
    CX.fillRect(-R,-R*0.42,R*2,R*0.84);CX.restore();
  } else if(p.kind===2){ // éclat
    CX.beginPath();CX.moveTo(c.x,c.y-R*1.7);CX.lineTo(c.x+R*0.5,c.y);
    CX.lineTo(c.x,c.y+R*1.7);CX.lineTo(c.x-R*0.5,c.y);CX.closePath();CX.fill();
  } else {
    CX.beginPath();CX.arc(c.x,c.y,R,0,6.283);CX.fill();
  }
  CX.globalAlpha=1;
}

function drawFTextObj(f){
  const c=project(f.x,f.y,f.z,pr1);
  if(!c)return;
  const size=Math.max(9,f.size*c.s*1.1);
  CX.globalAlpha=clamp(f.life*1.5,0,1);
  CX.font='900 '+size.toFixed(0)+'px '+FONT;
  CX.textAlign='center';CX.textBaseline='middle';
  CX.lineWidth=Math.max(2,size*0.16);CX.strokeStyle='rgba(0,0,0,0.65)';
  CX.strokeText(f.txt,c.x,c.y);
  CX.fillStyle=f.col;CX.fillText(f.txt,c.x,c.y);
  CX.globalAlpha=1;
}

function drawPlayerObj(){
  const c=project(P.x,P.y,P.z,pr1);
  if(!c)return;
  // Traînée : longueur et opacité suivent la vitesse
  if(P.trail.length>=6){
    CX.lineCap='round';
    for(let i=0;i<P.trail.length-3;i+=3){
      const a=project(P.trail[i],P.trail[i+1],P.trail[i+2],pr2);
      const b=project(P.trail[i+3],P.trail[i+4],P.trail[i+5],pr3);
      if(!a||!b)continue;
      const k=i/P.trail.length;
      CX.globalAlpha=k*0.4*(ovation?1:0.6);
      CX.strokeStyle=ovation
        ?'hsl('+((frame*4+i*14)%360)+',90%,65%)'
        :TH.accent;
      CX.lineWidth=Math.max(1,7*b.s*k);
      CX.beginPath();CX.moveTo(a.x,a.y);CX.lineTo(b.x,b.y);CX.stroke();
    }
    CX.globalAlpha=1;
  }
  // Ombre portée sur la piste, si le joueur est au-dessus
  if(QUAL.shadows&&P.y>CFG.NET_Y+20){
    const sh=project(P.x,CFG.NET_Y+2,P.z,pr2);
    if(sh){
      const k=clamp(1-(P.y-CFG.NET_Y)/380,0.08,0.5);
      CX.globalAlpha=k*0.5;CX.fillStyle='#000';
      CX.beginPath();
      CX.ellipse(sh.x,sh.y,Math.max(2,26*sh.s),Math.max(1,8*sh.s),0,0,6.283);
      CX.fill();CX.globalAlpha=1;
    }
  }
  // Clignotement d'invincibilité, sans jamais disparaître complètement
  const alpha=P.inv>0?(0.35+0.65*Math.abs(Math.sin(frame*0.4))):1;
  const scale=c.s*0.62;
  // P.y est la position des mains quand on est suspendu : on décale le
  // corps vers le bas pour que les mains coïncident avec la barre.
  const hang=(P.state==='swing'||P.state==='caught')?85*scale:0;
  drawArtist(c.x,c.y+hang,scale,P.state,P.rot,P.face,P.char,alpha,P.sx,P.sy);

  // Aura d'ovation
  if(ovation){
    CX.globalAlpha=0.3+0.2*Math.sin(frame*0.25);
    CX.strokeStyle='hsl('+((frame*5)%360)+',95%,68%)';
    CX.lineWidth=Math.max(1.5,4*c.s);
    CX.beginPath();CX.arc(c.x,c.y-28*scale,Math.max(8,46*scale),0,6.283);CX.stroke();
    CX.globalAlpha=1;
  }
}

// Barre visée, recalculée une fois par frame pour le rendu et le HUD.
let nearBar=null, nearDist=999;
function computeNear(){
  nearBar=null;nearDist=999;
  if(P.state!=='air')return;
  const f=nearestBar();
  if(f){nearBar=f.bar;nearDist=f.dist;}
}

// Simule le lâcher immédiat, avec la même physique que releaseBar() et
// la phase aérienne de step(), pour rester honnête sur ce qui va se
// produire réellement si le joueur lâche maintenant.
const _trajPts=[];
function drawTrajectoryPreview(){
  if(P.state!=='swing'||!P.bar||!SV.guide)return;
  const v=P.angV*CFG.ROPE;
  let vz=v*Math.cos(P.ang), vy=v*Math.sin(P.ang);
  if(vy<0&&P.ang<0)vy*=0.5;
  vz*=1+0.055*Math.min(P.pumped,5);
  vz=clamp(vz,-6,CFG.FWD_MAX);
  let x=P.x,y=P.y,z=P.z;
  _trajPts.length=0;
  for(let i=0;i<26;i++){
    vy-=CFG.GRAV;if(vy<-CFG.MAXFALL)vy=-CFG.MAXFALL;
    vz=clamp(vz*CFG.AIR_DRAG,-6,CFG.FWD_MAX);
    x+=P.vx*0.3;y+=vy;z+=vz;
    if(i%2===0)_trajPts.push(x,y,z);
    if(y<CFG.NET_Y)break;
  }
  CX.save();
  for(let i=0;i<_trajPts.length;i+=3){
    const p=project(_trajPts[i],_trajPts[i+1],_trajPts[i+2],pr1);
    if(!p)continue;
    const k=1-(i/_trajPts.length);
    CX.globalAlpha=0.55*k;
    CX.fillStyle=TH.accent;
    CX.beginPath();CX.arc(p.x,p.y,Math.max(1,4*p.s),0,6.283);CX.fill();
  }
  CX.restore();
}

function renderWorld(){
  drawSky();
  drawCrowd();
  drawGround();
  drawProps();
  drawNet();

  computeNear();
  dlN=0;
  const zMin=CAM.z+CFG.NEAR, zMax=CAM.z+CFG.FAR;
  for(const pl of plats)  if(pl.z+pl.len>zMin&&pl.z<zMax)push(pl.z+pl.len*0.5,drawPlatObj,pl);
  for(const b of bars)    if(b.z>zMin&&b.z<zMax)push(b.z,drawBarObj,b);
  for(const c of catchers)if(c.z>zMin&&c.z<zMax)push(c.z,drawCatcherObj,c);
  for(const h of hoops)   if(h.z>zMin&&h.z<zMax)push(h.z,drawHoopObj,h);
  for(const s of stars)   if(!s.taken&&s.z>zMin&&s.z<zMax)push(s.z,drawStarObj,s);
  for(const hz of hazards)if(hz.z>zMin&&hz.z<zMax)push(hz.z,drawHazardObj,hz);
  for(let i=0;i<PMAX;i++){const p=PP[i];if(p.live&&p.z>zMin&&p.z<zMax)push(p.z,drawPartObj,p);}
  push(P.z,drawPlayerObj,null);
  for(let i=0;i<FTMAX;i++){const f=FT[i];if(f.live&&f.z>zMin&&f.z<zMax)push(f.z-1,drawFTextObj,f);}
  flushDL();
  drawTrajectoryPreview();
}

/* ─────────────────────────────────────────────────────────────
   21. HUD
   Tout tient dans la zone sûre : encoches et coins arrondis compris.
   ───────────────────────────────────────────────────────────── */
// Le contexte canvas ne connait pas la police du document : il faut une
// famille reelle. On evite les noms a espaces, qui exigeraient des
// apostrophes au milieu d'une chaine JS.
const FONT='Avenir,Verdana,sans-serif';
function uiFont(size,weight){CX.font=(weight||700)+' '+Math.round(size*uiScale)+'px '+FONT;}
function safeTop(){return 14*uiScale+(portrait?18:6);}
// Les boutons système occupent une bande de 36 px CSS en haut, à gauche et
// à droite. Le HUD dessiné doit démarrer sous cette bande.
function sysBar(){return 52*DPR;}
function panel(x,y,w,h,r,alpha){
  CX.fillStyle='rgba(6,2,18,'+(alpha===undefined?0.46:alpha)+')';
  CX.beginPath();CX.roundRect(x,y,w,h,r||10*uiScale);CX.fill();
}
function outlineText(txt,x,y,size,col,weight,align){
  uiFont(size,weight);
  CX.textAlign=align||'center';CX.textBaseline='middle';
  CX.lineWidth=Math.max(2,size*uiScale*0.17);
  CX.strokeStyle='rgba(0,0,0,0.7)';CX.strokeText(txt,x,y);
  CX.fillStyle=col;CX.fillText(txt,x,y);
}

function drawHUD(){
  const top=safeTop();
  const pad=16*uiScale;
  // Seconde rangée, sous les boutons système
  const row2=top+sysBar();

  // ── Vies ──
  for(let i=0;i<3;i++){
    const x=pad+i*22*uiScale, y=row2;
    const on=i<lives;
    CX.globalAlpha=on?1:0.22;
    CX.fillStyle=on?'#FF3F63':'#FFFFFF';
    const r=7*uiScale;
    CX.beginPath();
    CX.moveTo(x,y+r*0.6);
    CX.bezierCurveTo(x-r*1.4,y-r*0.5,x-r*0.35,y-r*1.5,x,y-r*0.45);
    CX.bezierCurveTo(x+r*0.35,y-r*1.5,x+r*1.4,y-r*0.5,x,y+r*0.6);
    CX.fill();
    CX.globalAlpha=1;
  }

  // ── Score et cagnotte ──
  const cx=SW*0.5;
  outlineText(String(score),cx,top+18*uiScale,30,'#FFF',900);
  if(bank>0){
    const pulse=0.75+0.25*Math.sin(frame*0.24);
    CX.globalAlpha=pulse;
    outlineText('+'+Math.round(bank)+' × '+heatMult().toFixed(1),
      cx,top+44*uiScale,17,TH.reward,800);
    CX.globalAlpha=1;
    if(bankTricks>0)
      outlineText(bankTricks+' '+t('tricks').toLowerCase(),cx,top+62*uiScale,11,'rgba(255,255,255,0.55)',600);
  }

  // ── Jauge de chaleur du public ──
  const gw=Math.min(SW*0.34,190*uiScale), gh=9*uiScale;
  const gx=SW-gw-pad, gy=row2-gh*0.5;
  panel(gx-4,gy-4,gw+8,gh+8,gh,0.4);
  const hg=CX.createLinearGradient(gx,0,gx+gw,0);
  hg.addColorStop(0,TH.accent);hg.addColorStop(0.6,TH.accent2);hg.addColorStop(1,TH.reward);
  CX.fillStyle=hg;
  CX.beginPath();CX.roundRect(gx,gy,Math.max(2,gw*(heat/100)),gh,gh*0.5);CX.fill();
  // Marques des paliers
  CX.strokeStyle='rgba(255,255,255,0.4)';CX.lineWidth=Math.max(1,1.5*uiScale);
  for(let i=1;i<3;i++){
    const mx=gx+gw*(HEAT_TIERS[i]/100);
    CX.beginPath();CX.moveTo(mx,gy);CX.lineTo(mx,gy+gh);CX.stroke();
  }
  outlineText(heatTier>0?('×'+heatMult().toFixed(1)):t('heat'),
    gx+gw*0.5,gy+gh+11*uiScale,11,heatTier>0?TH.reward:'rgba(255,255,255,0.6)',800);

  // ── Progression du niveau ──
  const prog=clamp((P.z+120)/(goalZ+120),0,1);
  const pw=Math.min(SW*0.5,260*uiScale), px=cx-pw*0.5;
  const pyy=row2+26*uiScale;
  panel(px-3,pyy-3,pw+6,7*uiScale+6,6*uiScale,0.38);
  CX.fillStyle=TH.accent;
  CX.beginPath();CX.roundRect(px,pyy,Math.max(3,pw*prog),7*uiScale,3.5*uiScale);CX.fill();
  CX.fillStyle='#FFF';
  CX.beginPath();CX.arc(px+pw*prog,pyy+3.5*uiScale,4*uiScale,0,6.283);CX.fill();
  outlineText(t('level')+' '+(level+1)+' · '+t('world')[world],
    cx,pyy+20*uiScale,12,'rgba(255,255,255,0.72)',700);

  // ── Qualité de la dernière prise ──
  if(P.qualityT>0&&P.landQuality){
    const a=clamp(P.qualityT/24,0,1);
    CX.globalAlpha=a;
    const lbl=P.landQuality==='perfect'?t('perfect'):P.landQuality==='good'?t('good'):'';
    if(lbl)outlineText(lbl,cx,SH*0.30,26,P.landQuality==='perfect'?TH.reward:TH.accent,900);
    CX.globalAlpha=1;
  }

  // ── Compteur de pompage : rend le rythme lisible ──
  if(P.state==='swing'){
    const inWin=Math.abs(P.ang)<CFG.PUMP_WIN;
    const y=SH*(portrait?0.60:0.66);
    CX.globalAlpha=inWin?0.95:0.35;
    outlineText(inWin?'▼ '+t('pump')+' ▼':t('pump'),cx,y,inWin?21:15,
      inWin?TH.reward:'rgba(255,255,255,0.6)',900);
    CX.globalAlpha=1;
    if(P.pumped>0)outlineText('×'+P.pumped,cx,y+22*uiScale,14,TH.accent,800);
  }

  // ── Tutoriel : un panneau par geste, il disparaît une fois réussi ──
  if(tutStep>0&&tutTimer>0){
    const msgs=['',t('tutJump'),t('tutGrab'),t('tutPump'),t('tutTrick')];
    const m=msgs[tutStep];
    if(m){
      const a=clamp(tutTimer/50,0,1);
      CX.globalAlpha=a;
      uiFont(15,700);
      const w=CX.measureText(m).width+34*uiScale;
      panel(cx-w*0.5,SH*0.80,w,32*uiScale,10*uiScale,0.6);
      outlineText(m,cx,SH*0.80+16*uiScale,15,'#E8F0FF',700);
      CX.globalAlpha=1;
    }
  }
}

let menuT=0;
function drawMenuBackdrop(){
  menuT++;
  const g=CX.createLinearGradient(0,0,0,SH);
  g.addColorStop(0,'#1B0640');g.addColorStop(0.55,'#0C0224');g.addColorStop(1,'#04010E');
  CX.fillStyle=g;CX.fillRect(0,0,SW,SH);

  // Projecteurs balayants
  for(let i=0;i<3;i++){
    const a=Math.sin(menuT*0.006+i*2.1)*0.55;
    const x=SW*0.5+Math.sin(menuT*0.008+i*2)*SW*0.3;
    const lg=CX.createLinearGradient(x,0,x+Math.sin(a)*SW*0.4,SH);
    lg.addColorStop(0,'rgba(255,220,150,0.14)');
    lg.addColorStop(1,'rgba(255,180,80,0)');
    CX.fillStyle=lg;
    CX.beginPath();CX.moveTo(x,-20);
    CX.lineTo(x-SW*0.13+Math.sin(a)*SW*0.4,SH);
    CX.lineTo(x+SW*0.13+Math.sin(a)*SW*0.4,SH);
    CX.closePath();CX.fill();
  }
  // Étoiles de fond
  for(let i=0;i<44;i++){
    const x=((i*97)%100)/100*SW, y=((i*61)%100)/100*SH*0.62;
    CX.globalAlpha=0.18+0.3*Math.abs(Math.sin(menuT*0.02+i));
    CX.fillStyle='#FFE9A8';
    CX.beginPath();CX.arc(x,y,1.6*uiScale,0,6.283);CX.fill();
  }
  CX.globalAlpha=1;
}

function drawMenu(){
  hitZones.length=0;
  drawMenuBackdrop();
  const cx=SW*0.5;
  const titleY=SH*(portrait?0.16:0.18);
  CX.save();

  outlineText('D E L U X E',cx,titleY+(portrait?76:92)*uiScale,13,'rgba(255,255,255,0.55)',700);

  outlineText(t('chooseChar'),cx,SH*(portrait?0.42:0.44),14,'rgba(255,255,255,0.7)',700);
  const ids=['marc','claire'];

    const zw=90*uiScale;

      menuSel=idx;P.char=ids[idx];SV.char=P.char;persist();

  }

  // Appel à l'action
  const pulse=0.7+0.3*Math.sin(menuT*0.08);

  CX.beginPath();CX.roundRect(cx-bw/2,by-bh/2,bw,bh,bh*0.5);CX.fill();
  CX.globalAlpha=1;

    outlineText('🏆 '+t('best')+' : '+bestRun,cx,SH-24*uiScale,14,TH.reward,800);
}

function overlay(alpha){
  CX.fillStyle='rgba(4,1,14,'+alpha+')';CX.fillRect(0,0,SW,SH);
}

/* ── Zones tactiles des écrans de menu ──
   Repeuplées à chaque image par l'écran actif ; le pointeur les
   consulte plutôt que deviner des coordonnées à l'aveugle. */
let hitZones=[];
function zone(x,y,w,h,fn){hitZones.push({x,y,w,h,fn});}
function hitTest(px,py){
  for(let i=hitZones.length-1;i>=0;i--){
    const z=hitZones[i];
    if(px>=z.x&&px<=z.x+z.w&&py>=z.y&&py<=z.y+z.h)return z.fn;
  }
  return null;
}

function drawPauseScreen(){

  for(let i=0;i<12;i++){
    const col=i%cols, row=Math.floor(i/cols);

    const w=Math.floor(i/3), locked=(i+1)>SV.unlocked;

    if(sel&&!locked){
      CX.strokeStyle=th.accent;CX.lineWidth=Math.max(1.5,2.4*uiScale);
      CX.beginPath();CX.roundRect(x-cw/2,y-ch/2,cw,ch,12*uiScale);CX.stroke();
    }
    if(locked){
      outlineText('🔒',x,y-ch*0.08,20,'rgba(255,255,255,0.35)',700);
    } else {
      outlineText(String(i+1),x,y-ch*0.24,20,locked?'rgba(255,255,255,0.3)':th.accent,900);
      const key='L'+i, stars=SV.bestStars[key]||0;
      const starY=y+ch*0.10;
      for(let si=0;si<3;si++){

      }
      const best=SV.bestLevel[key];
      if(best)outlineText(String(best),x,y+ch*0.32,10,'rgba(255,255,255,0.5)',600);
    }
    if(!locked)zone(x-cw/2,y-ch/2,cw,ch,(idx=>()=>{levelSelIdx=idx;startAtLevel(idx);})(i));
  }

  outlineText(t('world').join('  ·  '),cx,gy+gridH+22*uiScale,11,'rgba(255,255,255,0.4)',600);

  zone(cx-bw/2,by-bh/2,bw,bh,closeLevelSelect);
}

function drawLevelEnd(){
  endTimer++;
  overlay(0.62);
  const cx=SW*0.5;
  outlineText(t('levelDone'),cx,SH*0.24,34,TH.reward,900);
  // Étoiles, révélées une par une
  for(let i=0;i<3;i++){
    const shown=endTimer>34+i*26;
    const x=cx+(i-1)*54*uiScale, y=SH*0.40;
    const got=i<endStars&&shown;
    const pop=shown?clamp((endTimer-(34+i*26))/12,0,1):0;
    const R=24*uiScale*(0.6+pop*0.4);
    CX.globalAlpha=got?1:0.22;
    CX.fillStyle=got?TH.reward:'#FFF';
    CX.beginPath();
    for(let k=0;k<10;k++){
      const a=k*0.6283-1.5708, r=(k%2?R*0.42:R);
      k?CX.lineTo(x+Math.cos(a)*r,y+Math.sin(a)*r):CX.moveTo(x+Math.cos(a)*r,y+Math.sin(a)*r);
    }
    CX.closePath();CX.fill();CX.globalAlpha=1;
    if(got&&pop===1&&endTimer===34+i*26+12){sfx('hoop');confetti(P.x,P.y+60,P.z,10);}
  }
  outlineText(t('score')+' : '+score,cx,SH*0.56,22,'#FFF',800);
  const crit=['Terminer le niveau','Aucune chute','Score élevé'];
  for(let i=0;i<3;i++){
    CX.globalAlpha=i<endStars?0.9:0.4;
    outlineText((i<endStars?'✓ ':'· ')+crit[i],cx,SH*0.63+i*17*uiScale,12,
      i<endStars?TH.accent:'rgba(255,255,255,0.5)',600);
    CX.globalAlpha=1;
  }
  if(endTimer>110){
    const pulse=0.6+0.4*Math.sin(frame*0.09);
    CX.globalAlpha=pulse;
    outlineText(isTouch?t('tapCont'):t('pressCont'),cx,SH*0.84,17,TH.reward,800);
    CX.globalAlpha=1;
  }
}

  const sh=endTimer<24?(Math.random()-0.5)*6*uiScale:0;
  outlineText(t('gameover'),cx+sh,SH*0.34,38,'#FF4444',900);
  outlineText(t('score')+' : '+score,cx,SH*0.48,24,'#FFF',800);
  outlineText(t('level')+' '+(level+1)+' · '+t('world')[world],cx,SH*0.55,14,'rgba(255,255,255,0.6)',700);
  if(score>=bestRun&&score>0)
    outlineText('🏆 '+t('newBest'),cx,SH*0.62,17,TH.reward,800);
  else
    outlineText(t('best')+' : '+bestRun,cx,SH*0.62,14,'rgba(255,255,255,0.5)',700);
  if(endTimer>60){
    const pulse=0.6+0.4*Math.sin(frame*0.09);
    CX.globalAlpha=pulse;
    outlineText(isTouch?t('tapCont'):t('pressCont'),cx,SH*0.78,17,TH.accent,800);
    CX.globalAlpha=1;
  }
}

function drawFinale(){
  endTimer++;
  const g=CX.createLinearGradient(0,0,0,SH);
  g.addColorStop(0,'#1B0640');g.addColorStop(1,'#04010E');
  CX.fillStyle=g;CX.fillRect(0,0,SW,SH);
  // Feux d'artifice
  if(endTimer%16===0){
    const fx=rnd(SW*0.15,SW*0.85), fy=rnd(SH*0.12,SH*0.5);
    const col=pick(['#FFD24D','#FF5E8A','#4DC4FF','#7DE0A8','#C84DFF']);
    for(let i=0;i<26;i++){
      const a=(i/26)*6.283, sp=rnd(2,6);
      emit(fx,fy,0,Math.cos(a)*sp,Math.sin(a)*sp,0,col,3,0.014,2,0.06);
    }
    sfx('hoop');
  }
  // Les particules du final sont en coordonnées écran, pas monde.
  for(let i=0;i<PMAX;i++){
    const p=PP[i];if(!p.live)continue;
    p.x+=p.vx;p.y+=p.vy;p.vy+=p.grav*4;p.life-=p.dec;
    if(p.life<=0){p.live=false;pCount--;continue;}
    CX.globalAlpha=clamp(p.life,0,1);CX.fillStyle=p.col;
    CX.beginPath();CX.arc(p.x,p.y,p.r*uiScale,0,6.283);CX.fill();
  }
  CX.globalAlpha=1;
  const cx=SW*0.5;
  outlineText('BRAVO !',cx,SH*0.30,46,TH.reward,900);
  outlineText('12 niveaux · '+score+' points',cx,SH*0.44,22,'#FFF',800);
  outlineText(t('best')+' : '+bestRun,cx,SH*0.51,15,'rgba(255,255,255,0.6)',700);
  drawArtist(cx,SH*0.70,uiScale*1.1,'run',0,1,P.char,1,1,1);
  if(endTimer>90){
    const pulse=0.6+0.4*Math.sin(frame*0.09);
    CX.globalAlpha=pulse;
    outlineText(isTouch?t('tapCont'):t('pressCont'),cx,SH*0.86,16,TH.accent,800);
    CX.globalAlpha=1;
  }
}

/* ─────────────────────────────────────────────────────────────
   23. POST-TRAITEMENT
   Bloom seuillé sur un buffer quart de résolution : quatre fois
   moins coûteux qu'un flou plein écran, et désactivable.
   ───────────────────────────────────────────────────────────── */
let bloomCV=null,bloomCX=null,grainCV=null,grainCX=null,grainPat=null;
function initFX(){
  bloomCV=document.createElement('canvas');bloomCX=bloomCV.getContext('2d');
  grainCV=document.createElement('canvas');grainCV.width=96;grainCV.height=96;
  grainCX=grainCV.getContext('2d');
  makeGrain();
}
function makeGrain(){
  if(!grainCX)return;
  const id=grainCX.createImageData(96,96),d=id.data;
  for(let i=0;i<d.length;i+=4){
    const n=(Math.random()*30)|0;
    d[i]=d[i+1]=d[i+2]=n;d[i+3]=20;
  }
  grainCX.putImageData(id,0,0);
  try{grainPat=CX.createPattern(grainCV,'repeat');}catch(e){grainPat=null;}
}
function postFX(){
  if(QUAL.bloom){
    const bw=Math.max(2,Math.round(SW/4)), bh=Math.max(2,Math.round(SH/4));
    if(bloomCV.width!==bw||bloomCV.height!==bh){bloomCV.width=bw;bloomCV.height=bh;}
    bloomCX.clearRect(0,0,bw,bh);
    bloomCX.drawImage(CV,0,0,bw,bh);
    // Seuillage : seules les zones lumineuses saignent.
    bloomCX.globalCompositeOperation='multiply';
    bloomCX.fillStyle='#8a8a8a';bloomCX.fillRect(0,0,bw,bh);
    bloomCX.globalCompositeOperation='source-over';
    CX.save();
    CX.globalCompositeOperation='lighter';
    CX.globalAlpha=0.34;
    CX.filter='blur('+Math.round(4*DPR)+'px)';
    CX.drawImage(bloomCV,0,0,SW,SH);
    CX.filter='none';
    CX.restore();
  }
  // Vignette : se resserre quand il ne reste qu'une vie
  const tight=lives<=1?0.42:0.62;
  const vg=CX.createRadialGradient(SW/2,SH/2,SH*tight*0.5,SW/2,SH/2,SW*0.78);
  vg.addColorStop(0,'rgba(0,0,0,0)');
  vg.addColorStop(1,lives<=1?'rgba(90,0,10,0.5)':'rgba(0,0,0,0.45)');
  CX.fillStyle=vg;CX.fillRect(0,0,SW,SH);

  if(QUAL.grain&&grainPat&&!reducedMotion){
    if(frame%4===0)makeGrain();
    CX.save();CX.globalCompositeOperation='soft-light';CX.globalAlpha=0.45;
    CX.fillStyle=grainPat;CX.fillRect(0,0,SW,SH);CX.restore();
  }
  if(flash>0){
    CX.save();CX.globalAlpha=Math.min(0.5,flash/18);
    CX.fillStyle=flashCol;CX.fillRect(0,0,SW,SH);CX.restore();
  }
}

/* ─────────────────────────────────────────────────────────────
   24. BOUCLE PRINCIPALE
   Pas de temps fixe : le jeu est identique en 60 Hz et en 120 Hz.
   ───────────────────────────────────────────────────────────── */
const STEP=1000/60;
let acc=0, lastT=0;
function frameLoop(now){
  requestAnimationFrame(frameLoop);
  if(!lastT)lastT=now;
  let dt=now-lastT;lastT=now;
  if(dt>250)dt=STEP;             // onglet réveillé : on ne rattrape pas 10 s
  watchPerf(dt);
  // Ralentissement global optionnel : moins de pas simulés par seconde
  // réelle, pour les joueurs qui ont besoin de plus de temps.
  acc+=dt*(SV.speed||1);
  let steps=0;
  while(acc>=STEP&&steps<5){acc-=STEP;steps++;
    if(gs==='play')step();
    else{frame++;updateParts();updateFText();if(flash>0)flash--;}
  }
  if(acc>STEP*5)acc=0;

  render();
}

function render(){
  CX.save();
  CX.setTransform(1,0,0,1,0,0);
  if(CAM.roll){CX.translate(SW/2,SH/2);CX.rotate(CAM.roll);CX.translate(-SW/2,-SH/2);}

  if(gs==='menu'){drawMenu();}
  else if(gs==='finale'){drawFinale();}
  else if(gs==='gameover'){drawGameOver();}
  else if(gs==='settings'){
    if(settingsFrom==='pause'){renderWorld();drawHUD();}
    drawSettingsScreen();
  }
  else if(gs==='levelselect'){drawLevelSelectScreen();}
  else{
    renderWorld();
    drawHUD();
    if(gs==='pause')drawPauseScreen();
    if(gs==='levelend')drawLevelEnd();
  }
  CX.restore();
  postFX();
  syncUI();
}

/* ─────────────────────────────────────────────────────────────
   25. SYNCHRONISATION DE L'INTERFACE DOM
   Les libellés des boutons suivent le contexte : le joueur apprend
   les commandes en jouant, sans écran d'aide.
   ───────────────────────────────────────────────────────────── */
const btnBack=document.getElementById('btnBack');
const btnPause=document.getElementById('btnPause');
const btnFull=document.getElementById('btnFull');
const padEl=document.getElementById('pad');
const lblAct=document.getElementById('lblAct');
const lblTrick=document.getElementById('lblTrick');
const rotateEl=document.getElementById('rotate');
let lastActLbl='',lastTrickLbl='';

function syncUI(){
  const playing=(gs==='play');
  btnBack.style.display=(gs==='menu')?'none':'flex';
  btnPause.style.display=(playing||gs==='pause')?'flex':'none';
  btnPause.textContent=(gs==='pause')?'▶':'❚❚';
  if(padEl)padEl.classList.toggle('on',playing);

  if(!playing)return;
  // Action principale
  let a,t2;
  if(P.state==='swing'){a=t('release');t2=t('pump');}
  else if(P.state==='run'){a=t('jump');t2=t('trick');}
  else{a=nearBar?t('grab'):t('jump');t2=t('trick');}
  if(a!==lastActLbl){lblAct.textContent=a;lastActLbl=a;}
  if(t2!==lastTrickLbl){lblTrick.textContent=t2;lastTrickLbl=t2;}
  // Pulsation quand une action à forte valeur est disponible
  if(elAct)elAct.classList.toggle('ready',!!nearBar&&nearDist<CFG.GRAB_R);
  if(elTrick)elTrick.classList.toggle('ready',
    P.state==='swing'&&Math.abs(P.ang)<CFG.PUMP_WIN);
}

btnBack.addEventListener('click',e=>{
  e.preventDefault();sfx('ui');
  if(gs==='settings')closeSettings();
  else if(gs==='levelselect')closeLevelSelect();
  else toMenu();
});
btnPause.addEventListener('click',e=>{e.preventDefault();sfx('ui');togglePause();});
btnFull.addEventListener('click',e=>{
  e.preventDefault();sfx('ui');
  const d=document,el=d.documentElement;
  const isFull=d.fullscreenElement||d.webkitFullscreenElement;
  if(!isFull){
    const fn=el.requestFullscreen||el.webkitRequestFullscreen;
    if(fn)fn.call(el).catch(()=>{});
    btnFull.textContent='✕';
  } else {
    const fn=d.exitFullscreen||d.webkitExitFullscreen;
    if(fn)fn.call(d).catch(()=>{});
    btnFull.textContent='⛶';
  }
});

// Mise en pause automatique : appel entrant, changement d'onglet.
document.addEventListener('visibilitychange',()=>{
  if(document.hidden&&gs==='play')togglePause();
});
window.addEventListener('blur',()=>{if(gs==='play')togglePause();});

/* ─────────────────────────────────────────────────────────────
   26. INITIALISATION
   ───────────────────────────────────────────────────────────── */
function onResize(){resize();updateView();}
window.removeEventListener('resize',resize);
window.addEventListener('resize',onResize);

// Le menu laisse choisir le personnage au clavier (le tactile et la
// souris passent par les zones enregistrées dans drawMenu).
addEventListener('keydown',e=>{
  if(gs!=='menu')return;
  const k=e.key.length===1?e.key.toLowerCase():e.key;
  if(k==='arrowleft'||k==='a'||k==='q')menuSel=0;
  if(k==='ArrowLeft')menuSel=0;
  if(k==='ArrowRight')menuSel=1;
  if(k==='d')menuSel=1;
  P.char=menuSel===0?'marc':'claire';
});

function init(){
  onResize();
  initFX();
  P.char=SV.char||'marc';
  menuSel=P.char==='claire'?1:0;
  TH=THEMES[0];
  buildLevel(0,1);
  spawnPlayer();
  gs='menu';
  requestAnimationFrame(frameLoop);
}
init();
</script>
